/* ---------- Formulário do pedido ---------- */
function linhaFafdHTML(v = {}) {
  return `<div class="fi-linha" data-fi data-id="${v.id || ''}">
    ${campoMaterial(v.material || '', { compacto: true, rotulo: 'Material' })}
    <input name="tamanho" list="dl-tamanhos" value="${esc(v.tamanho || '')}" placeholder="Tam." aria-label="Tamanho">
    <input name="descricao" class="fi-desc" value="${esc(v.descricao || '')}" placeholder="Especificação / observação" aria-label="Especificação">
    <input name="quantidade_solicitada" type="number" min="0.01" step="any" inputmode="decimal" value="${esc(v.quantidade_solicitada || '')}" placeholder="Qtd" aria-label="Quantidade solicitada">
    <button type="button" class="btn-ic" data-fi-rem aria-label="Remover item" title="Remover item">${ic('x')}</button>
    ${v.quantidade_recebida > 0 ? `<span class="fi-rec">Já recebido: ${fmtNum(v.quantidade_recebida)}</span>` : ''}
  </div>`;
}
function formFafd(f = null, preset = null) {
  const v = f || { data_pedido: hojeISO(), prioridade: 'NORMAL', situacao: 'ENVIADO', destino: 'DAL' };
  const linhas = f ? (IDX.itensFafd.get(f.id) || []).map(x => Object.assign({}, x, { material: catNome(x.catalogo_id) })) : (preset || [{}]);
  abrirForm({
    titulo: f ? `Editar FAFD ${f.numero}` : 'Novo pedido (FAFD)', largura: 'xl', botao: f ? 'Salvar alterações' : 'Registrar pedido',
    corpo: `
      <div class="grade g3">
        ${fld('Nº da FAFD', inp('numero', v.numero, { autofocus: true, maxlength: 40, placeholder: 'Ex.: 041/2026' }), { obrig: true })}
        ${fld('Data do pedido', inp('data_pedido', v.data_pedido, { type: 'date' }), { obrig: true })}
        ${fld('Processo SEI', inp('processo_sei', v.processo_sei, { class: 'mono', placeholder: 'Opcional' }))}
      </div>
      <div class="grade g3">
        ${fld('Destino (setor demandado)', inp('destino', v.destino, { list: 'dl-destinos', placeholder: 'Ex.: DAL' }))}
        ${fld('SB de destino', slc('sb_id', opcoesSbs(v.sb_id), v.sb_id, {}, 'Todo o 7º GB'))}
        ${fld('Prioridade', slc('prioridade', [['NORMAL', 'Normal'], ['URGENTE', 'Urgente']], v.prioridade))}
      </div>
      ${fld('Situação', slc('situacao', opcoesSit(SIT_FAFD).filter(([k]) => f || ['RASCUNHO', 'ENVIADO', 'EM_ANALISE'].includes(k)), v.situacao), { dica: 'Ao registrar recebimentos, a situação muda sozinha para "Atendido parcialmente" ou "Atendido".' })}
      <div class="fi-cab" aria-hidden="true"><span>Material</span><span>Tamanho</span><span>Especificação</span><span>Qtd</span><span></span></div>
      <div class="fi-lista" data-fi-lista>${linhas.map(linhaFafdHTML).join('')}</div>
      <button type="button" class="btn btn-sm btn-sec" data-fi-add>${ic('mais')}<span>Adicionar item</span></button>
      ${fld('Observação', txa('observacao', v.observacao, { rows: 2 }))}`,
    aoAbrir: form => {
      const lista = $('[data-fi-lista]', form);
      ligarMaterial(lista);
      $('[data-fi-add]', form).addEventListener('click', () => { lista.insertAdjacentHTML('beforeend', linhaFafdHTML()); ligarMaterial(lista); $('input', lista.lastElementChild).focus(); });
      lista.addEventListener('click', e => {
        const b = e.target.closest('[data-fi-rem]'); if (!b) return;
        const linha = b.closest('[data-fi]');
        if ($$('[data-fi]', lista).length > 1) linha.remove(); else $$('input', linha).forEach(x => x.value = '');
      });
    },
    aoSalvar: async (d, form) => {
      const linhasF = $$('[data-fi]', form).map(el => ({ id: el.dataset.id || null, material: $('[name=material]', el).value, tamanho: $('[name=tamanho]', el).value, descricao: $('[name=descricao]', el).value, quantidade_solicitada: $('[name=quantidade_solicitada]', el).value }))
        .filter(l => !vazio(l.material) || !vazio(l.quantidade_solicitada));
      const r = await salvarFafd(f, d, linhasF);
      toast(f ? 'Pedido atualizado.' : `FAFD ${r.numero} registrada.`);
      aposMudanca();
      if (preset && preset.aquisicoes) for (const a of preset.aquisicoes) await DB.atualizar('aquisicoes', a.id, { fafd_id: r.id, situacao: 'EM_PROCESSO' });
      if (preset && preset.aquisicoes) aposMudanca();
    }
  });
}

/* ---------- Recebimento ---------- */
function formRecebimento(f) {
  const pend = (IDX.itensFafd.get(f.id) || []).filter(x => Number(x.quantidade_recebida) < Number(x.quantidade_solicitada));
  if (!pend.length) { toast('Todos os itens deste pedido já foram recebidos.', 'info'); return; }
  const sbPadrao = f.sb_id || (S.sbs[0] || {}).id;
  abrirForm({
    titulo: `Registrar recebimento — FAFD ${f.numero}`, largura: 'xl', botao: 'Dar entrada na SB',
    subtitulo: 'Informe o que chegou. O material entra como "em condições de uso" na SB e no local escolhidos.',
    corpo: `
      <div class="grade g3">${fld('Data do recebimento', inp('data_receb', hojeISO(), { type: 'date' }))}</div>
      ${pend.map(x => {
        const c = IDX.cat.get(x.catalogo_id), falta = Number(x.quantidade_solicitada) - Number(x.quantidade_recebida);
        return `<div class="rc-item" data-rc="${x.id}">
          <div class="rc-cab"><strong>${esc(c ? c.nome : '')}${x.tamanho ? ' — tam. ' + esc(x.tamanho) : ''}</strong><span class="mudo">solicitado ${fmtNum(x.quantidade_solicitada)} · recebido ${fmtNum(x.quantidade_recebida)} · <b>pendente ${fmtNum(falta)} ${esc(c ? c.unidade : '')}</b></span></div>
          <div class="grade g3">
            ${fld('Recebido agora', inp('qtd', falta, { type: 'number', min: 0, max: falta, step: 'any', inputmode: 'decimal' }))}
            ${fld('Validade', inp('validade', '', { type: 'date' }))}
            ${c && c.usa_patrimonio ? fld('Patrimônios (um por linha)', txa('patrimonios', '', { rows: 2, placeholder: 'Opcional: cria um registro por patrimônio' })) : '<div></div>'}
          </div>
          ${camposLocalHTML({ sb_id: sbPadrao, viatura_id: '' }, { rotulo: 'Guardar na SB' })}
        </div>`;
      }).join('')}`,
    aoAbrir: form => $$('[data-rc]', form).forEach(ligarLocal),
    aoSalvar: async (d, form) => {
      const linhas = $$('[data-rc]', form).map(el => {
        const fi = S.fafd_itens.find(x => x.id === idNum(el.dataset.rc));
        const pega = n => { const x = $(`[name=${n}]`, el); return x ? x.value : ''; };
        return { fi, qtd: pega('qtd'), validade: pega('validade') || null, patrimonios: pega('patrimonios'), sb_id: pega('sb_id'), viatura_id: pega('viatura_id'), local_detalhe: pega('local_detalhe') };
      });
      const r = await receberFafd(IDX.fafd.get(f.id) || f, linhas, d.data_receb);
      toast(r.situacao === 'ATENDIDO' ? `FAFD ${r.numero} atendida por completo.` : `Recebimento registrado. FAFD ${r.numero} segue parcialmente atendida.`);
      aposMudanca();
    }
  });
}

/* ---------- Detalhe ---------- */
function detalheFafd(id) {
  const m = abrirModal({ titulo: 'Pedido (FAFD)', largura: 'xl', corpo: '<div data-det></div>' });
  const render = () => {
    const f = IDX.fafd.get(id);
    if (!f) { fecharModal(m); return; }
    const p = progressoFafd(f);
    const aberta = (SIT_FAFD[f.situacao] || {}).aberta;
    const vinc = S.aquisicoes.filter(a => a.fafd_id === f.id);
    $('[data-det]', m.el).innerHTML = `
      <div class="det-cab">
        <div>
          <h3 class="det-tit">FAFD ${esc(f.numero)}</h3>
          <div class="det-sub">${fmtData(f.data_pedido)}${f.destino ? ' · destino ' + esc(f.destino) : ''}${f.sb_id ? ' · ' + esc(sbNome(f.sb_id)) : ''}</div>
          <div class="det-tags">${stBadge(SIT_FAFD, f.situacao)}${f.prioridade === 'URGENTE' ? '<span class="pr pr-alta">Urgente</span>' : ''}${f.processo_sei ? sei(f.processo_sei) : ''}</div>
        </div>
        <div class="det-acoes">
          ${podeEditar() && podeReceber(f) && p.rec < p.sol ? `<button type="button" class="btn btn-sm btn-pri" data-acao="fafd-receber" data-id="${f.id}">${ic('recebido')}<span>Registrar recebimento</span></button>` : ''}
          <button type="button" class="btn btn-sm" data-acao="fafd-copiar" data-id="${f.id}">${ic('copiar')}<span>Copiar relação</span></button>
          ${podeEditar() ? `<button type="button" class="btn btn-sm" data-acao="fafd-editar" data-id="${f.id}">${ic('lapis')}<span>Editar</span></button>
          <button type="button" class="btn btn-sm btn-perigo-sutil" data-acao="fafd-excluir" data-id="${f.id}">${ic('lixo')}<span>Excluir</span></button>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><div style="flex:1;min-width:220px">${barraProg(p)}</div><span class="mudo">${fmtNum(p.rec)} de ${fmtNum(p.sol)} unidades recebidas</span></div>
      ${podeEditar() && aberta ? `<div class="filtros" style="margin-bottom:12px"><span class="mudo">Mudar situação:</span>${['ENVIADO', 'EM_ANALISE', 'NEGADO', 'CANCELADO'].filter(k => k !== f.situacao).map(k => `<button type="button" class="btn btn-xs" data-acao="fafd-situacao" data-id="${f.id}" data-sit="${k}">${esc(SIT_FAFD[k].rotulo)}</button>`).join('')}</div>` : ''}
      ${tabela({ chave: 'fafd-itens-' + f.id, classe: 'tab-cards', linhas: p.its, colunas: [
        { id: 'mat', rotulo: 'Material', html: x => `<span class="forte">${esc(catNome(x.catalogo_id))}</span>${x.descricao ? `<small class="sub">${esc(x.descricao)}</small>` : ''}` },
        { id: 'tam', rotulo: 'Tam.', html: x => esc(x.tamanho || '—') },
        { id: 'sol', rotulo: 'Solicitado', classe: 'num', html: x => `${fmtNum(x.quantidade_solicitada)} <small class="mudo">${esc(unidadeDe(x.catalogo_id))}</small>` },
        { id: 'rec', rotulo: 'Recebido', classe: 'num', html: x => fmtNum(x.quantidade_recebida) },
        { id: 'pen', rotulo: 'Pendente', classe: 'num', html: x => { const r = Math.max(0, x.quantidade_solicitada - x.quantidade_recebida); return r ? `<b>${fmtNum(r)}</b>` : `<span class="st st-ok">${ic('check')}<span>ok</span></span>`; } }
      ] })}
      ${f.observacao ? `<p class="ajuda" style="margin-top:12px">${esc(f.observacao)}</p>` : ''}
      ${vinc.length ? `<p class="ajuda" style="margin-top:8px">Atende ${plural(vinc.length, 'necessidade de aquisição', 'necessidades de aquisição')}: ${vinc.map(a => esc(catNome(a.catalogo_id))).join(', ')}.</p>` : ''}`;
  };
  m.renovar = render;
  render();
}

ACOES['fafd-novo'] = () => formFafd();
ACOES['fafd-ver'] = el => detalheFafd(idNum(el.dataset.id));
ACOES['fafd-editar'] = el => { const f = IDX.fafd.get(idNum(el.dataset.id)); if (f) formFafd(f); };
ACOES['fafd-receber'] = el => { const f = IDX.fafd.get(idNum(el.dataset.id)); if (f) formRecebimento(f); };
ACOES['fafd-copiar'] = el => { const f = IDX.fafd.get(idNum(el.dataset.id)); if (f) copiarTexto(textoFafd(f)); };
ACOES['fafd-situacao'] = async el => {
  const f = IDX.fafd.get(idNum(el.dataset.id)); if (!f) return;
  const sit = el.dataset.sit;
  if ((sit === 'NEGADO' || sit === 'CANCELADO') && !await confirmar({ titulo: `Marcar como ${SIT_FAFD[sit].rotulo.toLowerCase()}`, mensagem: `A FAFD ${f.numero} sairá da lista de pedidos em aberto.`, botao: 'Confirmar' })) return;
  try { await DB.atualizar('fafd', f.id, { situacao: sit }); toast(`FAFD ${f.numero}: ${SIT_FAFD[sit].rotulo}.`); aposMudanca(); } catch (e) { erroToast(e); }
};
ACOES['fafd-excluir'] = async el => {
  const f = IDX.fafd.get(idNum(el.dataset.id)); if (!f) return;
  const p = progressoFafd(f);
  const aviso = p.rec > 0 ? ' Os itens já recebidos continuam nas SBs.' : '';
  if (!await confirmar({ titulo: 'Excluir pedido', mensagem: `Excluir a FAFD ${f.numero} e seus ${plural(p.its.length, 'item', 'itens')}?${aviso}`, botao: 'Excluir', perigo: true })) return;
  try { await DB.excluir('fafd', f.id); toast('Pedido excluído.'); aposMudanca(); } catch (e) { erroToast(e); }
};
ACOES['fafd-exportar'] = () => {
  const linhas = fafdFiltrados().flatMap(f => (IDX.itensFafd.get(f.id) || []).map(x => ({ f, x })));
  baixar(`pedidos-fafd-${hojeISO()}.csv`, gerarCSV([
    ['fafd', r => r.f.numero], ['data', r => fmtData(r.f.data_pedido)], ['destino', r => r.f.destino], ['processo_sei', r => r.f.processo_sei], ['sb', r => r.f.sb_id ? sbNome(r.f.sb_id) : ''],
    ['situacao', r => SIT_FAFD[r.f.situacao].rotulo], ['material', r => catNome(r.x.catalogo_id)], ['tamanho', r => r.x.tamanho], ['especificacao', r => r.x.descricao],
    ['solicitado', r => fmtNum(r.x.quantidade_solicitada)], ['recebido', r => fmtNum(r.x.quantidade_recebida)], ['pendente', r => fmtNum(Math.max(0, r.x.quantidade_solicitada - r.x.quantidade_recebida))]
  ], linhas));
};


/* ---- 55_aquisicoes.js ---- */
/* =====================================================================
   NECESSIDADES DE AQUISIÇÃO
   ===================================================================== */
const FA = { busca: '', situacao: 'ABERTAS', prioridade: '', categoria: '', sugAberta: false };
const SEL_AQ = new Set();

function aquisicoesFiltradas() {
  const t = norm(FA.busca).split(' ').filter(Boolean);
  return S.aquisicoes.filter(a => {
    if (FA.situacao === 'ABERTAS' ? !aquisicaoAberta(a) : (FA.situacao && a.situacao !== FA.situacao)) return false;
    if (FA.prioridade && a.prioridade !== FA.prioridade) return false;
    const c = IDX.cat.get(a.catalogo_id);
    if (FA.categoria && (!c || c.categoria !== FA.categoria)) return false;
    if (t.length) { const x = norm([c && c.nome, a.descricao, a.justificativa, a.numero_dfd, a.processo_sei, a.observacao].join(' ')); if (!t.every(p => x.includes(p))) return false; }
    return true;
  }).sort((a, b) => (PRIORIDADES[a.prioridade].peso - PRIORIDADES[b.prioridade].peso) || cmp(a.data_identificacao, b.data_identificacao));
}
const totalAq = a => (Number(a.valor_unitario) || 0) * (Number(a.quantidade) || 0);
const COLUNAS_AQ = [
  { id: 'sel', rotulo: '', classe: 'col-acoes', html: a => aquisicaoAberta(a) && ehGeral() ? `<input type="checkbox" class="chk-aq" data-sel-aq="${a.id}" aria-label="Selecionar para gerar FAFD"${SEL_AQ.has(a.id) ? ' checked' : ''}>` : '' },
  { id: 'prio', rotulo: 'Prioridade', ordem: a => PRIORIDADES[a.prioridade].peso, html: a => prBadge(a.prioridade) },
  { id: 'mat', rotulo: 'Material', ordem: a => catNome(a.catalogo_id), html: a => `<div class="cel-mat"><span class="nome">${esc(catNome(a.catalogo_id))}</span><span class="meta">${tagCat(IDX.cat.get(a.catalogo_id))}${a.descricao ? `<span>${esc(a.descricao)}</span>` : ''}</span></div>` },
  { id: 'qtd', rotulo: 'Qtd', classe: 'num', ordem: a => Number(a.quantidade), html: a => `${fmtNum(a.quantidade)} <small class="mudo">${esc(unidadeDe(a.catalogo_id))}</small>` },
  { id: 'vu', rotulo: 'Valor unit.', classe: 'num', ordem: a => Number(a.valor_unitario), html: a => a.valor_unitario ? fmtMoeda(a.valor_unitario) : '<span class="mudo">—</span>' },
  { id: 'tot', rotulo: 'Total estimado', classe: 'num', ordem: totalAq, html: a => a.valor_unitario ? `<b>${fmtMoeda(totalAq(a))}</b>` : '<span class="mudo">—</span>' },
  { id: 'orig', rotulo: 'Origem', ordem: a => a.origem, html: a => `<span class="mudo">${esc(ORIGENS_AQUISICAO[a.origem] || '')}</span>${a.sb_id ? `<small class="sub">${esc(sbNome(a.sb_id))}</small>` : ''}` },
  { id: 'sit', rotulo: 'Situação', ordem: a => a.situacao, html: a => stBadge(SIT_AQUISICAO, a.situacao) + (a.fafd_id && IDX.fafd.get(a.fafd_id) ? `<small class="sub"><button type="button" class="lnk" data-acao="fafd-ver" data-id="${a.fafd_id}">FAFD ${esc(IDX.fafd.get(a.fafd_id).numero)}</button></small>` : '') },
  { id: 'doc', rotulo: 'DFD / SEI', ordem: a => a.numero_dfd || a.processo_sei, html: a => `${a.numero_dfd ? `<span>${esc(a.numero_dfd)}</span>` : ''}${a.processo_sei ? `<small class="sub mono">${esc(a.processo_sei)}</small>` : ''}${!a.numero_dfd && !a.processo_sei ? '<span class="mudo">—</span>' : ''}` },
  { id: 'pca', rotulo: 'PCA', ordem: a => a.incluida_pca ? a.ano_pca || 1 : 0, html: a => a.incluida_pca ? `<span class="st st-ok">${ic('check')}<span>${a.ano_pca || 'sim'}</span></span>` : '<span class="mudo">não</span>' },
  { id: 'acoes', rotulo: '', classe: 'col-acoes', html: a => podeEditar() ? `<div class="acoes-linha"><button type="button" class="btn-ic" data-acao="aq-editar" data-id="${a.id}" title="Editar" aria-label="Editar necessidade">${ic('lapis')}</button><button type="button" class="btn-ic" data-acao="aq-excluir" data-id="${a.id}" title="Excluir" aria-label="Excluir necessidade">${ic('lixo')}</button></div>` : '' }
];

VIEWS.aquisicoes = {
  titulo: 'Necessidades de aquisição',
  sub: () => ehGeral() ? 'Levantamento para DFD, PCA e processos de aquisição' : `Necessidades da ${sbNome(minhaSb())} para a Seção de Material`,
  render(el) {
    el.innerHTML = `
      <div class="resumo-faixa" id="aq-resumo"></div>
      <div id="aq-sug"></div>
      <div class="cab-pagina">
        <div class="filtros" id="aq-filtros">
          <input type="search" id="aq-busca" value="${esc(FA.busca)}" placeholder="Buscar material, justificativa, DFD, SEI…" aria-label="Buscar necessidade">
          ${slc('situacao', [['ABERTAS', 'Em aberto'], ...opcoesSit(SIT_AQUISICAO)], FA.situacao, { id: 'aq-sit', 'data-faq': 'situacao', 'aria-label': 'Situação' }, 'Todas')}
          ${slc('prioridade', Object.entries(PRIORIDADES).map(([k, p]) => [k, p.rotulo]), FA.prioridade, { id: 'aq-prio', 'data-faq': 'prioridade', 'aria-label': 'Prioridade' }, 'Todas as prioridades')}
          ${slc('categoria', Object.entries(CATEGORIAS).map(([k, c]) => [k, c.rotulo]), FA.categoria, { id: 'aq-cat', 'data-faq': 'categoria', 'aria-label': 'Categoria' }, 'Todas as categorias')}
        </div>
        <div class="acoes" id="aq-acoes"></div>
      </div>
      <section class="painel"><div class="painel-cab"><span class="painel-sub" id="aq-total"></span></div><div class="painel-corpo sem-pad" id="aq-res"></div></section>`;
    const f = $('#aq-filtros', el);
    f.addEventListener('input', debounce(e => { if (e.target.id === 'aq-busca') { FA.busca = e.target.value; this.atualizar(); } }, 160));
    f.addEventListener('change', e => { const s = e.target.closest('[data-faq]'); if (s) { FA[s.dataset.faq] = s.value; this.atualizar(); } });
    $('#aq-sug', el).addEventListener('toggle', e => { if (e.target.matches('[data-sug]')) FA.sugAberta = e.target.open; }, true);
    $('#aq-res', el).addEventListener('change', e => {
      const c = e.target.closest('[data-sel-aq]'); if (!c) return;
      const id = idNum(c.dataset.selAq);
      if (c.checked) SEL_AQ.add(id); else SEL_AQ.delete(id);
      this.atualizarAcoes();
    });
    this.atualizar();
  },
  atualizarAcoes() {
    const a = $('#aq-acoes'); if (!a) return;
    a.innerHTML = `${ehGeral() && SEL_AQ.size ? `<button type="button" class="btn" data-acao="aq-gerar-fafd">${ic('prancheta')}<span>Gerar FAFD com ${SEL_AQ.size} selecionada(s)</span></button>` : ''}
      ${podeEditar() ? `<button type="button" class="btn btn-pri" data-acao="aq-nova">${ic('mais')}<span>Nova necessidade</span></button>` : ''}
      <button type="button" class="btn" data-acao="aq-exportar">${ic('baixar')}<span>Exportar CSV</span></button>`;
  },
  atualizar() {
    const res = $('#aq-res'); if (!res) return;
    for (const id of [...SEL_AQ]) { const a = S.aquisicoes.find(x => x.id === id); if (!a || !aquisicaoAberta(a)) SEL_AQ.delete(id); }
    const abertas = S.aquisicoes.filter(aquisicaoAberta);
    const kp = (rot, val, sub, icone, cls = '') => `<div class="kpi ${cls}"><span class="kpi-rot">${ic(icone)}<span class="kpi-rot-t">${esc(rot)}</span></span><span class="kpi-val">${val}</span><span class="kpi-sub">${sub}</span></div>`;
    $('#aq-resumo').innerHTML =
      kp('Em aberto', fmtNum(abertas.length), `${fmtNum(abertas.filter(a => a.situacao === 'IDENTIFICADA').length)} ainda sem DFD`, 'alvo') +

function formAquisicao(a = null, preset = {}) {
  const v = a ? Object.assign({}, a, { material: catNome(a.catalogo_id) }) : Object.assign({ prioridade: 'MEDIA', situacao: 'IDENTIFICADA', origem: ehGeral() ? 'LEVANTAMENTO' : 'SOLICITACAO', sb_id: minhaSb(), data_identificacao: hojeISO(), ano_pca: new Date().getFullYear() + 1 }, preset, { material: preset.catalogo_id ? catNome(preset.catalogo_id) : '' });
  abrirForm({
    titulo: a ? 'Editar necessidade de aquisição' : 'Nova necessidade de aquisição', largura: 'lg',
    corpo: `
      ${campoMaterial(v.material)}
      ${fld('Especificação / complemento', inp('descricao', v.descricao, { maxlength: 300, placeholder: 'Ex.: classe V, homologado; compatível com o modelo X' }))}
      <div class="grade g3">
        ${fld('Quantidade', inp('quantidade', v.quantidade, { type: 'number', min: '0.01', step: 'any', inputmode: 'decimal' }), { obrig: true })}
        ${fld('Valor unitário estimado (R$)', inp('valor_unitario', v.valor_unitario ?? '', { inputmode: 'decimal', placeholder: '0,00' }), { dica: 'Pesquisa de preços preliminar' })}
        ${fld('Prioridade', slc('prioridade', Object.entries(PRIORIDADES).map(([k, p]) => [k, p.rotulo]), v.prioridade))}
      </div>
      <div class="grade g3">
        ${fld('Origem da necessidade', slc('origem', Object.entries(ORIGENS_AQUISICAO), v.origem))}
        ${ehGeral() ? fld('SB demandante', slc('sb_id', opcoesSbs(v.sb_id), v.sb_id, {}, 'Todo o 7º GB')) : `<div class="fld"><span class="fld-rot">SB demandante</span><div class="fixo">${esc(sbRotulo(minhaSb()))}</div><input type="hidden" name="sb_id" value="${minhaSb()}"></div>`}
        ${fld('Identificada em', inp('data_identificacao', v.data_identificacao, { type: 'date' }))}
      </div>
      ${fld('Justificativa', txa('justificativa', v.justificativa, { rows: 3, placeholder: 'Por que é necessário, impacto se não adquirir, memória de cálculo do quantitativo' }))}
      <fieldset class="grupo"><legend>Andamento</legend>
        <div class="grade g3">
          ${fld('Situação', slc('situacao', opcoesSit(SIT_AQUISICAO), v.situacao))}
          ${fld('Nº do DFD', inp('numero_dfd', v.numero_dfd, { placeholder: 'Ex.: DFD 012/2026' }))}
          ${fld('Processo SEI', inp('processo_sei', v.processo_sei, { class: 'mono' }))}
        </div>
        <div class="linha-chk" style="align-items:center">${chk('incluida_pca', v.incluida_pca, 'Incluída no Plano de Contratações Anual (PCA)', { 'data-pca': '' })}
          <label class="fld" style="flex-direction:row;align-items:center;gap:8px" data-ano-pca${v.incluida_pca ? '' : ' hidden'}><span class="fld-rot">Ano do PCA</span><input name="ano_pca" type="number" min="2020" max="2100" value="${esc(v.ano_pca || '')}" style="width:100px"></label></div>
      </fieldset>
      ${fld('Observação', txa('observacao', v.observacao, { rows: 2 }))}`,
    aoAbrir: form => {
      ligarMaterial(form);
      const p = $('[data-pca]', form);
      p.addEventListener('change', () => { $('[data-ano-pca]', form).hidden = !p.checked; });
    },
    aoSalvar: async d => {
      const c = exigirMaterial(d.material);
      const vu = num(d.valor_unitario);
      if (!vazio(d.valor_unitario) && vu === null) throw new ErroApp('Valor unitário inválido. Use o formato 1.234,56.');
      const dados = { catalogo_id: c.id, descricao: limpa(d.descricao), quantidade: num(d.quantidade), valor_unitario: vu, prioridade: d.prioridade, origem: d.origem, sb_id: idNum(d.sb_id), data_identificacao: d.data_identificacao || hojeISO(), justificativa: limpa(d.justificativa), situacao: d.situacao, numero_dfd: limpa(d.numero_dfd), processo_sei: limpa(d.processo_sei), incluida_pca: !!d.incluida_pca, ano_pca: d.incluida_pca ? idNum(d.ano_pca) : null, observacao: limpa(d.observacao) };
      if (a) await DB.atualizar('aquisicoes', a.id, dados); else await DB.inserir('aquisicoes', dados);
      toast(a ? 'Necessidade atualizada.' : 'Necessidade de aquisição registrada.');
      aposMudanca();
    }
  });
}

ACOES['aq-nova'] = () => formAquisicao();
ACOES['aq-editar'] = el => { const a = S.aquisicoes.find(x => x.id === idNum(el.dataset.id)); if (a) formAquisicao(a); };
ACOES['aq-sugestao'] = el => formAquisicao(null, { catalogo_id: idNum(el.dataset.cat), quantidade: num(el.dataset.qtd), origem: el.dataset.origem, prioridade: el.dataset.origem === 'ESTOQUE_MINIMO' ? 'ALTA' : 'MEDIA' });
ACOES['aq-excluir'] = async el => {
  const a = S.aquisicoes.find(x => x.id === idNum(el.dataset.id)); if (!a) return;
  if (!await confirmar({ titulo: 'Excluir necessidade', mensagem: `Excluir a necessidade de ${fmtNum(a.quantidade)} × ${catNome(a.catalogo_id)}? Para registrar que não será mais adquirida, prefira a situação "Cancelada".`, botao: 'Excluir', perigo: true })) return;

};
ACOES['aq-gerar-fafd'] = () => {
  const sel = S.aquisicoes.filter(a => SEL_AQ.has(a.id));

  SEL_AQ.clear();
};
ACOES['aq-exportar'] = () => baixar(`necessidades-aquisicao-${hojeISO()}.csv`, gerarCSV([

  ['quantidade', a => fmtNum(a.quantidade)], ['unidade', a => unidadeDe(a.catalogo_id)], ['valor_unitario', a => a.valor_unitario ? NF.format(a.valor_unitario) : ''], ['total_estimado', a => a.valor_unitario ? NF.format(totalAq(a)) : ''],
  ['origem', a => ORIGENS_AQUISICAO[a.origem]], ['sb', a => a.sb_id ? sbNome(a.sb_id) : ''], ['justificativa', 'justificativa'], ['situacao', a => SIT_AQUISICAO[a.situacao].rotulo],
  ['numero_dfd', 'numero_dfd'], ['processo_sei', 'processo_sei'], ['pca', a => a.incluida_pca ? (a.ano_pca || 'sim') : 'não'], ['identificada_em', a => fmtData(a.data_identificacao)]
], aquisicoesFiltradas()));

/* ---------- Importação ---------- */
function janelaImportacao(tipo) {
  const itens = tipo === 'itens';
  const titulo = itens ? 'Importar material de planilha' : 'Importar militares de planilha';
  const modelo = itens ? MODELO_CSV_ITENS : MODELO_CSV_MILITARES;
  let prep = null;
  const m = abrirModal({
    titulo, largura: 'xl', fecharNoFundo: false,
    subtitulo: itens ? 'Colunas reconhecidas: material, area, especificar, unidade, patrimonio, numero_serie, marca_modelo, tamanho, quantidade, sb, viatura, compartimento, situacao, avaria, validade, observacao.'
      : 'Colunas reconhecidas: ordem, posto, nome, nome_guerra, matricula, sb, funcao, telefone, situacao.',
    corpo: `<div class="form">
      <div class="aviso aviso-info">${ic('info')}<div>Salve a planilha como <b>CSV</b> (no Excel: Arquivo › Salvar como › CSV) e escolha o arquivo, ou <b>copie as células</b> (com o cabeçalho) e cole na caixa abaixo. ${itens ? `Material igual no mesmo local é somado ao registro existente. ${ehGeral() ? 'Materiais fora do catálogo são cadastrados se a coluna "area" estiver preenchida.' : 'Sem a coluna "sb", tudo entra na ' + esc(sbNome(minhaSb())) + '.'}` : (ehGeral() ? 'A coluna "sb" aceita 1ª SB, 2, Goiana…; vazia = Comando/ADM.' : 'Sem a coluna "sb", os militares entram na ' + esc(sbNome(minhaSb())) + '.')}</div></div>
      <div class="lista-acoes">
        <label class="btn">${ic('subir')}<span>Escolher arquivo CSV</span><input type="file" accept=".csv,.txt,text/csv" data-arq hidden></label>
        <button type="button" class="btn" data-modelo>${ic('baixar')}<span>Baixar modelo de planilha</span></button>
        <button type="button" class="btn" data-ver-modelo>${ic('olho')}<span>Ver modelo</span></button>
      </div>
      ${fld('Ou cole aqui as linhas da planilha', txa('texto', '', { rows: 6, class: 'mono', 'data-texto': '', placeholder: itens ? 'material;area;quantidade;sb;viatura…' : 'posto;nome;matricula;sb…' }))}
      <div data-prev></div>
    </div>`,
    rodape: `<button type="button" class="btn" data-fechar>Cancelar</button><button type="button" class="btn btn-sec" data-analisar>${ic('olho')}<span>Analisar</span></button><button type="button" class="btn btn-pri" data-importar disabled>${ic('subir')}<span>Importar</span></button>`
  });
  const texto = $('[data-texto]', m.el), prev = $('[data-prev]', m.el), btnImp = $('[data-importar]', m.el);
  const analisar = () => {
    btnImp.disabled = true; prep = null;
    if (vazio(texto.value)) { prev.innerHTML = ''; return; }
    try {
      prep = itens ? prepararImportItens(texto.value) : prepararImportMilitares(texto.value);
      const ok = prep.linhas.filter(l => !l.erros.length).length, err = prep.linhas.length - ok;
      const novos = itens ? [...prep.novosMateriais.values()].length : 0;
      prev.innerHTML = `<div class="imp-resumo"><span class="st st-ok">${ic('check')}<span>${plural(ok, 'linha válida', 'linhas válidas')}</span></span>${err ? `<span class="st st-bad">${ic('alerta')}<span>${plural(err, 'linha com erro', 'linhas com erro')} (não serão importadas)</span></span>` : ''}${novos ? `<span class="st st-info">${ic('tag')}<span>${plural(novos, 'material novo', 'materiais novos')} no catálogo</span></span>` : ''}</div>
        <div class="imp-prev" style="margin-top:10px"><table class="tab"><thead><tr><th>Linha</th><th>${itens ? 'Material' : 'Militar'}</th><th>${itens ? 'Qtd / local' : 'SB'}</th><th>Resultado</th></tr></thead><tbody>
        ${prep.linhas.slice(0, 300).map(l => `<tr><td class="num">${l.n}</td><td>${esc(itens ? l.nome : `${l.dados.posto_grad || '?'} ${l.nome}`)}</td><td>${itens ? `${fmtNum(l.dados.quantidade)} · ${esc(l.dados.sb_id ? sbNome(l.dados.sb_id) : '?')} · ${esc(l.dados.viatura_id ? viaturaPref(l.dados.viatura_id) : LOCAL_SALA)}` : esc(l.dados.sb_id ? sbNome(l.dados.sb_id) : 'Comando / ADM')}</td><td>${l.erros.length ? `<span class="imp-erro">${esc(l.erros.join('; '))}</span>` : '<span class="imp-ok">ok</span>'}</td></tr>`).join('')}
        </tbody></table></div>${prep.linhas.length > 300 ? `<p class="ajuda">Mostrando 300 de ${prep.linhas.length} linhas.</p>` : ''}`;
      btnImp.disabled = !ok;
      $('span', btnImp).textContent = ok ? `Importar ${plural(ok, 'linha', 'linhas')}` : 'Importar';
    } catch (e) { prev.innerHTML = `<div class="form-erro">${esc(e.message)}</div>`; }
  };
  $('[data-arq]', m.el).addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { texto.value = await lerArquivoTexto(f); analisar(); } catch (er) { erroToast(er); }
  });
  texto.addEventListener('input', debounce(analisar, 400));
  $('[data-analisar]', m.el).addEventListener('click', analisar);
  $('[data-modelo]', m.el).addEventListener('click', () => baixar(itens ? 'modelo-importacao-material.csv' : 'modelo-importacao-militares.csv', modelo));
  $('[data-ver-modelo]', m.el).addEventListener('click', () => { texto.value = modelo.replace(/^﻿/, ''); analisar(); });
  btnImp.addEventListener('click', async () => {
    if (!prep) return;
    btnImp.disabled = true; btnImp.classList.add('carregando');
    try {
      if (itens) { const r = await executarImportItens(prep); toast(`${plural(r.itens, 'linha importada', 'linhas importadas')}${r.materiais ? `; ${plural(r.materiais, 'material novo', 'materiais novos')} no catálogo` : ''}.`); }
      else { const n = await executarImportMilitares(prep); toast(`${plural(n, 'militar importado', 'militares importados')}.`); }
      fecharModal(m); aposMudanca();
    } catch (e) { erroToast(e); btnImp.disabled = false; }
    finally { btnImp.classList.remove('carregando'); }
  });
}

const FAV = { sb: '', situacao: '', categoria: '', busca: '' };

function avariadosFiltrados() {
  const t = norm(FAV.busca).split(' ').filter(Boolean);
  return S.itens.filter(i => {
    if (i.situacao === 'OPERACIONAL') return false;
    if (FAV.sb && i.sb_id !== +FAV.sb) return false;
    if (FAV.situacao && i.situacao !== FAV.situacao) return false;
    const c = catDe(i);
    if (FAV.categoria && (!c || c.categoria !== FAV.categoria)) return false;
    if (t.length) { const x = norm([c && c.nome, i.avaria, i.avaria_sei, i.manutencao_local, i.observacao, i.patrimonio, viaturaPref(i.viatura_id), sbNome(i.sb_id)].join(' ')); if (!t.every(p => x.includes(p))) return false; }
    return true;
  }).sort((a, b) => cmp(a.situacao_desde, b.situacao_desde) || cmp(catNome(a.catalogo_id), catNome(b.catalogo_id)));
}

/* =====================================================================

   A senha nunca fica no código: no sistema publicado ela é conferida
   pelo Supabase (uma conta por perfil, em Authentication › Users).

const ARMAZ = {
  ler(chave, aba = false) { try { return (aba ? sessionStorage : localStorage).getItem(chave); } catch (e) { return null; } },
  gravar(chave, valor, aba = false) { try { (aba ? sessionStorage : localStorage).setItem(chave, valor); } catch (e) { /* sem armazenamento */ } },
  remover(chave, aba = false) { try { (aba ? sessionStorage : localStorage).removeItem(chave); } catch (e) { /* sem armazenamento */ } }
};
const CHAVE_NOME_ABA = 'smat-nome';      // nesta aba: nome informado na entrada
const CHAVE_NOME = 'smat-nome-sugestao'; // neste navegador: último nome usado (sugestão)
const CHAVE_PERFIL = 'smat-ultimo-perfil';

function seloHTML() { return esc(CFG.UNIDADE_SIGLA).split(/\s+/).join('<br>'); }

/* ---------- Tela de entrada ---------- */

  </div>`;
  try { PERFIS_ENTRADA = await ADAPTER.perfisAcesso(); }
  catch (e) { telaErro(traduzirErro(e).message); return; }

}
function passoPerfis(msg = null) {

        ${ic('seta')}
      </button>`).join('') || '<p class="erro-txt">Nenhum perfil ativo. Execute o script 01_estrutura.sql no Supabase.</p>'}
    </div>`;
  box.querySelectorAll('[data-perfil]').forEach(b => b.addEventListener('click', () => passoSenha(PERFIS_ENTRADA.find(p => p.id === Number(b.dataset.perfil)))));
  const alvo = box.querySelector('.perfil-btn.ultimo') || box.querySelector('.perfil-btn');
  if (alvo) alvo.focus();
}
function passoSenha(p) {
  const box = $('#acesso-form'); if (!box || !p) return;
  box.innerHTML = `<button type="button" class="lnk acesso-voltar" data-voltar>${ic('desfazer')}Trocar de perfil</button>
    <div class="perfil-escolhido"><span class="perfil-ic">${ic(p.papel === 'GERAL' ? 'escudo' : 'predio')}</span><div><b>${esc(p.rotulo)}</b><small>${p.papel === 'GERAL' ? 'Acesso a todas as SBs' : 'Acesso só à ' + esc(p.sb_nome || '') + (p.cidade ? ' · ' + esc(p.cidade) : '')}</small></div></div>
    <form class="form" novalidate>
      <div class="form-erro" role="alert" hidden></div>
      ${fld('Senha', inp('senha', '', { type: 'password', autocomplete: 'current-password', maxlength: 128, autofocus: true }), { obrig: true })}
      ${fld('Seu nome (opcional)', inp('nome', ARMAZ.ler(CHAVE_NOME) || '', { maxlength: 60, placeholder: 'Ex.: 3º Sgt Fulano' }), { dica: 'Fica no histórico de cada alteração que você fizer.' })}
      <button type="submit" class="btn btn-pri btn-largo">${ic('chaveAcesso')}<span>Entrar</span></button>
    </form>`;
  $('[data-voltar]', box).addEventListener('click', () => passoPerfis());
  const form = $('form', box), erro = $('.form-erro', box), btn = $('button[type=submit]', box);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (btn.disabled) return;
    erro.hidden = true; btn.disabled = true; btn.classList.add('carregando');
    try { await entrar(p, form.senha.value, form.nome.value); }
    catch (er) { erro.textContent = traduzirErro(er).message; erro.hidden = false; form.senha.select(); }
    finally { btn.disabled = false; btn.classList.remove('carregando'); }
  });

function sessaoDoPerfil(perfil, nome, contaId = null) {
  return { perfilId: perfil.id, rotulo: perfil.rotulo, papel: perfil.papel, sbId: perfil.papel === 'SB' ? Number(perfil.sb_id) : null, nome: limpa(nome), email: perfil.email, contaId };
}
async function entrar(p, senha, nome) {
  if (!senha) throw new ErroApp('Informe a senha.');
  nome = String(nome || '').trim().replace(/\s+/g, ' ').slice(0, 60);
  let sessao;
  if (MODO_DEMO) sessao = sessaoDoPerfil(await ADAPTER.entrar(p.id, senha), nome);
  else {
    const s = await ADAPTER.entrar(p.email, senha);
    const perfil = await ADAPTER.meuPerfil(s.user.id).catch(() => null);
    if (!perfil || !perfil.ativo) { await ADAPTER.sair().catch(() => {}); throw new ErroApp('Esta conta não tem perfil ativo no sistema. Confira o e-mail do perfil em Configurações (perfil Geral).'); }
    sessao = sessaoDoPerfil(perfil, nome, s.user.id);
  }
  SESSAO = sessao;
  ARMAZ.gravar(CHAVE_PERFIL, String(sessao.perfilId));
  if (nome) ARMAZ.gravar(CHAVE_NOME, nome);
  ARMAZ.gravar(CHAVE_NOME_ABA, nome || '', true);
  registrarAtividade();
  resetarFiltros();
  if (location.hash !== '#painel') history.replaceState(null, '', '#painel');   // ao entrar, sempre o painel
  try { await iniciarSessao(); }
  catch (e) {   // falhou a carga depois da senha aceita: desfaz a entrada e volta ao formulário com a mensagem
    SESSAO = null; ARMAZ.remover(CHAVE_NOME_ABA, true);
    try { await ADAPTER.sair(); } catch (_) { /* segue */ }
    for (const k of Object.keys(S)) S[k] = [];
    reindexar();
    $('#carregando').hidden = true; $('#app').hidden = true; $('#tela-acesso').hidden = false;
    throw e;
  }
}

/** Depois de entrar (ou ao reabrir a aba com a sessão ainda válida). */
async function iniciarSessao() {
  $('#tela-acesso').hidden = true; $('#carregando').hidden = false;
  $('#carregando-msg').textContent = 'Carregando os dados…';
  if (!MODO_DEMO) await ADAPTER.testarCabecalho();
  aplicarModo({ render: false });
  await carregarDados({ render: false });
  if (!MODO_DEMO) { try { BANCO_DESATUALIZADO = !(await ADAPTER.versaoBancoOk(VERSAO_BANCO_EXIGIDA)); } catch (e) { BANCO_DESATUALIZADO = false; } }
  if (!ehGeral() && rotaAtual && !rotaPermitida(rotaDoHash())) location.hash = 'painel';
  mostrarApp();
  if (!MODO_DEMO) assinarTempoReal();
}

/* ---------- Sair ---------- */
async function sair(motivo = 'manual') {
  if (!SESSAO) return;
  SESSAO = null;
  ARMAZ.remover(CHAVE_NOME_ABA, true);
  fecharTodosModais();
  try { await ADAPTER.sair(); } catch (e) { /* segue para a tela de entrada */ }
  for (const k of Object.keys(S)) S[k] = [];
  reindexar();
  resetarFiltros();
  const msgs = {
    manual: null,
    inatividade: { tipo: 'ok', texto: `Acesso encerrado após ${CFG.BLOQUEIO_INATIVIDADE_MIN} minutos sem uso.` },
    conta: { tipo: 'erro', texto: 'O perfil em uso foi alterado ou desativado pelo perfil Geral. Entre de novo.' },
    sessao: { tipo: 'erro', texto: 'A sessão terminou. Entre de novo para continuar.' }
  };
  await telaEntrada(msgs[motivo] || null);
}

/* ---------- Ao abrir o sistema: continua a sessão desta aba ---------- */
async function restaurarSessao() {
  const nome = ARMAZ.ler(CHAVE_NOME_ABA, true) || '';
  if (MODO_DEMO) {
    const p = await ADAPTER.perfilDaSessao();
    if (p) SESSAO = sessaoDoPerfil(p, nome);
    return !!SESSAO;
  }
  const s = await ADAPTER.sessao().catch(() => null);
  if (!s) return false;
  const perfil = await ADAPTER.meuPerfil(s.user.id).catch(() => null);
  if (!perfil || !perfil.ativo) { await ADAPTER.sair().catch(() => {}); return false; }
  SESSAO = sessaoDoPerfil(perfil, nome, s.user.id);
  return true;
}

    if (r.secao && r.secao !== secao) { secao = r.secao; cab = `<div class="nav-sec">${esc(r.secao)}</div>`; }

    return `${cab}<a href="#${r.id}"${r.id === rotaAtual ? ' aria-current="page"' : ''}>${ic(r.icone)}<span>${esc(rot)}</span>${cont[r.id] ? `<span class="nav-cont ${cont[r.id][1]}" title="${esc(cont[r.id][2])}">${cont[r.id][0]}</span>` : ''}</a>`;
  }).join('');
}
const TEMAS = { sistema: 'Tema do sistema', light: 'Tema claro', dark: 'Tema escuro' };
function temaAtual() { try { return localStorage.getItem('smat-tema') || 'sistema'; } catch (e) { return 'sistema'; } }
function aplicarTema(t) {
  if (t === 'sistema') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('smat-tema', t); } catch (e) { /* sem armazenamento */ }
}
function montarRodapeLateral() {

    <div class="lr-acoes"><button type="button" class="btn-nav" data-acao="tema">${ic('olho')}<span>${esc(TEMAS[temaAtual()])}</span></button><button type="button" class="btn-nav" data-acao="sair">${ic('sair')}<span>Sair</span></button></div>`;
}
/** Versão do banco que esta versão do site exige (script 03_atualizacao_v2.1.sql). */
const VERSAO_BANCO_EXIGIDA = '2.1.0';
let BANCO_DESATUALIZADO = false;

function setStatusVivo(on, texto) {

function marcarAtualizado() {

function renderizar() {
  if (!SESSAO) return;
  rotaAtual = rotaDoHash();
  const v = VIEWS[rotaAtual];
  $('#titulo-pagina').textContent = v.titulo;
  $('#sub-pagina').textContent = v.sub ? v.sub() : '';

  dicaEsconder();

  el.innerHTML = '';

  $('#app').classList.remove('menu-aberto');

}
/** Depois de qualquer alteração feita nesta sessão. */
function aposMudanca() {
  atualizarListasGlobais();
  montarNav();
  const v = VIEWS[rotaAtual];
  if (v && v.atualizar) v.atualizar();
  for (const m of MODAIS.slice()) if (m.renovar) m.renovar();
}
/** Depois de mudanças recebidas de outros usuários (não atrapalha quem está digitando). */
function atualizarAoVivo() {
  atualizarListasGlobais();
  montarNav();
  const v = VIEWS[rotaAtual];
  const digitando = document.activeElement && $('#conteudo').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (v) { if (digitando && v.atualizarRes) v.atualizarRes(); else if (!digitando && v.atualizar) v.atualizar(); }
  for (const m of MODAIS.slice()) if (m.renovar) m.renovar();
}
function reRender() {
  const v = VIEWS[rotaAtual];
  if (v) { if (v.atualizarRes) v.atualizarRes(); else if (v.atualizar) v.atualizar(); }
  for (const m of MODAIS.slice()) if (m.renovar) m.renovar();
}

/* ---------- Ações globais ---------- */
ACOES['ordenar'] = el => {
  const k = el.dataset.tab, c = el.dataset.col, o = ORDEM_TAB[k];
  ORDEM_TAB[k] = o && o.col === c ? (o.dir === 'asc' ? { col: c, dir: 'desc' } : null) : { col: c, dir: 'asc' };
  if (!ORDEM_TAB[k]) delete ORDEM_TAB[k];
  reRender();
};
ACOES['mostrar-mais'] = el => { const k = el.dataset.tab; LIMITE_TAB[k] = (LIMITE_TAB[k] || 120) + 300; reRender(); };
ACOES['ir'] = el => irPara(el.dataset.rota);
ACOES['tema'] = () => {
  const ordem = ['sistema', 'light', 'dark'];
  aplicarTema(ordem[(ordem.indexOf(temaAtual()) + 1) % ordem.length]);
  montarRodapeLateral();
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-acao]');
  if (!el) return;
  if (el.tagName === 'TR' && e.target.closest('input, select, textarea, label, a, button')) return;
  const fn = ACOES[el.dataset.acao];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  try { const r = fn(el, e); if (r && r.catch) r.catch(erroToast); } catch (er) { erroToast(er); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-acao]')) { e.preventDefault(); e.target.click(); }
  if (e.key === '/' && !MODAIS.length && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { const b = $('#busca-global'); if (b && !$('#app').hidden) { e.preventDefault(); b.focus(); } }
});
function dicaBarra(seg) {

  dicaMostrar(seg, [

  ], l.dataset.rot);
}
document.addEventListener('pointerover', e => { const s = e.target.closest && e.target.closest('.seg'); if (s) dicaBarra(s); });
document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('.seg')) dicaEsconder(); });
document.addEventListener('focusin', e => { const s = e.target.closest && e.target.closest('.seg'); if (s) dicaBarra(s); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.seg')) dicaEsconder(); });
window.addEventListener('scroll', dicaEsconder, { passive: true });
window.addEventListener('hashchange', () => { if (!$('#app').hidden) renderizar(); });

/* ---------- Busca geral ---------- */
function buscaGeral(q) {
  const termos = norm(q).split(' ').filter(Boolean);
  if (!termos.length) return [];
  const casa = s => { const x = norm(s); return termos.every(p => x.includes(p)); };
  const exato = norm(q);
  const out = [];
  const its = [];
  for (const i of S.itens) {
    if (!casa([i.patrimonio, i.numero_serie, catNome(i.catalogo_id), i.marca_modelo, i.tamanho, viaturaPref(i.viatura_id)].join(' '))) continue;
    its.push({ tipo: 'Material', titulo: catNome(i.catalogo_id) + (i.patrimonio ? ` · patr. ${i.patrimonio}` : ` · ${fmtNum(i.quantidade)} ${unidadeDe(i.catalogo_id)}`), sub: `${localTexto(i)} · ${SIT_ITEM[i.situacao].curto}`, acao: 'item-ver', id: i.id, peso: (i.patrimonio && norm(i.patrimonio) === exato) || (i.numero_serie && norm(i.numero_serie) === exato) ? 0 : 3 });
  }
  its.sort((a, b) => a.peso - b.peso);
  out.push(...its.slice(0, 7));
  const r = resumoMateriais();
  out.push(...S.catalogo.filter(c => casa(c.nome) && (r.get(c.id) || { total: 0 }).total > 0).slice(0, 3).map(c => ({ tipo: 'Total', titulo: c.nome, sub: `${rotuloCategoria(c)} · ${fmtNum((r.get(c.id) || { op: 0 }).op)} em condições ${ehGeral() ? 'no 7º GB' : 'na SB'}`, acao: 'inv-ver-material', id: c.id, peso: 2 })));
  out.push(...S.militares.filter(m => casa([m.posto_grad, m.nome, m.nome_guerra, m.matricula].join(' '))).slice(0, 4).map(m => ({ tipo: 'Militar', titulo: militarRot(m), sub: `${m.nome}${m.matricula ? ' · ' + m.matricula : ''} · ${STATUS_EPI[statusEpiMilitar(m)].rotulo}`, acao: 'militar-ver', id: m.id, peso: m.matricula && norm(m.matricula) === exato ? 0 : 1 })));
  out.push(...S.viaturas.filter(v => casa([v.prefixo, v.tipo, v.placa].join(' '))).slice(0, 3).map(v => ({ tipo: 'Viatura', titulo: v.prefixo, sub: `${sbRotulo(v.sb_id)} · ${SIT_VIATURA[v.situacao].rotulo}`, acao: 'viatura-ver', id: v.id, peso: norm(v.prefixo) === exato ? 0 : 1 })));
  if (ehGeral()) out.push(...S.fafd.filter(f => casa(['fafd', f.numero, f.processo_sei, f.destino].join(' '))).slice(0, 3).map(f => ({ tipo: 'FAFD', titulo: `FAFD ${f.numero}`, sub: `${fmtData(f.data_pedido)} · ${SIT_FAFD[f.situacao].rotulo}`, acao: 'fafd-ver', id: f.id, peso: 1 })));
  out.push(...S.epis.filter(e => e.processo_sei && casa(e.processo_sei)).slice(0, 3).map(e => ({ tipo: 'EPI', titulo: `${tipoEpiNome(e.tipo_id)} — ${militarRot(IDX.militar.get(e.militar_id))}`, sub: `SEI ${e.processo_sei}`, acao: 'militar-ver', id: e.militar_id, peso: 1 })));
  return out.sort((a, b) => a.peso - b.peso).slice(0, 14);
}
function ligarBuscaGeral() {
  const inp = $('#busca-global'), res = $('#busca-res');
  $('#busca-ic').innerHTML = ic('busca');
  const fechar = () => { res.hidden = true; inp.setAttribute('aria-expanded', 'false'); };
  const mostrar = debounce(() => {
    const q = inp.value.trim();
    if (q.length < 2) { fechar(); return; }
    const r = buscaGeral(q);
    res.innerHTML = r.length ? r.map(x => `<button type="button" data-acao="${x.acao}" data-id="${x.id}"><span class="br-tipo">${esc(x.tipo)}</span><span class="br-txt"><span>${esc(x.titulo)}</span><small>${esc(x.sub)}</small></span></button>`).join('') : `<div class="br-vazio">Nada encontrado para "${esc(q)}".</div>`;
    res.hidden = false; inp.setAttribute('aria-expanded', 'true');
  }, 120);
  inp.addEventListener('input', mostrar);
  inp.addEventListener('focus', () => { if (inp.value.trim().length >= 2) mostrar(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Escape') { inp.value = ''; fechar(); inp.blur(); }
    if (e.key === 'ArrowDown') { const b = $('button', res); if (b) { e.preventDefault(); b.focus(); } }
    if (e.key === 'Enter') { const b = $('button', res); if (b && !res.hidden) { e.preventDefault(); b.click(); } }
  });
  res.addEventListener('keydown', e => {
    const bs = $$('button', res), i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && i < bs.length - 1) { e.preventDefault(); bs[i + 1].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? bs[i - 1] : inp).focus(); }
    if (e.key === 'Escape') { fechar(); inp.focus(); }
  });
  res.addEventListener('click', e => { if (e.target.closest('button')) { fechar(); inp.value = ''; } });
  document.addEventListener('click', e => { if (!e.target.closest('.busca-global')) fechar(); });
}

/* ---------- Tela de erro (configuração do Supabase) ---------- */
function telaErro(texto) {
  fecharTodosModais();
  $('#app').hidden = true; $('#carregando').hidden = true;
  const t = $('#tela-acesso'); t.hidden = false;
  t.innerHTML = `<div class="acesso-card">
    <div class="acesso-marca">
      <div class="marca-selo">${seloHTML()}</div>
      <h1>Controle<br>de Material</h1>
      <p>${esc(CFG.UNIDADE_NOME)} · ${esc(CFG.SECAO_NOME)}<br>${esc(CFG.ORGAO)}</p>
    </div>
    <div class="acesso-form">
      <h2>Não foi possível abrir o sistema</h2>
      <div class="acesso-msg erro" role="alert"></div>

      <button type="button" class="btn btn-pri" data-recarregar>${ic('atualizar')}<span>Tentar de novo</span></button>

/* ---------- Dados e tempo real ---------- */
function carregarScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = () => rej(new ErroApp('Não foi possível carregar a biblioteca do Supabase. Verifique a conexão com a internet.'));
    document.head.appendChild(s);
  });
}
let seqCarga = 0, ultimaCarga = 0;
async function carregarDados({ render = true, silencioso = false } = {}) {
  if (!SESSAO) return;
  const seq = ++seqCarga;
  const t = await ADAPTER.carregarTudo();
  if (seq !== seqCarga || !SESSAO) return;   // outra carga já está em andamento (ou saiu)
  for (const k of [...TABELAS, 'perfis', 'movimentacoes']) S[k] = (t[k] || []).map(r => normalizarLinha(k, r));
  reindexar();
  atualizarListasGlobais();
  ultimaCarga = Date.now();
  if ($('#app').hidden) return;
  if (silencioso) { atualizarAoVivo(); marcarAtualizado(); }
  else if (render) { renderizar(); marcarAtualizado(); }
}
function mostrarApp() {
  $('#carregando').hidden = true; $('#tela-acesso').hidden = true; $('#app').hidden = false;
  aplicarModo({ render: false }); renderizar(); marcarAtualizado();
}
function assinarTempoReal() {
  const fila = [];
  const processar = debounce(() => {
    if (!SESSAO) return;
    let mudou = false;
    for (const p of fila.splice(0)) mudou = aplicarMudancaRemota(p) || mudou;
    if (PEDIR_SAIDA) { PEDIR_SAIDA = false; sair('conta'); return; }
    if (PEDIR_RECARGA) { PEDIR_RECARGA = false; carregarDados({ silencioso: true }).catch(() => {}); return; }
    if (!mudou) return;
    reindexar(); atualizarAoVivo(); marcarAtualizado();
  }, 350);
  ADAPTER.assinar(p => { fila.push(p); processar(); }, st => { window.__vivo = st === 'SUBSCRIBED'; marcarAtualizado(); });
}
/** Conferência periódica: garante que cada perfil veja o que outros mudaram, mesmo se o tempo real cair. */
function recargaPeriodica() {
  if (!SESSAO || MODO_DEMO || document.visibilityState !== 'visible' || $('#app').hidden) return;
  if (Date.now() - ultimaCarga > 4 * 60000) carregarDados({ silencioso: true }).catch(() => {});
}
setInterval(recargaPeriodica, 60000);
document.addEventListener('visibilitychange', recargaPeriodica);

async function iniciar() {
  const t = temaAtual(); if (t !== 'sistema') document.documentElement.setAttribute('data-theme', t);
  $('#selo').innerHTML = seloHTML(); $('#selo-carregando').innerHTML = seloHTML();
  $('#marca-sub').textContent = `${CFG.UNIDADE_SIGLA} · ${CFG.SECAO_NOME}`;
  $('#btn-menu').innerHTML = ic('menu');
  $('#btn-menu').addEventListener('click', () => { const a = $('#app').classList.toggle('menu-aberto'); $('#btn-menu').setAttribute('aria-expanded', String(a)); });
  $('#veu-lateral').addEventListener('click', () => { $('#app').classList.remove('menu-aberto'); $('#btn-menu').setAttribute('aria-expanded', 'false'); });
  $('#nav').addEventListener('click', e => { if (e.target.closest('a')) $('#app').classList.remove('menu-aberto'); });
  ligarBuscaGeral();
  reindexar();   // índices vazios até a primeira carga
  try {
    if (MODO_DEMO) {
      ADAPTER = new AdapterDemo();
      await ADAPTER.iniciar();
    } else {
      await carregarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js');
      ADAPTER = new AdapterSupabase(CFG.SUPABASE_URL.trim(), CFG.SUPABASE_KEY.trim());
      // Sessão encerrada fora desta tela (token expirado, conta removida): volta à entrada
      ADAPTER.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && SESSAO) setTimeout(() => sair('sessao'), 0); });
    }
    if (await restaurarSessao()) await iniciarSessao();
    else await telaEntrada();
  } catch (e) {
    console.error(e);
    telaErro(traduzirErro(e).message);
  }
}
iniciar();
