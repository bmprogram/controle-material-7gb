   OPERAÇÕES — regras de negócio (sem interface)
   As alterações de material são feitas pelo banco (funções fn_item_*),
   numa única transação e sempre com registro no histórico.
   ===================================================================== */

/** Encontra o material do catálogo pelo nome digitado. */
function acharMaterial(nome) { return nome ? IDX.catPorNome.get(norm(nome)) || null : null; }
function exigirMaterial(nome) {
  const c = acharMaterial(nome);
  if (!c) throw new ErroApp(vazio(nome) ? 'Informe o material.' : `"${String(nome).trim()}" não está no catálogo.${ehGeral() ? ' Use o botão "Cadastrar material" ao lado do campo.' : ' Peça ao perfil Geral para incluí-lo no catálogo.'}`);
  return c;
}

/* ---------- Campos comuns ---------- */
/** Local: SB + viatura (vazio = sala de material) + compartimento. A viatura define a SB. */
function camposLocal(d) {
  const v = IDX.viatura.get(idNum(d.viatura_id));
  return { sb_id: v ? v.sb_id : (idNum(d.sb_id) || minhaSb()), viatura_id: v ? v.id : null, local_detalhe: limpa(d.local_detalhe) };
}
function camposSituacao(d) {
  const sit = d.situacao || 'OPERACIONAL';
  if (sit === 'OPERACIONAL') return { situacao: sit, avaria: null, avaria_sei: null, manutencao_local: null, situacao_desde: null };
  return { situacao: sit, avaria: limpa(d.avaria), avaria_sei: limpa(d.avaria_sei), manutencao_local: sit === 'MANUTENCAO' ? limpa(d.manutencao_local) : null, situacao_desde: d.situacao_desde || hojeISO() };
}
function txtSituacao(i) { return (SIT_ITEM[i.situacao] || {}).curto || i.situacao; }
function lerPatrimonios(texto) { return String(texto || '').split(/[\n;,]+/).map(s => s.trim()).filter(Boolean); }

/* ---------- Material ---------- */
async function cadastrarItens(d) {
  const cat = exigirMaterial(d.material);
  const pats = lerPatrimonios(d.patrimonios);
  const base = Object.assign({
    catalogo_id: cat.id,
    numero_serie: pats.length > 1 ? null : limpa(d.numero_serie),
    marca_modelo: limpa(d.marca_modelo), tamanho: limpa(d.tamanho),
    validade: d.validade || null, observacao: limpa(d.observacao)
  }, camposLocal(d), camposSituacao(d));
  let linhas;
  if (pats.length) linhas = pats.map(p => Object.assign({}, base, { patrimonio: p, quantidade: 1 }));
  else {
    const q = num(d.quantidade);
    if (!(q > 0)) throw new ErroApp('Informe a quantidade.');
    linhas = [Object.assign({}, base, { patrimonio: null, quantidade: q })];
  }
  for (const l of linhas) { const e = validar('itens', l, null, linhas); if (e) throw new ErroApp(e); }
  exigeSb(base.sb_id);
  const r = await DB.rpc('fn_item_entrada', { p_linhas: linhas, p_tipo: 'CADASTRO', p_detalhe: limpa(d.detalhe_mov) || 'Cadastro.' });
  const somado = (r.movs || []).some(m => /Somado ao lote/.test(m.detalhe || ''));
  return { itens: (r.itens || []).map(x => IDX.item.get(Number(x.id))).filter(Boolean), somado };
}

async function editarItem(item, d) {
  const cat = exigirMaterial(d.material);
  const patrimonio = limpa(d.patrimonio);
  const dados = Object.assign({
    catalogo_id: cat.id, patrimonio,
    numero_serie: limpa(d.numero_serie), marca_modelo: limpa(d.marca_modelo), tamanho: limpa(d.tamanho),
    quantidade: patrimonio ? 1 : num(d.quantidade),
    validade: d.validade || null, observacao: limpa(d.observacao)
  }, camposLocal(d), camposSituacao(d));
  if (dados.sb_id !== item.sb_id && !ehGeral()) throw new ErroApp('Somente o perfil Geral transfere material entre SBs.');
  const e = validar('itens', Object.assign({}, item, dados), item.id); if (e) throw new ErroApp(e);
  const r = await DB.rpc('fn_item_editar', { p_item: item.id, p_versao: item.atualizado_em || null, p_dados: dados });
  return IDX.item.get(Number(r.item.id));
}

async function movimentarItem(item, d) {
  const qtd = item.patrimonio ? 1 : num(d.quantidade);
  const loc = camposLocal(d);
  if (!loc.sb_id) throw new ErroApp('Informe o destino.');
  if (loc.sb_id !== item.sb_id && !ehGeral()) throw new ErroApp('Somente o perfil Geral transfere material entre SBs.');
  const igual = loc.sb_id === item.sb_id && (loc.viatura_id || null) === (item.viatura_id || null) && norm(loc.local_detalhe) === norm(item.local_detalhe);
  if (igual) throw new ErroApp('O destino é o mesmo local atual.');
  if (!(qtd > 0) || qtd > Number(item.quantidade)) throw new ErroApp(`Informe uma quantidade entre 1 e ${fmtNum(item.quantidade)}.`);
  const r = await DB.rpc('fn_item_mover', { p_item: item.id, p_qtd: qtd, p_alt: loc, p_detalhe: limpa(d.motivo) });
  return IDX.item.get(Number(r.destino.id));
}

async function alterarSituacao(item, d) {
  const qtd = item.patrimonio ? 1 : num(d.quantidade);
  const sit = camposSituacao(d);
  if (sit.situacao !== 'OPERACIONAL' && vazio(sit.avaria)) throw new ErroApp('Descreva a avaria ou o motivo (é o que aparece na aba Avariados).');
  if (!(qtd > 0) || qtd > Number(item.quantidade)) throw new ErroApp(`Informe uma quantidade entre 1 e ${fmtNum(item.quantidade)}.`);
  const alt = Object.assign({}, sit);
  if (d.mudar_local) Object.assign(alt, camposLocal(d));
  const r = await DB.rpc('fn_item_mover', { p_item: item.id, p_qtd: qtd, p_alt: alt, p_detalhe: limpa(d.observacao_mov) });
  return IDX.item.get(Number(r.destino.id));
}

async function excluirItem(item, motivo = null) {
  await DB.rpc('fn_item_excluir', { p_item: item.id, p_motivo: limpa(motivo) });
}

/* ---------- EPI do efetivo ---------- */
/**
 * linhas: [{ id (ou vazio), tipo_id, marcado, tamanho, processo_sei, descricao, situacao }]
 * Marcado sem id = novo; desmarcado com id = devolvido (fica no histórico).
 */
async function salvarEpisMilitar(m, linhas, { declarou_sem_epi = false, sei_padrao = '' } = {}) {
  if (!acessaMilitar(m)) throw new ErroApp('Seu perfil não tem acesso ao efetivo desta SB.');
  const atuais = new Map(episAtivos(m.id).map(e => [e.id, e]));
  const seiPadrao = limpa(sei_padrao);
  const novos = [], mudancas = [], devolver = [];
  for (const l of linhas) {
    const id = idNum(l.id);
    const dados = { tamanho: limpa(l.tamanho), processo_sei: limpa(l.processo_sei) || (l.marcado ? seiPadrao : null), descricao: limpa(l.descricao), situacao: l.situacao === 'VERIFICAR' ? 'VERIFICAR' : 'ACAUTELADO' };
    if (id && atuais.has(id)) {
      const e = atuais.get(id);
      if (!l.marcado) { devolver.push(e); continue; }
      const patch = {};
      for (const k of ['tamanho', 'processo_sei', 'descricao', 'situacao']) if ((e[k] ?? null) !== (dados[k] ?? null)) patch[k] = dados[k];
      if (Object.keys(patch).length) mudancas.push([e, patch]);
    } else if (!id && l.marcado) {
      const t = IDX.epiTipo.get(idNum(l.tipo_id));
      if (!t) throw new ErroApp('Tipo de EPI inválido.');
      if (t.nome === 'Outros' && !dados.descricao) throw new ErroApp('Em "Outros", descreva o material (ex.: luva de salvamento).');
      novos.push(Object.assign({ militar_id: m.id, tipo_id: t.id, quantidade: 1, data_recibo: hojeISO() }, dados));
    }
  }
  for (const [e, patch] of mudancas) await DB.atualizar('epis', e.id, patch);
  for (const e of devolver) await DB.atualizar('epis', e.id, { situacao: 'DEVOLVIDO', data_devolucao: hojeISO() });
  if (novos.length) await DB.inserir('epis', novos);
  const ficou = episAtivos(m.id).length;
  const semEpi = !!declarou_sem_epi && !ficou;
  if (!!m.declarou_sem_epi !== semEpi) await DB.atualizar('militares', m.id, { declarou_sem_epi: semEpi });
  return { novos: novos.length, alterados: mudancas.length, devolvidos: devolver.length };
}

/* ---------- Pedidos (FAFD) — perfil Geral ---------- */
async function salvarFafd(f, cab, linhas) {
  exigeGeral();
  if (vazio(cab.numero)) throw new ErroApp('Informe o número da FAFD.');
  if (!linhas.length) throw new ErroApp('Inclua pelo menos um item no pedido.');
  const plano = linhas.map((l, n) => {
    const pos = linhas.length > 1 ? ` (linha ${n + 1})` : '';
    let cat; try { cat = exigirMaterial(l.material); } catch (e) { throw new ErroApp(e.message + pos); }
    const q = num(l.quantidade_solicitada);
    if (!(q > 0)) throw new ErroApp('Informe a quantidade solicitada' + pos + '.');
    const ex = l.id ? S.fafd_itens.find(x => x.id === idNum(l.id)) : null;
    if (ex && Number(ex.quantidade_recebida) > q) throw new ErroApp(`Já foram recebidos ${fmtNum(ex.quantidade_recebida)}${pos}; a quantidade solicitada não pode ser menor.`);
    if (ex && ex.catalogo_id !== cat.id && Number(ex.quantidade_recebida) > 0) throw new ErroApp('Não é possível trocar o material de um item que já teve recebimento' + pos + '.');
    return { id: ex ? ex.id : null, catalogo_id: cat.id, descricao: limpa(l.descricao), tamanho: limpa(l.tamanho), quantidade_solicitada: q };
  });
  const header = { numero: limpa(cab.numero), data_pedido: cab.data_pedido || hojeISO(), processo_sei: limpa(cab.processo_sei), destino: limpa(cab.destino), sb_id: idNum(cab.sb_id), prioridade: cab.prioridade || 'NORMAL', situacao: cab.situacao || 'ENVIADO', observacao: limpa(cab.observacao) };
  const existentes = f ? (IDX.itensFafd.get(f.id) || []) : [];
  for (const ex of existentes) if (!plano.some(p => p.id === ex.id) && Number(ex.quantidade_recebida) > 0) throw new ErroApp(`O item "${catNome(ex.catalogo_id)}" já teve recebimento e não pode ser removido.`);
  const reg = f ? await DB.atualizar('fafd', f.id, header) : await DB.inserir('fafd', header);
  for (const ex of existentes) if (!plano.some(p => p.id === ex.id)) await DB.excluir('fafd_itens', ex.id);
  const novos = [];
  for (const p of plano) {
    const dados = { catalogo_id: p.catalogo_id, descricao: p.descricao, tamanho: p.tamanho, quantidade_solicitada: p.quantidade_solicitada };
    if (p.id) await DB.atualizar('fafd_itens', p.id, dados);
    else novos.push(Object.assign({ fafd_id: reg.id }, dados));
  }
  if (novos.length) await DB.inserir('fafd_itens', novos);
  return reg;
}

/** linhas: [{ fi, qtd, sb_id, viatura_id, local_detalhe, validade, patrimonios }] */
async function receberFafd(f, linhas, dataReceb) {
  exigeGeral();
  const plano = [], todosPats = [];
  for (const l of linhas) {
    const q = num(l.qtd);
    if (!q) continue;
    const fi = l.fi;
    const pend = Number(fi.quantidade_solicitada) - Number(fi.quantidade_recebida);
    const nome = catNome(fi.catalogo_id);
    if (q < 0) throw new ErroApp(`Quantidade inválida para ${nome}.`);
    if (q > pend) throw new ErroApp(`${nome}: pendente ${fmtNum(pend)}, informado ${fmtNum(q)}.`);
    const loc = camposLocal(l);
    if (!loc.sb_id) throw new ErroApp(`Informe a SB onde ${nome} será guardado.`);
    const pats = lerPatrimonios(l.patrimonios);
    if (pats.length && pats.length !== q) throw new ErroApp(`${nome}: ${pats.length} patrimônio(s) para ${fmtNum(q)} unidade(s). Informe um por unidade ou deixe em branco.`);
    todosPats.push(...pats);
    plano.push({ fi, q, loc, pats, validade: l.validade || null });
  }
  if (!plano.length) throw new ErroApp('Informe a quantidade recebida em pelo menos um item.');
  for (const p of todosPats) {
    if (todosPats.filter(x => norm(x) === norm(p)).length > 1) throw new ErroApp(`O patrimônio ${p} aparece repetido.`);
    const dup = S.itens.find(i => i.patrimonio && norm(i.patrimonio) === norm(p));
    if (dup) throw new ErroApp(`O patrimônio ${p} já está cadastrado (${catNome(dup.catalogo_id)}).`);
  }
  const linhasRpc = [];
  for (const p of plano) {
    const base = Object.assign({ catalogo_id: p.fi.catalogo_id, tamanho: p.fi.tamanho, validade: p.validade, situacao: 'OPERACIONAL' }, p.loc);
    if (p.pats.length) p.pats.forEach(pt => linhasRpc.push(Object.assign({}, base, { patrimonio: pt, quantidade: 1 })));
    else linhasRpc.push(Object.assign({}, base, { quantidade: p.q }));
  }
  await DB.rpc('fn_item_entrada', { p_linhas: linhasRpc, p_tipo: 'RECEBIMENTO', p_detalhe: `FAFD ${f.numero}${f.processo_sei ? ' (SEI ' + f.processo_sei + ')' : ''}.` });
  for (const p of plano) await DB.atualizar('fafd_itens', p.fi.id, { quantidade_recebida: Number(p.fi.quantidade_recebida) + p.q });
  const its = IDX.itensFafd.get(f.id) || [];
  const completo = its.every(x => Number(x.quantidade_recebida) >= Number(x.quantidade_solicitada));
  return DB.atualizar('fafd', f.id, completo ? { situacao: 'ATENDIDO', data_atendimento: dataReceb || hojeISO() } : { situacao: 'PARCIAL' });
}

function textoFafd(f) {
  const its = IDX.itensFafd.get(f.id) || [];
  const linhas = its.map((x, n) => `${String(n + 1).padStart(2, '0')}. ${catNome(x.catalogo_id)}${x.tamanho ? ' — tam. ' + x.tamanho : ''}${x.descricao ? ' — ' + x.descricao : ''}: ${fmtNum(x.quantidade_solicitada)} ${unidadeDe(x.catalogo_id)}`);
  return `FAFD nº ${f.numero} — ${CFG.UNIDADE_SIGLA}\nData: ${fmtData(f.data_pedido)}${f.destino ? '\nDestino: ' + f.destino : ''}${f.processo_sei ? '\nProcesso SEI: ' + f.processo_sei : ''}\n\nItens solicitados:\n${linhas.join('\n')}`;
}

/* ---------- Necessidades de aquisição ---------- */
function aquisicaoAberta(a) { return (SIT_AQUISICAO[a.situacao] || {}).aberta; }
function sugestoesAquisicao() {
  const abertas = new Set(S.aquisicoes.filter(aquisicaoAberta).map(a => a.catalogo_id));
  const res = [];
  for (const x of abaixoDoMinimo()) if (!abertas.has(x.c.id)) res.push({ c: x.c, origem: 'ESTOQUE_MINIMO', qtd: Math.ceil(x.min - x.disp), motivo: `${fmtNum(x.disp)} em condições de uso; mínimo ${fmtNum(x.min)}.` });
  const r = resumoMateriais();
  for (const c of S.catalogo) {
    const x = r.get(c.id);
    if (!x || !x.ins || abertas.has(c.id) || res.some(s => s.c.id === c.id)) continue;
    res.push({ c, origem: 'INSERVIVEL', qtd: x.ins, motivo: `${fmtNum(x.ins)} inservível(is) aguardando reposição.` });
  }
  return res;
}

function mapearCabecalho(cab, mapa) {
  const idx = {};
  cab.forEach((h, i) => {
    const k = chaveCompacta(h);
    for (const [campo, nomes] of Object.entries(mapa)) if (idx[campo] === undefined && nomes.includes(k)) { idx[campo] = i; break; }
  });
  return idx;
}
function lerSituacaoTexto(v) {
  const s = norm(v);
  if (!s) return 'OPERACIONAL';
  if (/manut|repar|conserto/.test(s)) return 'MANUTENCAO';
  if (/inserv|descar|condenad|sucata/.test(s)) return 'INSERVIVEL';
  if (/quebr|avari|sem condic|^scd$|danific/.test(s)) return 'AVARIADO';
  if (/condic|operac|uso|^bom|^ok|^ecd$|^em ordem|servivel|novo/.test(s)) return 'OPERACIONAL';
  return null;
}
function lerCategoriaTexto(v) {
  const s = norm(v);
  if (!s) return null;
  if (/^aph|pre.?hosp|saude/.test(s)) return 'APH';
  if (/incend|combate|fogo/.test(s)) return 'INCENDIO';
  if (/salvam|resgate|altura/.test(s)) return 'SALVAMENTO';
  if (/aquat|mergulh|nautic/.test(s)) return 'AQUATICO';
  if (/outro/.test(s)) return 'OUTROS';
  return null;
}
/** "2ª SB", "2", "SB 2", "Goiana" → SB */
function acharSbTexto(v) {
  const s = norm(v); if (!s) return null;
  const n = /^(\d+)/.exec(s.replace(/^sb\s*/, ''));
  return S.sbs.find(x => norm(x.nome) === s || (x.cidade && norm(x.cidade) === s) || (n && Number(x.numero) === Number(n[1]))) || null;
}
const MAPA_POSTOS = {
  cel: 'Cel', coronel: 'Cel', tencel: 'Ten Cel', tc: 'Ten Cel', tenentecoronel: 'Ten Cel', maj: 'Maj', major: 'Maj',
  cap: 'Cap', capitao: 'Cap', '1ten': '1º Ten', '1tenente': '1º Ten', primeirotenente: '1º Ten', '2ten': '2º Ten', '2tenente': '2º Ten', segundotenente: '2º Ten',
  aspof: 'Asp', asp: 'Asp', aspirante: 'Asp', aspiranteaoficial: 'Asp', st: 'Subten', subten: 'Subten', subtenente: 'Subten',
  '1sgt': '1º Sgt', '1sargento': '1º Sgt', primeirosargento: '1º Sgt', '2sgt': '2º Sgt', '2sargento': '2º Sgt', segundosargento: '2º Sgt',
  '3sgt': '3º Sgt', '3sargento': '3º Sgt', terceirosargento: '3º Sgt', cb: 'Cb', cabo: 'Cb', sd: 'Sd', soldado: 'Sd'
};
/** "3º Sgt QBMG-1" → ['3º Sgt', 'QBMG-1'] */
function lerPostoQuadro(v) {
  const txt = String(v || '').trim();
  const m = /^(.*?)\s+((?:QOC|QOA|QOS|QBMG|QBM|BM)\b.*)$/i.exec(txt);
  const posto = m ? m[1] : txt, quadro = m ? m[2].trim() : null;
  const k = chaveCompacta(posto).replace(/^(\d)o(?=[a-z])/, '$1');
  return [MAPA_POSTOS[k] || null, quadro];
}

function prepararImportItens(texto) {
  const linhas = parseCSV(texto);
  if (linhas.length < 2) throw new ErroApp('A planilha precisa ter a linha de cabeçalho e pelo menos uma linha de dados.');
  const col = mapearCabecalho(linhas[0], MAPA_COLUNAS_ITENS);
  if (col.material === undefined) throw new ErroApp('Não encontrei a coluna "material" no cabeçalho. Use o modelo de planilha.');
  if (col.sb === undefined && col.viatura === undefined && !minhaSb()) throw new ErroApp('Não encontrei a coluna "sb" (ou "viatura") no cabeçalho.');
  const pega = (l, c) => col[c] === undefined ? '' : String(l[col[c]] ?? '').trim();
  const res = { linhas: [], novosMateriais: new Map(), total: linhas.length - 1 };
  const patsVistos = new Set();
  linhas.slice(1).forEach((l, n) => {
    const erros = [];
    const nome = pega(l, 'material');
    if (!nome) erros.push('material vazio');
    const cat = acharMaterial(nome);
    let novo = null;
    if (!cat && nome) {
      const categoria = lerCategoriaTexto(pega(l, 'categoria'));
      const k = norm(nome);
      if (!ehGeral()) erros.push(`"${nome}" não está no catálogo (o perfil Geral cadastra materiais novos)`);
      else if (res.novosMateriais.has(k)) novo = res.novosMateriais.get(k);
      else if (!categoria) erros.push(`"${nome}" não está no catálogo; informe a área (APH, Incêndio, Salvamento, Aquático ou Outros)`);
      else {
        const outros = pega(l, 'categoria_outros');
        novo = { nome, categoria, categoria_outros: categoria === 'OUTROS' ? (outros || 'Diversos') : null, unidade: (pega(l, 'unidade') || 'UN').toUpperCase().slice(0, 6), usa_patrimonio: !!pega(l, 'patrimonio'), usa_tamanho: !!pega(l, 'tamanho') };
        res.novosMateriais.set(k, novo);
      }
    }
    const vtrTxt = pega(l, 'viatura');
    let vtr = null;
    if (vtrTxt && !/^sala|mat\.?\s*op|^-$/.test(norm(vtrTxt))) { vtr = S.viaturas.find(v => norm(v.prefixo) === norm(vtrTxt)) || null; if (!vtr) erros.push(`viatura "${vtrTxt}" não cadastrada${ehGeral() ? '' : ' nesta SB'}`); }
    const sbTxt = pega(l, 'sb');
    let sb = acharSbTexto(sbTxt);
    if (vtr) sb = IDX.sb.get(vtr.sb_id);
    if (!sb && !sbTxt && minhaSb()) sb = IDX.sb.get(minhaSb());
    if (!sb) erros.push(sbTxt ? `SB "${sbTxt}" não encontrada` : 'SB vazia');
    else if (!acessaSb(sb.id)) erros.push(`seu perfil não tem acesso à ${sb.nome}`);
    const pat = pega(l, 'patrimonio') || null;
    const q = col.quantidade === undefined || pega(l, 'quantidade') === '' ? 1 : num(pega(l, 'quantidade'));
    if (!(q > 0)) erros.push('quantidade inválida');
    if (pat) {
      if (q !== 1) erros.push('item com patrimônio deve ter quantidade 1');
      const k = norm(pat);
      if (patsVistos.has(k)) erros.push(`patrimônio ${pat} repetido na planilha`);
      else if (S.itens.some(i => i.patrimonio && norm(i.patrimonio) === k)) erros.push(`patrimônio ${pat} já cadastrado`);
      patsVistos.add(k);
    }
    const sit = lerSituacaoTexto(pega(l, 'situacao'));
    if (!sit) erros.push(`situação "${pega(l, 'situacao')}" não reconhecida`);
    const avaria = pega(l, 'avaria') || null;
    if (sit && sit !== 'OPERACIONAL' && !avaria) erros.push('informe a avaria/motivo');
    const valTxt = pega(l, 'validade');
    const validade = parseDataBR(valTxt);
    if (validade === undefined) erros.push(`validade "${valTxt}" inválida (use dd/mm/aaaa)`);
    res.linhas.push({
      n: n + 2, erros, nome,
      dados: { cat, novo, patrimonio: pat, numero_serie: pega(l, 'numero_serie') || null, marca_modelo: pega(l, 'marca_modelo') || null, tamanho: pega(l, 'tamanho') || null, quantidade: q, sb_id: sb ? sb.id : null, viatura_id: vtr ? vtr.id : null, local_detalhe: pega(l, 'local_detalhe') || null, situacao: sit || 'OPERACIONAL', avaria: sit === 'OPERACIONAL' ? null : avaria, validade: validade || null, observacao: pega(l, 'observacao') || null }
    });
  });
  return res;
}
async function executarImportItens(prep) {
  exigeEdicao();
  const validas = prep.linhas.filter(l => !l.erros.length);
  if (!validas.length) throw new ErroApp('Nenhuma linha válida para importar.');
  const usados = new Set(validas.filter(l => l.dados.novo).map(l => norm(l.dados.novo.nome)));
  const novos = [...prep.novosMateriais.values()].filter(m => usados.has(norm(m.nome)));
  if (novos.length) await DB.inserir('catalogo', novos);
  const linhas = validas.map(l => {
    const cat = l.dados.cat || acharMaterial(l.dados.novo.nome);
    const o = Object.assign({}, l.dados, { catalogo_id: cat.id });
    delete o.cat; delete o.novo;
    return o;
  });
  let n = 0;
  for (let i = 0; i < linhas.length; i += 200) {
    const r = await DB.rpc('fn_item_entrada', { p_linhas: linhas.slice(i, i + 200), p_tipo: 'IMPORTACAO', p_detalhe: 'Importado de planilha.' });
    n += (r.movs || []).length;
  }
  return { itens: n, materiais: novos.length };
}

function prepararImportMilitares(texto) {
  const linhas = parseCSV(texto);
  if (linhas.length < 2) throw new ErroApp('A planilha precisa ter a linha de cabeçalho e pelo menos uma linha de dados.');
  const col = mapearCabecalho(linhas[0], MAPA_COLUNAS_MILITARES);
  if (col.nome === undefined || col.posto_grad === undefined) throw new ErroApp('Não encontrei as colunas "posto" e "nome" no cabeçalho. Use o modelo de planilha.');
  const pega = (l, c) => col[c] === undefined ? '' : String(l[col[c]] ?? '').trim();
  const mats = new Set();
  const res = { linhas: [], total: linhas.length - 1 };
  linhas.slice(1).forEach((l, n) => {
    const erros = [];
    const [posto, quadro] = lerPostoQuadro(pega(l, 'posto_grad'));
    if (!posto) erros.push(`posto/graduação "${pega(l, 'posto_grad')}" não reconhecido`);
    const nome = pega(l, 'nome');
    if (!nome) erros.push('nome vazio');
    const mat = pega(l, 'matricula') || null;
    if (mat) {
      const k = norm(mat);
      if (mats.has(k)) erros.push(`matrícula ${mat} repetida na planilha`);
      else if (S.militares.some(m => m.matricula && norm(m.matricula) === k)) erros.push(`matrícula ${mat} já cadastrada`);
      mats.add(k);
    }
    const lot = pega(l, 'sb');
    const sbM = /([1-9])ª?\s*SB/i.exec(lot);
    const sb = sbM ? acharSbTexto(sbM[1]) : acharSbTexto(lot);
    const sbId = sb ? sb.id : (minhaSb() || null);
    if (!acessaSb(sbId)) erros.push(sb ? `seu perfil não tem acesso à ${sb.nome}` : 'informe a SB (só o perfil Geral cadastra militares sem SB)');
    const sitTxt = norm(pega(l, 'situacao'));
    const sit = !sitTxt ? 'ATIVO' : (Object.keys(SIT_MILITAR).find(k => norm(SIT_MILITAR[k]) === sitTxt || norm(k) === sitTxt) || null);
    if (!sit) erros.push(`situação "${pega(l, 'situacao')}" não reconhecida`);
    res.linhas.push({ n: n + 2, erros, nome, dados: { ordem: idNum(pega(l, 'ordem')), posto_grad: posto, quadro, nome, nome_guerra: pega(l, 'nome_guerra') || null, matricula: mat, sb_id: sbId, lotacao: lot || (sb ? sb.nome : null), funcao: pega(l, 'funcao') || null, telefone: pega(l, 'telefone') || null, tam_vestuario: pega(l, 'tam_vestuario') || null, tam_calcado: pega(l, 'tam_calcado') || null, tam_luva: pega(l, 'tam_luva') || null, situacao: sit || 'ATIVO' } });
  });
  return res;
}
async function executarImportMilitares(prep) {
  exigeEdicao();
  const validas = prep.linhas.filter(l => !l.erros.length).map(l => l.dados);
  if (!validas.length) throw new ErroApp('Nenhuma linha válida para importar.');
  const criados = [];
  for (let i = 0; i < validas.length; i += 300) criados.push(...await DB.inserir('militares', validas.slice(i, i + 300)));
  return criados.length;
}

        <div>
          <div class="mil-posto">${esc(mil.posto_grad)}${mil.quadro ? ' ' + esc(mil.quadro) : ''}</div>
          <h3 class="det-tit">${esc(mil.nome_guerra || mil.nome)}</h3>
          <div class="det-sub">${esc(mil.nome)}${mil.matricula ? ` · mat. <span class="mono">${esc(mil.matricula)}</span>` : ''} · ${esc(mil.sb_id ? sbNome(mil.sb_id) : 'Sem SB')}${mil.lotacao && mil.lotacao !== sbNome(mil.sb_id) ? ' · ' + esc(mil.lotacao) : ''}${mil.funcao ? ' · ' + esc(mil.funcao) : ''}</div>
          <div class="det-tags">${stBadge(STATUS_EPI, st)}${mil.situacao !== 'ATIVO' ? ` <span class="st st-warn">${ic('info')}<span>${esc(SIT_MILITAR[mil.situacao])}</span></span>` : ''}
            ${mil.tam_vestuario ? `<span class="chip">${ic('regua')}vestuário ${esc(mil.tam_vestuario)}</span>` : ''}${mil.tam_calcado ? `<span class="chip">calçado ${esc(mil.tam_calcado)}</span>` : ''}${mil.tam_luva ? `<span class="chip">luva ${esc(mil.tam_luva)}</span>` : ''}</div>
        </div>
        <div class="det-acoes">
          ${pode ? `<button type="button" class="btn btn-sm btn-pri" data-acao="epi-marcar" data-id="${mil.id}">${ic('colete')}<span>Marcar EPI</span></button>` : ''}
          <button type="button" class="btn btn-sm" data-acao="militar-ficha" data-id="${mil.id}">${ic('impressora')}<span>Relação de EPI</span></button>
          ${pode ? `<button type="button" class="btn btn-sm" data-acao="militar-editar" data-id="${mil.id}">${ic('lapis')}<span>Editar</span></button>
          <button type="button" class="btn btn-sm btn-perigo-sutil" data-acao="militar-excluir" data-id="${mil.id}">${ic('lixo')}<span>Excluir</span></button>` : ''}
        </div>
      </div>
      ${mil.observacao ? `<p class="aviso aviso-info">${ic('info')}<span>${esc(mil.observacao)}</span></p>` : ''}
      <h4 class="sub-tit">${ic('colete')}EPI acautelado <span class="cont">${ativos.length}</span></h4>
      ${tabela({ chave: 'mil-epis', colunas: colunasEpiDetalhe(pode), linhas: ativos, classe: 'tab-cards', vazio: mil.declarou_sem_epi ? 'O militar declarou não possuir EPI acautelado.' : 'Nenhum EPI registrado para este militar.' })}
      ${hist.length ? `<details class="dobra"><summary>Devolvidos <span class="cont">${hist.length}</span></summary>${tabela({ chave: 'mil-epis-hist', colunas: colunasEpiDetalhe(pode), linhas: hist, classe: 'tab-cards' })}</details>` : ''}`;
  };
  m.renovar = render;
  render();
}
function folhaEpiMilitar(mil) {
  const ativos = (IDX.episMilitar.get(mil.id) || []).filter(e => e.situacao !== 'DEVOLVIDO').sort((a, b) => ((IDX.epiTipo.get(a.tipo_id) || {}).ordem || 0) - ((IDX.epiTipo.get(b.tipo_id) || {}).ordem || 0));
  const linhas = ativos.map((e, n) => `<tr><td class="num">${n + 1}</td><td>${esc(tipoEpiNome(e.tipo_id))}${e.descricao ? ' — ' + esc(e.descricao) : ''}</td><td>${esc(e.tamanho || '')}</td><td class="num">${fmtNum(e.quantidade)}</td><td>${fmtData(e.data_recibo)}</td><td class="mono">${esc(e.processo_sei || '')}</td><td>${esc(SIT_EPI[e.situacao].rotulo)}</td></tr>`).join('');
  return cabecalhoFolha('Relação de EPI acautelado', `${esc(mil.posto_grad)}${mil.quadro ? ' ' + esc(mil.quadro) : ''} ${esc(mil.nome)}${mil.matricula ? ' — Matrícula ' + esc(mil.matricula) : ''}<br>${esc(mil.sb_id ? sbRotulo(mil.sb_id) : 'Sem SB')}${mil.lotacao ? ' · ' + esc(mil.lotacao) : ''}`) +
    `<table class="folha-tab"><thead><tr><th>Nº</th><th>EPI</th><th>Tam.</th><th>Qtd</th><th>Recibo</th><th>Processo SEI do recibo</th><th>Situação</th></tr></thead>
     <tbody>${linhas || '<tr><td colspan="7">Nenhum EPI acautelado.</td></tr>'}</tbody></table>
     <p class="folha-nota">Total de ${plural(ativos.length, 'item', 'itens')}. Os recibos constam nos processos SEI indicados.</p>
     <div class="folha-ass"><div><span></span>${esc(mil.posto_grad)} ${esc(mil.nome_guerra || mil.nome)}<small>Militar</small></div><div><span></span>Chefe da ${esc(CFG.SECAO_NOME)}<small>${esc(CFG.UNIDADE_SIGLA)}</small></div></div>` + rodapeFolha();
}

/* ---- 50_painel.js ---- */
/* =====================================================================
   PAINEL (dashboard) — abre ao entrar, no escopo do perfil
   ===================================================================== */
const VIEWS = {};
const ACOES = {};
const FD = { sb: '', categoria: '' };

function itensDash() {
  return S.itens.filter(i => (!FD.sb || i.sb_id === +FD.sb) && (!FD.categoria || (catDe(i) || {}).categoria === FD.categoria));
}
function militaresDash() {
  return S.militares.filter(m => (m.situacao === 'ATIVO' || m.situacao === 'AFASTADO') && (!FD.sb || m.sb_id === +FD.sb));
}
function agregarPor(itens, chave) {
  const m = new Map();
  for (const i of itens) {
    const k = chave(i); if (k === null || k === undefined) continue;
    if (!m.has(k)) m.set(k, { op: 0, av: 0, man: 0, ins: 0, total: 0, regs: 0 });
    const x = m.get(k), q = Number(i.quantidade) || 0;
    if (i.situacao === 'OPERACIONAL') x.op += q; else if (i.situacao === 'AVARIADO') x.av += q; else if (i.situacao === 'MANUTENCAO') x.man += q; else x.ins += q;
    x.total += q; x.regs++;
  }
  return m;
}
const SEGS_SIT = [['op', 'seg-ok', 'em condições'], ['av', 'seg-bad', 'quebrados'], ['man', 'seg-warn', 'em manutenção'], ['ins', 'seg-off', 'inservíveis']];
function barrasEmpilhadas(linhas, acao = null) {
  if (!linhas.length) return '<div class="barras-vazio">Nada para mostrar com os filtros atuais.</div>';
  const max = Math.max(1, ...linhas.map(l => l.total));
  return `<div class="barras">${linhas.map(l => {
    const segs = SEGS_SIT.filter(([k]) => l[k] > 0).map(([k, cls, rot]) =>
      `<span class="seg ${cls}" tabindex="0" style="flex:0 1 ${(l[k] / max * 100).toFixed(3)}%" aria-label="${esc(l.rotulo)}: ${fmtNum(l[k])} ${rot}"></span>`).join('');
    const rotulo = acao ? `<button type="button" class="barra-rot${l.sel ? ' sel' : ''}" ${acao(l)}>${l.html || esc(l.rotulo)}</button>` : `<span class="barra-rot">${l.html || esc(l.rotulo)}</span>`;
    return `<div class="barra-l" data-rot="${esc(l.rotulo)}" data-op="${l.op}" data-av="${l.av}" data-man="${l.man}" data-ins="${l.ins}">
      ${rotulo}<div class="barra-trilho">${segs}</div><span class="barra-val">${fmtNum(l.total)}</span></div>`;
  }).join('')}</div>`;
}
const LEGENDA_SIT = `<div class="legenda"><span><i style="background:var(--ok-fill)"></i>Em condições</span><span><i style="background:var(--bad)"></i>Quebrado</span><span><i style="background:var(--warn-fill)"></i>Manutenção</span><span><i style="background:var(--off-fill)"></i>Inservível</span></div>`;

function kpiHTML({ rot, icone, val, unid = '', sub = '', cls = '', acao = '', dados = '', medidor = null }) {
  const tag = acao ? 'button' : 'div';
  return `<${tag} ${acao ? `type="button" data-acao="${acao}" ${dados}` : ''} class="kpi ${cls}">
    <span class="kpi-rot">${ic(icone)}<span class="kpi-rot-t">${esc(rot)}</span></span>
    <span class="kpi-val">${val}${unid ? `<small>${esc(unid)}</small>` : ''}</span>
    ${medidor !== null ? `<span class="kpi-medidor" role="img" aria-label="${medidor}%"><i style="width:${medidor}%"></i></span>` : ''}
    ${sub ? `<span class="kpi-sub">${sub}</span>` : ''}
  </${tag}>`;
}

function filtrosDashHTML() {
  return `<span class="mudo">${ic('filtro')}</span>
    ${ehGeral() ? slc('sb', S.sbs.map(s => [s.id, s.nome + (s.cidade ? ' · ' + s.cidade : '')]), FD.sb, { id: 'df-sb', 'data-fdash': 'sb', class: FD.sb ? 'ativo' : '', 'aria-label': 'SB' }, 'Todas as SBs') : ''}
    ${slc('categoria', Object.entries(CATEGORIAS).map(([k, c]) => [k, c.rotulo]), FD.categoria, { id: 'df-categoria', 'data-fdash': 'categoria', class: FD.categoria ? 'ativo' : '', 'aria-label': 'Área' }, 'Todas as áreas')}
    ${FD.sb || FD.categoria ? `<button type="button" class="btn btn-sm" data-acao="dash-limpar">${ic('x')}<span>Limpar filtros</span></button>` : ''}`;
}

function corpoPainel() {
  const itens = itensDash();
  const q = arr => soma(arr, i => i.quantidade);
  const tot = q(itens), op = q(itens.filter(i => i.situacao === 'OPERACIONAL'));
  const av = itens.filter(i => i.situacao === 'AVARIADO'), man = itens.filter(i => i.situacao === 'MANUTENCAO'), ins = itens.filter(i => i.situacao === 'INSERVIVEL');
  const fora = q(av) + q(man) + q(ins);
  const vtrs = S.viaturas.filter(v => v.ativo !== false && (!FD.sb || v.sb_id === +FD.sb));
  const venc = itens.filter(i => i.validade && diasAte(i.validade) < 0);
  const prox = itens.filter(i => i.validade && diasAte(i.validade) >= 0 && diasAte(i.validade) <= 30);
  const mils = militaresDash();
  const st = { COM: 0, VERIFICAR: 0, SEM: 0, PENDENTE: 0 };
  for (const m of mils) st[statusEpiMilitar(m)]++;
  const epis = S.epis.filter(e => e.situacao !== 'DEVOLVIDO' && mils.some(m => m.id === e.militar_id));
  const aVerificar = epis.filter(e => e.situacao === 'VERIFICAR').length;

  const kpis = `<div class="kpis">
    ${kpiHTML({ rot: 'Em condições', icone: 'check', cls: 'k-ok', val: fmtNum(op), sub: `${pct(op, tot)}% de ${fmtNum(tot)} unidades · ${plural(itens.length, 'registro', 'registros')}`, medidor: pct(op, tot), acao: 'ir', dados: 'data-rota="material"' })}
    ${kpiHTML({ rot: 'Avariados', icone: 'alerta', cls: fora ? 'k-bad' : 'k-ok', val: fmtNum(fora), sub: `${fmtNum(q(av))} quebrados · ${fmtNum(q(man))} em manutenção · ${fmtNum(q(ins))} inservíveis`, acao: 'ir', dados: 'data-rota="avariados"' })}
    ${kpiHTML({ rot: 'Viaturas', icone: 'caminhao', cls: 'k-info', val: fmtNum(vtrs.length), sub: `${fmtNum(vtrs.filter(v => v.situacao === 'OPERANDO').length)} operando${vtrs.some(v => v.situacao === 'BAIXADA') ? ` · ${vtrs.filter(v => v.situacao === 'BAIXADA').length} baixada(s)` : ''}`, acao: 'ir', dados: 'data-rota="viaturas"' })}
    ${kpiHTML({ rot: 'Efetivo', icone: 'usuarios', cls: 'k-info', val: fmtNum(mils.length), sub: `${fmtNum(st.COM + st.VERIFICAR)} com EPI · ${fmtNum(st.PENDENTE)} sem registro`, medidor: pct(st.COM + st.VERIFICAR + st.SEM, mils.length), acao: 'ir', dados: 'data-rota="efetivo"' })}
    ${kpiHTML({ rot: 'EPI acautelado', icone: 'colete', cls: aVerificar ? 'k-warn' : 'k-ok', val: fmtNum(soma(epis, e => e.quantidade)), unid: 'itens', sub: aVerificar ? `${plural(aVerificar, 'item a verificar', 'itens a verificar')}` : 'nenhum item a verificar', acao: 'ir-efetivo-verificar' })}
    ${kpiHTML({ rot: 'Validade', icone: 'calendario', cls: venc.length ? 'k-bad' : 'k-ok', val: fmtNum(venc.length), unid: venc.length === 1 ? 'vencido' : 'vencidos', sub: `${plural(prox.length, 'registro vence', 'registros vencem')} em até 30 dias` })}
  </div>`;

  // por área
  const pc = agregarPor(itens, i => (catDe(i) || {}).categoria);
  const linhasCat = Object.keys(CATEGORIAS).filter(k => pc.has(k)).map(k => Object.assign({ chave: k, rotulo: CATEGORIAS[k].rotulo, sel: FD.categoria === k, html: `${ic(CATEGORIAS[k].icone)}<span>${esc(CATEGORIAS[k].rotulo)}</span>` }, pc.get(k)));
  // por SB (Geral) ou por local (SB)
  let painelLocal;
  if (ehGeral() && !FD.sb) {
    const ps = agregarPor(itens, i => i.sb_id);
    const linhas = S.sbs.filter(s => ps.has(s.id)).map(s => Object.assign({ chave: s.id, rotulo: s.nome, html: `<span>${esc(s.nome)}</span><small class="mudo">${esc(s.cidade || '')}</small>` }, ps.get(s.id)));
    painelLocal = `<section class="painel"><div class="painel-cab"><h2 class="painel-tit">${ic('predio')}Material por SB</h2><span class="painel-sub">clique para ver a SB</span></div>
      <div class="painel-corpo">${barrasEmpilhadas(linhas, l => `data-acao="dash-sb" data-id="${l.chave}"`)}</div></section>`;
  } else {
    const sbId = FD.sb ? +FD.sb : minhaSb();
    const pl = agregarPor(itens, i => i.viatura_id || 0);
    const linhas = [{ chave: 0, rotulo: LOCAL_SALA, html: `<span>${esc(LOCAL_SALA)}</span>` }, ...(IDX.viaturasSb.get(sbId) || []).map(v => ({ chave: v.id, rotulo: v.prefixo, html: `<span class="vtr-mini">${esc(v.prefixo)}</span>${v.situacao !== 'OPERANDO' ? `<small class="mudo">${esc(SIT_VIATURA[v.situacao].rotulo)}</small>` : ''}` }))]
      .filter(l => pl.has(l.chave)).map(l => Object.assign(l, pl.get(l.chave)));
    painelLocal = `<section class="painel"><div class="painel-cab"><h2 class="painel-tit">${ic('caminhao')}${esc(sbNome(sbId))}: sala de material e viaturas</h2></div>
      <div class="painel-corpo">${barrasEmpilhadas(linhas, l => `data-acao="dash-local" data-sb="${sbId}" data-id="${l.chave}"`)}</div></section>`;
  }

  // EPI: quantos militares têm cada tipo
  const comTipo = new Map();
  for (const e of epis) { if (!comTipo.has(e.tipo_id)) comTipo.set(e.tipo_id, new Set()); comTipo.get(e.tipo_id).add(e.militar_id); }
  const epiLinhas = S.epi_tipos.filter(t => t.ativo !== false).map(t => { const n = (comTipo.get(t.id) || new Set()).size; return `<div class="mini-l"><span class="mini-tit">${esc(t.nome)}</span><span class="mini-dir">${fmtNum(n)} de ${fmtNum(mils.length)}</span><div class="medidor"><div class="md-trilho"><div class="md-fill md-info" style="width:${pct(n, mils.length)}%"></div></div><span>${pct(n, mils.length)}%</span></div></div>`; }).join('');

  // pendências (pedidos: só Geral)
  const aqs = S.aquisicoes.filter(aquisicaoAberta).filter(a => !FD.sb || a.sb_id === +FD.sb).filter(a => !FD.categoria || (IDX.cat.get(a.catalogo_id) || {}).categoria === FD.categoria);
  const fafdAbertos = ehGeral() ? S.fafd.filter(f => (SIT_FAFD[f.situacao] || {}).aberta && f.situacao !== 'RASCUNHO') : [];
  const porPrio = k => aqs.filter(a => a.prioridade === k).length;

  // listas
  const avs = itens.filter(foraDeUso).sort((a, b) => cmp(a.situacao_desde, b.situacao_desde));
  const vencs = itens.filter(i => i.validade && diasAte(i.validade) <= 60).sort((a, b) => cmp(a.validade, b.validade));
  const ativ = S.movimentacoes.filter(mv => mv.tipo !== 'IMPORTACAO').filter(mv => !FD.categoria || (IDX.cat.get(mv.catalogo_id) || {}).categoria === FD.categoria).filter(mv => !FD.sb || mv.sb_origem === +FD.sb || mv.sb_destino === +FD.sb).slice(0, 8);
  const miniItem = i => `<div class="mini-l clicavel" data-acao="item-ver" data-id="${i.id}">
      <span class="mini-tit">${esc(catNome(i.catalogo_id))}${i.patrimonio ? ' ' + plaq(i.patrimonio) : ''}${!i.patrimonio && i.quantidade > 1 ? ` <span class="chip">${fmtNum(i.quantidade)} ${esc(unidadeDe(i.catalogo_id))}</span>` : ''}</span>`;

  return `${kpis}
  <div class="dash-grade">
    <section class="painel">
      <div class="painel-cab"><h2 class="painel-tit">${ic('tag')}Material por área</h2>${LEGENDA_SIT}</div>
      <div class="painel-corpo">${barrasEmpilhadas(linhasCat, l => `data-acao="dash-area" data-cat="${l.chave}" title="Filtrar por ${esc(l.rotulo)}"`)}</div>
    </section>
    ${painelLocal}
    <section class="painel">
      <div class="painel-cab"><h2 class="painel-tit">${ic('alerta')}Avariados</h2><span class="painel-sub">${plural(avs.length, 'registro', 'registros')}, do mais antigo</span></div>
      <div class="painel-corpo"><div class="mini-lista">${avs.slice(0, 7).map(i => `${miniItem(i)}<span class="mini-dir">${stBadge(SIT_ITEM, i.situacao, true)}</span><span class="mini-sub">${esc(i.avaria || '')} · ${esc(localCurto(i))}${i.situacao_desde ? ` · ${haDias(i.situacao_desde)}` : ''}</span></div>`).join('') || '<p class="mudo">Nenhum material avariado.</p>'}</div>
      <button type="button" class="ver-mais" data-acao="ir" data-rota="avariados">Ver avariados ${ic('seta')}</button></div>
    </section>
    <section class="painel">
      <div class="painel-cab"><h2 class="painel-tit">${ic('colete')}EPI do efetivo</h2><span class="painel-sub">militares com cada item</span></div>
      <div class="painel-corpo">
        <div class="pend-grade" style="margin-bottom:10px">
          <div><div class="pend-num">${fmtNum(st.COM + st.VERIFICAR)}</div><div class="pend-rot">com EPI registrado${st.VERIFICAR ? ` · ${st.VERIFICAR} a verificar` : ''}</div></div>
          <div><div class="pend-num">${fmtNum(st.PENDENTE)}</div><div class="pend-rot">sem registro${st.SEM ? ` · ${st.SEM} declararam não possuir` : ''}</div></div>
        </div>
        <div class="mini-lista">${epiLinhas}</div>
        <button type="button" class="ver-mais" data-acao="ir" data-rota="efetivo">Ver efetivo ${ic('seta')}</button>
      </div>
    </section>
    <section class="painel">
      <div class="painel-cab"><h2 class="painel-tit">${ic('carrinho')}${ehGeral() ? 'Pedidos e aquisições' : 'Necessidades de aquisição'}</h2></div>
      <div class="painel-corpo">
        <div class="pend-grade">
          ${ehGeral() ? `<div>
            <div class="pend-num">${fafdAbertos.length}</div><div class="pend-rot">FAFD em aberto</div>
            <div class="mini-lista">${fafdAbertos.slice().sort((a, b) => cmp(a.data_pedido, b.data_pedido)).slice(0, 4).map(f => { const p = progressoFafd(f); return `<div class="mini-l clicavel" data-acao="fafd-ver" data-id="${f.id}"><span class="mini-tit">FAFD ${esc(f.numero)}</span><span class="mini-dir">${haDias(f.data_pedido)}</span><div class="barra-prog" style="grid-column:1/-1"><div class="bp-trilho"><div class="bp-fill${p.pct < 100 ? ' parcial' : ''}" style="width:${p.pct}%"></div></div><span>${p.pct}%</span></div></div>`; }).join('') || '<p class="mudo" style="padding-top:8px">Nenhum pedido aguardando.</p>'}</div>
            <button type="button" class="ver-mais" data-acao="ir" data-rota="fafd">Ver pedidos ${ic('seta')}</button>
          </div>` : ''}
          <div>
            <div class="pend-num">${aqs.length}</div><div class="pend-rot">necessidades em aberto</div>
            <div class="mini-lista">
              <div class="mini-l"><span class="mini-tit">${prBadge('ALTA')}</span><span class="mini-dir">${porPrio('ALTA')}</span></div>
              <div class="mini-l"><span class="mini-tit">${prBadge('MEDIA')}</span><span class="mini-dir">${porPrio('MEDIA')}</span></div>
              <div class="mini-l"><span class="mini-tit">${prBadge('BAIXA')}</span><span class="mini-dir">${porPrio('BAIXA')}</span></div>
            </div>
            <button type="button" class="ver-mais" data-acao="ir" data-rota="aquisicoes">Ver aquisições ${ic('seta')}</button>
          </div>
        </div>
      </div>
    </section>
    <section class="painel">
      <div class="painel-cab"><h2 class="painel-tit">${ic('calendario')}Vencidos e a vencer (60 dias)</h2><span class="painel-sub">${plural(vencs.length, 'registro', 'registros')}</span></div>
      <div class="painel-corpo"><div class="mini-lista">${vencs.slice(0, 7).map(i => `${miniItem(i)}<span class="mini-dir">${badgeValidade(i.validade)}</span><span class="mini-sub">${esc(localCurto(i))}</span></div>`).join('') || '<p class="mudo">Nenhum vencimento informado para os próximos 60 dias. Informe a validade ao cadastrar ou editar cilindros, extintores e material de APH.</p>'}</div></div>
    </section>
    <section class="painel largo">
      <div class="painel-cab"><h2 class="painel-tit">${ic('historico')}Atividade recente</h2></div>
      <div class="painel-corpo">${ativ.length ? `<ol class="linha-tempo">${ativ.map(mv => itemHistorico(Object.assign({}, mv, { detalhe: `${mv.catalogo_id ? catNome(mv.catalogo_id) + ' — ' : ''}${mv.detalhe || ''}` }))).join('')}</ol>` : `<p class="mudo">${S.movimentacoes.length ? 'Nenhuma movimentação desde a carga inicial. Cadastros, transferências e avarias aparecem aqui.' : 'Nenhuma movimentação ainda.'}</p>`}</div>
    </section>
  </div>`;
}

/* =====================================================================
   MATERIAL DAS SBs — sala de material operacional e viaturas de cada SB,
   separado por área (APH, Incêndio, Salvamento, Aquático, Outros)
   ===================================================================== */
const FM = { sb: '', local: '', categoria: '', situacao: '', busca: '', material: '', zerados: false };
/** Em "Todas as SBs" o material aparece agrupado (uma linha por material, total do Grupamento);
 *  nas abas das SBs, e ao abrir um material, aparece cada registro com o local onde está. */
const vistaAgrupada = () => !sbAtualMaterial() && !FM.material;

function sbAtualMaterial() {
  if (!ehGeral()) return minhaSb();
  const id = idNum(FM.sb);
  return id && IDX.sb.has(id) ? id : null;
}
/** Itens no escopo de SB e local (sem os filtros de área, situação e busca). */
function itensEscopo() {
  const sb = sbAtualMaterial();
  return S.itens.filter(i => {
    if (sb && i.sb_id !== sb) return false;
    if (FM.local === 'sala') { if (i.viatura_id) return false; }
    else if (FM.local && i.viatura_id !== +FM.local) return false;
    return true;
  });
}
function filtraMat(i, ignorar = '') {
  const c = catDe(i);
  if (ignorar !== 'categoria' && FM.categoria && (!c || c.categoria !== FM.categoria)) return false;
  if (FM.material && i.catalogo_id !== +FM.material) return false;
  if (FM.situacao === 'FORA') { if (i.situacao === 'OPERACIONAL') return false; }
  else if (FM.situacao && i.situacao !== FM.situacao) return false;
  const termos = norm(FM.busca).split(' ').filter(Boolean);
  if (termos.length) {
    const txt = norm([c && c.nome, c && c.categoria_outros, i.patrimonio, i.numero_serie, i.marca_modelo, i.tamanho, i.local_detalhe, i.avaria, i.avaria_sei, i.observacao, viaturaPref(i.viatura_id)].join(' '));
    if (!termos.every(t => txt.includes(t))) return false;
  }
  return true;
}
const itensMaterial = () => itensEscopo().filter(i => filtraMat(i));

function acoesItem(i) {
  if (!acessaSb(i.sb_id)) return '';
  return `<div class="acoes-linha">
    <button type="button" class="btn-ic" data-acao="item-mover" data-id="${i.id}" title="${ehGeral() ? 'Movimentar / transferir' : 'Movimentar'}" aria-label="Movimentar">${ic('mover')}</button>
    <button type="button" class="btn-ic" data-acao="item-situacao" data-id="${i.id}" title="${i.situacao === 'OPERACIONAL' ? 'Registrar avaria' : 'Alterar situação'}" aria-label="Situação">${ic(i.situacao === 'OPERACIONAL' ? 'alerta' : 'chave')}</button>
    <button type="button" class="btn-ic" data-acao="item-editar" data-id="${i.id}" title="Editar" aria-label="Editar registro">${ic('lapis')}</button>
  </div>`;
}
const COLUNAS_ITENS = [
  { id: 'mat', rotulo: 'Material', ordem: i => catNome(i.catalogo_id), html: i => { const c = catDe(i); return `<div class="cel-mat"><span class="nome">${esc(c ? c.nome : '')}</span><span class="meta">${tagCat(c)}${i.tamanho ? `<span>tam. ${esc(i.tamanho)}</span>` : ''}${i.marca_modelo ? `<span>${esc(i.marca_modelo)}</span>` : ''}${i.patrimonio ? plaq(i.patrimonio) : ''}</span></div>`; } },
  { id: 'qtd', rotulo: 'Qtd', classe: 'num', ordem: i => Number(i.quantidade), html: i => `<b>${fmtNum(i.quantidade)}</b> <small class="mudo">${esc(unidadeDe(i.catalogo_id))}</small>` },
  { id: 'loc', rotulo: 'Local', ordem: i => localTexto(i), html: i => localHTML(i) },
  { id: 'sit', rotulo: 'Situação', ordem: i => i.situacao, html: i => `<div class="cel-sit">${stBadge(SIT_ITEM, i.situacao, true)}${i.avaria ? `<small title="${esc(i.avaria)}">${esc(i.avaria)}</small>` : ''}</div>` },
  { id: 'val', rotulo: 'Validade', ordem: i => i.validade, html: i => badgeValidade(i.validade) },
  { id: 'acoes', rotulo: '', classe: 'col-acoes', html: acoesItem }
];

/* ---------- Cabeçalho: SBs, locais e áreas ---------- */
function abasSbHTML() {
  if (!ehGeral()) return `<div class="sb-titulo">${ic('predio')}<div><b>${esc(sbNome(minhaSb()))}</b><small>${esc((IDX.sb.get(minhaSb()) || {}).cidade || '')}</small></div></div>`;
  const sb = sbAtualMaterial();
  const n = id => soma(S.itens.filter(i => !id || i.sb_id === id), i => i.quantidade);
  return `<div class="abas abas-sb" role="tablist" aria-label="SB">
    <button type="button" role="tab" aria-selected="${!sb}" data-acao="mat-sb" data-id="">${ic('predio')}Todas as SBs <span class="cont">${fmtNum(n(null))}</span></button>
    ${S.sbs.filter(s => s.ativo !== false || s.id === sb).map(s => `<button type="button" role="tab" aria-selected="${sb === s.id}" data-acao="mat-sb" data-id="${s.id}">${esc(s.nome)}<small>${esc(s.cidade || '')}</small><span class="cont">${fmtNum(n(s.id))}</span></button>`).join('')}
  </div>`;
}
function locaisHTML() {
  const sb = sbAtualMaterial();
  if (!sb) return '';
  const its = S.itens.filter(i => i.sb_id === sb);
  const q = f => fmtNum(soma(its.filter(f), i => i.quantidade));
  const vs = (IDX.viaturasSb.get(sb) || []).filter(v => v.ativo !== false || its.some(i => i.viatura_id === v.id));
  const chip = (val, rot, cont, extra = '') => `<button type="button" class="chip-local${String(FM.local) === String(val) ? ' sel' : ''}" data-acao="mat-local" data-local="${val}" aria-pressed="${String(FM.local) === String(val)}">${rot}<span class="cont">${cont}</span>${extra}</button>`;
  return `<div class="locais" role="group" aria-label="Local">
    ${chip('', `${ic('grade')}Todos os locais`, q(() => true))}
    ${chip('sala', `${ic('caixa')}${LOCAL_SALA}`, q(i => !i.viatura_id))}
    ${vs.map(v => chip(v.id, `<span class="vtr-mini">${esc(v.prefixo)}</span>`, q(i => i.viatura_id === v.id), v.situacao !== 'OPERANDO' ? `<small class="mudo">${esc(SIT_VIATURA[v.situacao].rotulo)}</small>` : '')).join('')}
    ${ehGeral() ? `<button type="button" class="btn btn-sm btn-sec" data-acao="viatura-nova" data-sb="${sb}">${ic('mais')}<span>Viatura</span></button>` : ''}
  </div>`;
}
function cabViaturaHTML() {
  const v = FM.local && FM.local !== 'sala' ? IDX.viatura.get(+FM.local) : null;
  if (!v) return '';
  const its = IDX.itensViatura.get(v.id) || [];
  return `<div class="vtr-faixa${v.situacao === 'BAIXADA' ? ' baixada' : ''}">
    <div class="vtr-pref">${esc(v.prefixo)}</div>
    <div class="vtr-id"><div>${stBadge(SIT_VIATURA, v.situacao)}</div><span class="mudo">${esc([v.tipo, v.placa, sbRotulo(v.sb_id)].filter(Boolean).join(' · '))} · ${plural(its.length, 'registro', 'registros')}, ${fmtNum(soma(its, i => i.quantidade))} unidades</span>${v.observacao ? `<span class="mudo">${esc(v.observacao)}</span>` : ''}</div>
    <div class="vtr-acoes">
      <button type="button" class="btn btn-sm" data-acao="viatura-conferencia" data-id="${v.id}">${ic('impressora')}<span>Relação p/ conferência</span></button>
      ${acessaSb(v.sb_id) ? `<button type="button" class="btn btn-sm" data-acao="viatura-editar" data-id="${v.id}">${ic('lapis')}<span>${ehGeral() ? 'Editar / transferir' : 'Situação da viatura'}</span></button>` : ''}
      ${ehGeral() ? `<button type="button" class="btn btn-sm btn-perigo-sutil" data-acao="viatura-excluir" data-id="${v.id}">${ic('lixo')}<span>Excluir</span></button>` : ''}
    </div>
  </div>`;
}
function areasHTML() {
  const base = itensEscopo().filter(i => filtraMat(i, 'categoria'));
  const q = k => fmtNum(soma(base.filter(i => !k || (catDe(i) || {}).categoria === k), i => i.quantidade));
  const chip = (k, rot, icone, cls = '') => `<button type="button" class="chip-area ${cls}${FM.categoria === k ? ' sel' : ''}" data-acao="mat-area" data-cat="${k}" aria-pressed="${FM.categoria === k}">${icone ? ic(icone) : ''}<span>${esc(rot)}</span><span class="cont">${q(k)}</span></button>`;
  return `<div class="areas" role="group" aria-label="Área">${chip('', 'Todas as áreas', 'grade')}${Object.entries(CATEGORIAS).map(([k, c]) => chip(k, c.rotulo, c.icone, c.classe)).join('')}</div>`;
}
function filtrosMatHTML() {
  const mat = FM.material ? IDX.cat.get(+FM.material) : null;
  const a = k => FM[k] ? 'ativo' : '';
  return `<input type="search" id="mat-busca" class="${a('busca')}" value="${esc(FM.busca)}" placeholder="Buscar material, patrimônio, avaria…" aria-label="Buscar material">
    ${slc('situacao', [...opcoesSit(SIT_ITEM), ['FORA', 'Todos os avariados']], FM.situacao, { id: 'mat-situacao', 'data-fmat': 'situacao', class: a('situacao'), 'aria-label': 'Situação' }, 'Todas as situações')}
    ${vistaAgrupada() ? chk('zerados', FM.zerados, 'Incluir materiais zerados', { 'data-fmat-chk': 'zerados', id: 'mat-zerados' }) : ''}
    ${mat ? `<button type="button" class="chip-filtro" data-acao="mat-limpar-material" title="${sbAtualMaterial() ? 'Tirar o filtro do material' : 'Voltar à lista agrupada'}">${esc(mat.nome)} ${ic('x')}</button>` : ''}
    ${mat && !sbAtualMaterial() ? `<button type="button" class="btn btn-sm" data-acao="mat-limpar-material">${ic('grade')}<span>Voltar ao agrupado</span></button>` : ''}
    ${['busca', 'situacao', 'material', 'categoria'].some(k => FM[k]) ? `<button type="button" class="btn btn-sm" data-acao="mat-limpar">${ic('x')}<span>Limpar</span></button>` : ''}`;
}

/* ---------- Visões ---------- */
function registrosHTML() {
  const ls = itensMaterial();
  const vazio = S.itens.length ? 'Nenhum registro com esses filtros.' : 'Nenhum material cadastrado.';
  if (FM.categoria || FM.material) return { total: ls, html: `<section class="painel"><div class="painel-corpo sem-pad">${tabela({ chave: 'mat-' + (FM.categoria || 'm'), colunas: COLUNAS_ITENS, linhas: ls, classe: 'tab-cards', attrsLinha: i => `data-acao="item-ver" data-id="${i.id}"`, vazio })}</div></section>` };
  if (!ls.length) return { total: ls, html: `<section class="painel">${vazioEstado('caixa', vazio)}</section>` };
  const grupos = agrupar(ls, i => (catDe(i) || {}).categoria || 'OUTROS');
  return {
    total: ls,
    html: Object.keys(CATEGORIAS).filter(k => grupos.has(k)).map(k => {
      const g = grupos.get(k), c = CATEGORIAS[k];
      return `<section class="painel grupo-area area-${k.toLowerCase()}">
        <div class="painel-cab"><h2 class="painel-tit">${ic(c.icone)}${esc(c.rotulo)}</h2><span class="painel-sub">${plural(new Set(g.map(i => i.catalogo_id)).size, 'material', 'materiais')} · ${fmtNum(soma(g, i => i.quantidade))} unidades</span></div>
        <div class="painel-corpo sem-pad">${tabela({ chave: 'mat-' + k, colunas: COLUNAS_ITENS, linhas: g, classe: 'tab-cards', limite: 60, attrsLinha: i => `data-acao="item-ver" data-id="${i.id}"` })}</div>
      </section>`;
    }).join('')
  };
}
/** Agrupado (Todas as SBs): uma linha por material, com o que há em condições em cada SB, os avariados e o total do Grupamento. */
function colunasAgrupado() { return S.sbs.filter(s => s.ativo !== false || S.itens.some(i => i.sb_id === s.id)).map(s => ({ id: 'sb' + s.id, rot: s.nome, f: i => i.sb_id === s.id })); }
function agrupadoDados() {
  const its = itensEscopo().filter(i => filtraMat(i));
  const cols = colunasAgrupado();
  const porCat = agrupar(its, i => i.catalogo_id);
  const termos = norm(FM.busca).split(' ').filter(Boolean);
  const mats = (FM.zerados && !FM.situacao ? S.catalogo.filter(c => c.ativo !== false && (!FM.categoria || c.categoria === FM.categoria) && (!termos.length || termos.every(t => norm(c.nome).includes(t)))) : S.catalogo.filter(c => porCat.has(c.id)))
    .slice().sort((a, b) => cmp(a.nome, b.nome));
  return {
    cols,
    linhas: mats.map(c => {
      const g = porCat.get(c.id) || [];
      const op = g.filter(i => i.situacao === 'OPERACIONAL');
      const r = { c, total: soma(g, i => i.quantidade), fora: soma(g.filter(foraDeUso), i => i.quantidade), op: soma(op, i => i.quantidade) };
      for (const col of cols) r[col.id] = soma(op.filter(col.f), i => i.quantidade);
      return r;
    })
  };
}
function agrupadoHTML() {
  const { cols, linhas } = agrupadoDados();
  if (!linhas.length) return { total: linhas, html: `<section class="painel">${vazioEstado('caixa', S.itens.length ? 'Nenhum material com esses filtros.' : 'Nenhum material cadastrado.')}</section>` };
  const n = v => v ? fmtNum(v) : '<span class="mudo">·</span>';
  const colunas = [
    { id: 'mat', rotulo: 'Material', ordem: x => x.c.nome, html: x => `<div class="cel-mat"><span class="nome">${esc(x.c.nome)}</span><span class="meta">${tagCat(x.c)}<span>${esc(x.c.unidade)}</span></span></div>` },
    ...cols.map(c => ({ id: c.id, rotulo: c.rot, classe: 'num', ordem: x => x[c.id], html: x => n(x[c.id]) })),
    { id: 'op', rotulo: 'Em condições', classe: 'num col-forte', ordem: x => x.op, html: x => `<b>${fmtNum(x.op)}</b>` },
    { id: 'fora', rotulo: 'Avariados', classe: 'num', ordem: x => x.fora, html: x => x.fora ? `<span class="txt-bad">${fmtNum(x.fora)}</span>` : n(0) },
    { id: 'tot', rotulo: 'Total', classe: 'num', ordem: x => x.total, html: x => fmtNum(x.total) }
  ];
  const grupos = agrupar(linhas, x => x.c.categoria || 'OUTROS');
  return {
    total: linhas,
    html: Object.keys(CATEGORIAS).filter(k => grupos.has(k)).map(k => {
      const g = grupos.get(k), c = CATEGORIAS[k];
      return `<section class="painel grupo-area area-${k.toLowerCase()}">
        <div class="painel-cab"><h2 class="painel-tit">${ic(c.icone)}${esc(c.rotulo)}</h2><span class="painel-sub">${plural(g.length, 'material', 'materiais')} · ${fmtNum(soma(g, x => x.total))} unidades</span></div>
        <div class="painel-corpo sem-pad">${tabela({ chave: 'mat-agr-' + k, colunas, linhas: g, classe: 'tab-consol', limite: 600, attrsLinha: x => `data-acao="mat-ver-material" data-id="${x.c.id}" title="Ver onde está cada unidade"` })}</div>
      </section>`;
    }).join('')
  };
}

VIEWS.material = {
  titulo: 'Material das SBs',
  sub: () => ehGeral() ? 'Sala de material operacional e viaturas de cada SB' : `${sbRotulo(minhaSb())}: sala de material operacional e viaturas`,
  render(el) {
    if (!ehGeral()) FM.sb = String(minhaSb());
    el.innerHTML = `
      <div class="cab-pagina"><div id="mat-sbs"></div><div class="acoes" id="mat-acoes"></div></div>
      <div id="mat-locais"></div><div id="mat-vtr"></div>
      <div id="mat-areas"></div>
      <div class="filtros" id="mat-filtros"></div>
      <div class="mat-resumo" id="mat-total"></div>
      <div id="mat-res" class="mat-res"></div>`;
    const filtros = $('#mat-filtros', el);
    const buscar = debounce(() => { this.atualizarRes(); $('#mat-areas').innerHTML = areasHTML(); }, 180);
    filtros.addEventListener('input', e => { if (e.target.id === 'mat-busca') { FM.busca = e.target.value; e.target.classList.toggle('ativo', !!FM.busca); buscar(); } });
    filtros.addEventListener('change', e => {
      const s = e.target.closest('[data-fmat]'), c = e.target.closest('[data-fmat-chk]');
      if (s) { FM[s.dataset.fmat] = s.value; this.atualizar(s.id); }
      else if (c) { FM[c.dataset.fmatChk] = c.checked; this.atualizar(c.id); }
    });
    this.atualizar();
  },
  atualizar(focarId = null) {
    const box = $('#mat-sbs'); if (!box) return;
    if (FM.local && FM.local !== 'sala') { const v = IDX.viatura.get(+FM.local); if (!v || v.sb_id !== sbAtualMaterial()) FM.local = ''; }
    if (!sbAtualMaterial()) FM.local = '';
    box.innerHTML = abasSbHTML();
    const sb = sbAtualMaterial();
    $('#mat-acoes').innerHTML = `
      <button type="button" class="btn btn-pri" data-acao="item-novo">${ic('mais')}<span>Cadastrar material</span></button>
      <button type="button" class="btn" data-acao="importar-itens">${ic('subir')}<span>Importar</span></button>
      <button type="button" class="btn" data-acao="mat-exportar">${ic('baixar')}<span>Exportar CSV</span></button>
      <button type="button" class="btn" data-acao="mat-imprimir">${ic('impressora')}<span>Relação</span></button>`;
    $('#mat-locais').innerHTML = locaisHTML();
    $('#mat-vtr').innerHTML = cabViaturaHTML();
    $('#mat-areas').innerHTML = areasHTML();
    $('#mat-filtros').innerHTML = filtrosMatHTML();
    if (focarId) { const f = document.getElementById(focarId); if (f) f.focus(); }
    this.atualizarRes();
    if (!sb && ehGeral() && !S.sbs.length) $('#mat-res').innerHTML = vazioEstado('predio', 'Nenhuma SB cadastrada', 'Execute o script 01_estrutura.sql no Supabase.');
  },
  atualizarRes() {
    const res = $('#mat-res'); if (!res) return;
    const agr = vistaAgrupada();
    const r = agr ? agrupadoHTML() : registrosHTML();
    const escopo = [sbAtualMaterial() ? sbNome(sbAtualMaterial()) : 'Todas as SBs', FM.local === 'sala' ? LOCAL_SALA : (FM.local ? viaturaPref(+FM.local) : ''), FM.categoria ? CATEGORIAS[FM.categoria].rotulo : ''].filter(Boolean).join(' · ');
    $('#mat-total').textContent = agr
      ? `${escopo} · ${plural(r.total.length, 'material', 'materiais')} · ${fmtNum(soma(r.total, x => x.total))} unidades (${fmtNum(soma(r.total, x => x.op))} em condições, ${fmtNum(soma(r.total, x => x.fora))} avariadas) · clique no material para ver onde está cada unidade`
      : `${escopo} · ${plural(r.total.length, 'registro', 'registros')} · ${fmtNum(soma(r.total, i => i.quantidade))} unidades`;
    res.innerHTML = r.html;
  }
};

/* ---------- Viaturas ---------- */
function formViatura(v = null, sbPadrao = null) {
  const d = v || { situacao: 'OPERANDO', ativo: true, sb_id: sbPadrao || minhaSb() };
  const geral = ehGeral();
  abrirForm({
    titulo: v ? `Viatura ${v.prefixo}` : 'Cadastrar viatura',
    subtitulo: v && geral ? 'Ao mudar a SB, todo o material embarcado vai junto e fica registrado no histórico das duas SBs.' : '',
    corpo: `<div class="grade g3">
        ${fld('Prefixo', inp('prefixo', d.prefixo, { autofocus: !v, maxlength: 20, placeholder: 'Ex.: ABTS 1180', class: 'mono', disabled: !geral }), { obrig: true })}
        ${fld('Tipo', inp('tipo', d.tipo, { list: 'dl-tipos-vtr', maxlength: 20, placeholder: 'ABTS, AR, ACO…', disabled: !geral }))}
        ${fld('Placa', inp('placa', d.placa, { maxlength: 10, class: 'mono' }))}
      </div>
      <div class="grade g2">
        ${geral ? fld('SB', slc('sb_id', opcoesSbs(d.sb_id), d.sb_id, {}, 'Escolha...'), { obrig: true }) : `<div class="fld"><span class="fld-rot">SB</span><div class="fixo">${esc(sbRotulo(d.sb_id))}</div></div>`}
        ${fld('Situação', slc('situacao', opcoesSit(SIT_VIATURA), d.situacao, { autofocus: !geral }))}
      </div>
      ${fld('Observação', txa('observacao', d.observacao, { rows: 2 }))}
      ${v && geral ? chk('ativo', d.ativo !== false, 'Ativa (aparece nas listas)') : ''}
      ${datalist('dl-tipos-vtr', TIPOS_VIATURA)}`,
    aoSalvar: async f => {
      const dados = { placa: limpa(f.placa) && f.placa.trim().toUpperCase(), situacao: f.situacao, observacao: limpa(f.observacao) };
      if (geral) {
        if (!idNum(f.sb_id)) throw new ErroApp('Informe a SB da viatura.');
        Object.assign(dados, { prefixo: limpa(f.prefixo) && f.prefixo.trim().toUpperCase(), tipo: limpa(f.tipo) && f.tipo.trim().toUpperCase(), sb_id: idNum(f.sb_id) });
        if (v) dados.ativo = !!f.ativo;
      }
      if (v && geral && dados.sb_id !== v.sb_id) {
        const n = (IDX.itensViatura.get(v.id) || []).length;
        if (!await confirmar({ titulo: 'Transferir viatura', mensagem: `Transferir ${v.prefixo} da ${sbNome(v.sb_id)} para a ${sbNome(dados.sb_id)}? ${n ? `Os ${n} registros de material embarcado vão junto.` : ''}`, botao: 'Transferir' })) return false;
      }
      const r = v ? await DB.atualizar('viaturas', v.id, dados) : await DB.inserir('viaturas', dados);
      if (v && geral && r.sb_id !== v.sb_id) await carregarDados({ render: false });
      toast(v ? (r.sb_id !== v.sb_id ? `Viatura ${r.prefixo} transferida para a ${sbNome(r.sb_id)}.` : 'Viatura atualizada.') : `Viatura ${r.prefixo} cadastrada.`);
      aposMudanca();
    }
  });
}
function folhaViatura(v) {

  return cabecalhoFolha(`Relação de material — ${v.prefixo}`, `${esc([v.tipo, v.placa].filter(Boolean).join(' · '))} · ${esc(sbRotulo(v.sb_id))} · Conferência em ____/____/________`) +
    [...grupos.entries()].map(([g, gi]) => `<h3>${esc(g)}</h3><table class="folha-tab"><thead><tr><th>Nº</th><th>Material</th><th>Área</th><th>Qtd</th><th>Situação no sistema</th><th class="ck">OK</th><th>Observação na conferência</th></tr></thead><tbody>
      ${gi.map(i => `<tr><td class="num">${++n}</td><td>${esc(catNome(i.catalogo_id))}${i.tamanho ? ' — tam. ' + esc(i.tamanho) : ''}${i.patrimonio ? ' — patr. ' + esc(i.patrimonio) : ''}</td><td>${esc((CATEGORIAS[(catDe(i) || {}).categoria] || {}).rotulo || '')}</td><td class="num">${fmtNum(i.quantidade)} ${esc(unidadeDe(i.catalogo_id))}</td><td>${esc(SIT_ITEM[i.situacao].curto)}${i.validade ? ' · val. ' + fmtData(i.validade) : ''}</td><td class="ck"><span></span></td><td></td></tr>`).join('')}

}

/* =====================================================================
   VIATURAS — controle de todas as viaturas: cadastro, edição, situação,
   SB onde se encontram (transferência com o material embarcado) e exclusão
   ===================================================================== */
const FV = { sb: '', situacao: '', busca: '', inativas: false };

function embarcado(v) { const its = IDX.itensViatura.get(v.id) || []; return { regs: its.length, un: soma(its, i => i.quantidade), av: soma(its.filter(foraDeUso), i => i.quantidade) }; }
function viaturasFiltradas() {
  const t = norm(FV.busca).split(' ').filter(Boolean);
  const ordSb = id => { const s = IDX.sb.get(id); return s ? (s.ordem ?? s.numero ?? 0) : 999; };
  return S.viaturas.filter(v => {
    if (!FV.inativas && v.ativo === false) return false;
    if (FV.sb && v.sb_id !== +FV.sb) return false;
    if (FV.situacao && v.situacao !== FV.situacao) return false;
    if (t.length) { const x = norm([v.prefixo, v.tipo, v.placa, v.observacao, sbNome(v.sb_id)].join(' ')); if (!t.every(p => x.includes(p))) return false; }
    return true;
  }).sort((a, b) => cmp(ordSb(a.sb_id), ordSb(b.sb_id)) || cmp(a.prefixo, b.prefixo));
}
function acoesViatura(v) {
  if (!acessaSb(v.sb_id)) return '';
  const b = (acao, icone, titulo, cls = '') => `<button type="button" class="btn-ic ${cls}" data-acao="${acao}" data-id="${v.id}" title="${titulo}" aria-label="${titulo}">${ic(icone)}</button>`;
  return `<div class="acoes-linha">
    ${b('viatura-ver', 'caixa', 'Ver o material embarcado')}
    ${b('viatura-conferencia', 'impressora', 'Relação para conferência')}
    ${b('viatura-editar', 'lapis', ehGeral() ? 'Editar' : 'Situação da viatura')}
    ${ehGeral() ? b('viatura-transferir', 'mover', 'Mudar de SB') : ''}
    ${ehGeral() ? b('viatura-excluir', 'lixo', 'Excluir', 'btn-perigo-sutil') : ''}
  </div>`;
}
const COLUNAS_VIATURAS = [
  { id: 'pref', rotulo: 'Viatura', ordem: v => v.prefixo, html: v => `<div class="cel-mat"><span class="nome"><span class="vtr-mini">${esc(v.prefixo)}</span></span><span class="meta">${v.tipo ? `<span>${esc(v.tipo)}</span>` : ''}${v.placa ? `<span class="mono">${esc(v.placa)}</span>` : ''}${v.ativo === false ? '<span class="mudo">desativada</span>' : ''}</span></div>` },
  { id: 'sb', rotulo: 'Onde está (SB)', ordem: v => sbNome(v.sb_id), html: v => `<span class="forte">${esc(sbNome(v.sb_id))}</span> <small class="mudo">${esc((IDX.sb.get(v.sb_id) || {}).cidade || '')}</small>` },
  { id: 'sit', rotulo: 'Situação', ordem: v => v.situacao, html: v => stBadge(SIT_VIATURA, v.situacao) },
  { id: 'mat', rotulo: 'Material embarcado', classe: 'num', ordem: v => embarcado(v).un, html: v => { const e = embarcado(v); return e.regs ? `<b>${fmtNum(e.un)}</b> <small class="mudo">un. · ${plural(e.regs, 'registro', 'registros')}</small>${e.av ? `<small class="sub txt-bad">${fmtNum(e.av)} avariadas</small>` : ''}` : '<span class="mudo">vazia</span>'; } },
  { id: 'obs', rotulo: 'Observação', ordem: v => v.observacao, html: v => v.observacao ? `<small class="vtr-obs">${esc(v.observacao)}</small>` : '<span class="mudo">—</span>' },
  { id: 'acoes', rotulo: '', classe: 'col-acoes', html: acoesViatura }
];

  titulo: 'Viaturas',

    ].map(([s, rot, icone, cls, sub]) => kpiHTML({ rot, icone, cls: cls + (FV.situacao === s ? ' sel' : ''), val: fmtNum(n(s)), sub, acao: 'vt-sit', dados: `data-sit="${s}"` })).join('') +
      kpiHTML({ rot: 'Material embarcado', icone: 'caixa', cls: 'k-info', val: fmtNum(soma(emb, e => e.un)), unid: 'un.', sub: `${plural(soma(emb, e => e.regs), 'registro', 'registros')} nas viaturas` });

  }
};

/** Mudar a viatura de SB (só o Geral): o material embarcado vai junto e fica no histórico das duas SBs. */
function formTransferirViatura(v) {
  const e = embarcado(v);
  const destinos = opcoesSbs().filter(([id]) => Number(id) !== v.sb_id);
  abrirForm({
    titulo: `Mudar ${v.prefixo} de SB`, botao: 'Transferir',
    subtitulo: 'A viatura passa a aparecer só para a SB de destino (e para o Geral), na hora, para todos os perfis.',
    corpo: `<div class="resumo-item">
        <div class="resumo-tit"><span class="vtr-mini">${esc(v.prefixo)}</span> ${stBadge(SIT_VIATURA, v.situacao)}</div>
        <div class="resumo-loc">${ic('predio')}<span>Hoje na ${esc(sbRotulo(v.sb_id))}</span></div>
        <div class="resumo-loc">${ic('caixa')}<span>${e.regs ? `${plural(e.regs, 'registro', 'registros')} de material embarcado (${fmtNum(e.un)} unidades): vão junto com a viatura.` : 'Sem material embarcado.'}</span></div>
      </div>
      ${fld('Transferir para', slc('sb_id', destinos, '', { autofocus: true }, 'Escolha a SB...'), { obrig: true })}`,
    aoSalvar: async d => {
      const destino = idNum(d.sb_id);
      if (!destino) throw new ErroApp('Escolha a SB de destino.');
      const atual = IDX.viatura.get(v.id) || v;
      const r = await DB.atualizar('viaturas', atual.id, { sb_id: destino });
      await carregarDados({ render: false });
      toast(`Viatura ${r.prefixo} transferida para a ${sbNome(r.sb_id)}${e.regs ? `, com ${plural(e.regs, 'registro', 'registros')} de material` : ''}.`);
      aposMudanca();
    }
  });
}

const FE = { sb: '', status: '', falta: '', situacao: 'ATIVO', busca: '' };

function militaresFiltrados() {
  const t = norm(FE.busca).split(' ').filter(Boolean);
  return S.militares.filter(m => {
    if (FE.sb === 'sem') { if (m.sb_id) return false; }
    else if (FE.sb && m.sb_id !== +FE.sb) return false;
    if (FE.situacao === 'ATIVO' ? !(m.situacao === 'ATIVO' || m.situacao === 'AFASTADO') : (FE.situacao && m.situacao !== FE.situacao)) return false;
    if (FE.status && statusEpiMilitar(m) !== FE.status) return false;
    if (FE.falta && episAtivos(m.id).some(e => e.tipo_id === +FE.falta)) return false;
    if (t.length) { const x = norm([m.posto_grad, m.quadro, m.nome, m.nome_guerra, m.matricula, m.lotacao, m.funcao].join(' ')); if (!t.every(p => x.includes(p))) return false; }
    return true;
  });
}
function celulaEpi(m, t) {
  const es = episAtivos(m.id).filter(e => e.tipo_id === t.id);
  if (!es.length) return '<span class="epi-nao" aria-label="não">—</span>';
  const ver = es.some(e => e.situacao === 'VERIFICAR');

  const dica = es.map(e => [e.descricao, e.tamanho && 'tam. ' + e.tamanho, e.processo_sei && 'SEI ' + e.processo_sei, e.situacao === 'VERIFICAR' && 'a verificar'].filter(Boolean).join(' · ')).join('\n');
  return `<span class="epi-sim${ver ? ' ver' : ''}" title="${esc(dica)}">${ic(ver ? 'alerta' : 'check')}${es.length > 1 ? `<b>${es.length}</b>` : ''}${tams ? `<small>${esc(tams.length > 9 ? tams.slice(0, 8) + '…' : tams)}</small>` : ''}</span>`;
}
function colunasEfetivo() {

    ...tipos.map(t => ({ id: 't' + t.id, rotulo: t.nome, classe: 'col-epi', ordem: m => episAtivos(m.id).some(e => e.tipo_id === t.id) ? 0 : 1, html: m => celulaEpi(m, t) })),

    if (FF.sb && f.sb_id !== +FF.sb) return false;
