  --info: #1c5cba;
  --info-soft: #e5edfa;
  --cat-aph: #0a7552; --cat-aph-bg: #e0f3eb;
  --cat-inc: #b0421a; --cat-inc-bg: #fde9df;

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body.com-modal { overflow: hidden; }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--info); }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; }
.mono, .sei, .plaq { font-family: var(--f-mono); }
.mudo { color: var(--ink-3); }
.forte { font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.sub { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.ajuda { color: var(--ink-2); font-size: 14px; }
.erro-txt { color: var(--bad); }
.aviso-txt { color: var(--warn); display: inline-flex; align-items: center; gap: 4px; }
.aviso-txt .ic { width: 15px; height: 15px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: var(--lateral) minmax(0, 1fr); min-height: 100%; background: linear-gradient(90deg, var(--nav-bg) var(--lateral), var(--bg) var(--lateral)); }
.lateral {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  background: var(--nav-bg); color: var(--nav-ink); display: flex; flex-direction: column;
  border-right: 1px solid var(--nav-line);
}
.marca { display: flex; align-items: center; gap: 12px; padding: 18px 16px 16px; border-bottom: 1px solid var(--nav-line); }
.marca-selo {
  width: 46px; height: 46px; flex: none; border-radius: 4px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-family: var(--f-display); font-size: 21px; line-height: .86;
  letter-spacing: .02em; text-align: center; box-shadow: inset 0 -3px 0 var(--gold);
}
.marca-txt { display: flex; flex-direction: column; min-width: 0; }
.marca-txt strong { color: var(--nav-ink-forte); font-family: var(--f-display); font-weight: 400; font-size: 21px; letter-spacing: .04em; line-height: 1.05; }
.marca-txt small { color: var(--nav-ink); font-size: 12px; letter-spacing: .02em; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; flex: 1; }
.nav-sec { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #6f7c94; padding: 14px 10px 6px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r);
  color: var(--nav-ink); text-decoration: none; font-weight: 500; font-size: 15px;
}
.nav a:hover { background: var(--nav-bg-2); color: var(--nav-ink-forte); }
.nav a[aria-current="page"] { background: var(--nav-bg-2); color: var(--nav-ink-forte); }
.nav a[aria-current="page"] .ic { color: var(--accent); }
.nav a .ic { color: #8090ab; }
.nav-cont { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 10px; background: #26324a; color: #d5dcea; }
.nav-cont.alerta { background: var(--warn-fill); color: #1c1300; }
.lateral-rodape { padding: 12px 16px 16px; border-top: 1px solid var(--nav-line); font-size: 12.5px; display: flex; flex-direction: column; gap: 8px; }
.usr { display: flex; align-items: center; gap: 10px; }
.usr-av { width: 32px; height: 32px; border-radius: 50%; background: #2a3650; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.usr-av .ic { width: 16px; height: 16px; }
.usr-av-geral { background: var(--accent); }
.lr-acoes { display: flex; gap: 6px; flex-wrap: wrap; }
.usr-txt { min-width: 0; display: flex; flex-direction: column; }
.usr-txt strong { color: var(--nav-ink-forte); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usr-txt small { color: var(--nav-ink); }
.lateral-rodape .btn-nav { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--nav-line); color: var(--nav-ink); border-radius: var(--r); padding: 6px 10px; cursor: pointer; }
.lateral-rodape .btn-nav:hover { color: #fff; border-color: #3a4864; }
.principal { min-width: 0; display: flex; flex-direction: column; }
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.btn-ic.topo-menu { display: none; }
.topo-tit { min-width: 0; display: flex; flex-direction: column; }
.topo-tit h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .03em; line-height: 1; }
.topo-tit span { color: var(--ink-3); font-size: 13px; }
.busca-global { position: relative; margin-left: auto; width: min(380px, 40vw); }
.busca-global input { width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); }
.busca-global .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.busca-res { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sombra-alta); max-height: 70vh; overflow: auto; z-index: 40; padding: 6px; }
.busca-res button { display: flex; width: 100%; text-align: left; gap: 10px; align-items: center; padding: 8px 10px; background: none; border: 0; border-radius: var(--r); cursor: pointer; }
.busca-res button:hover, .busca-res button:focus-visible { background: var(--surface-2); }
.busca-res .br-tipo { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); width: 64px; flex: none; }
.busca-res .br-txt { min-width: 0; display: flex; flex-direction: column; }
.busca-res .br-txt small { color: var(--ink-3); }
.busca-res .br-vazio { padding: 12px; color: var(--ink-3); }
.topo-acesso { display: flex; align-items: center; gap: 8px; flex: none; }
.chip-perfil { display: inline-flex; align-items: center; gap: 8px; max-width: 280px; padding: 4px 12px 4px 8px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px; white-space: nowrap; line-height: 1.15; }
.chip-perfil .ic { width: 16px; height: 16px; flex: none; color: var(--info); }
.chip-perfil.geral .ic { color: var(--accent); }
.chip-perfil .ce-txt { display: flex; flex-direction: column; overflow: hidden; }
.chip-perfil b { color: var(--ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.chip-perfil small { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.status-vivo { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.status-vivo i { width: 8px; height: 8px; border-radius: 50%; background: var(--off-fill); }
.status-vivo.on i { background: var(--ok-fill); box-shadow: 0 0 0 3px var(--ok-soft); }
.faixa { display: flex; align-items: flex-start; gap: 10px; padding: 8px 24px; background: var(--warn-soft); color: var(--warn); font-size: 13.5px; border-bottom: 1px solid var(--line); }
.faixa .ic { width: 16px; height: 16px; margin-top: 2px; }
.faixa > span { min-width: 0; }
.faixa b { font-weight: 700; letter-spacing: .02em; }
.conteudo { padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.conteudo:focus { outline: none; }
.veu-lateral { display: none; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px;
  border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14.5px; cursor: pointer; white-space: nowrap; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn .ic { width: 17px; height: 17px; }
.btn-pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-pri:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-sec { background: var(--surface-2); }
.btn-perigo { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-perigo:hover { filter: brightness(1.08); background: var(--bad); }
.btn-perigo-sutil { color: var(--bad); }
.btn-perigo-sutil:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn-ic.btn-perigo-sutil { color: var(--bad); }
.btn-sm { padding: 6px 10px; font-size: 13.5px; }
.btn-xs { padding: 3px 8px; font-size: 12.5px; gap: 4px; }
.btn-xs .ic { width: 14px; height: 14px; }
.btn.carregando { position: relative; color: transparent !important; }
.btn.carregando::after { content: ''; position: absolute; width: 16px; height: 16px; border: 2px solid var(--accent-ink); border-right-color: transparent; border-radius: 50%; animation: gira .7s linear infinite; }
.btn:not(.btn-pri):not(.btn-perigo).carregando::after { border-color: var(--ink); border-right-color: transparent; }
@keyframes gira { to { transform: rotate(360deg); } }
.btn-ic { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r); border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-2); flex: none; }
.btn-ic:hover { background: var(--surface-3); color: var(--ink); }
.lnk { background: none; border: 0; padding: 0; color: var(--info); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font: inherit; text-align: left; }
.lnk.forte { font-weight: 600; color: var(--ink); text-decoration-color: var(--line-2); }
.lnk:hover { text-decoration-color: currentColor; }

/* ---------- Painéis e cabeçalhos ---------- */
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sombra); min-width: 0; }
.painel-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; flex-wrap: wrap; }
.painel-tit { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.painel-tit .ic { color: var(--ink-3); }
.painel-sub { color: var(--ink-3); font-size: 13px; }
.painel-corpo { padding: 0 16px 16px; }
.painel-corpo.sem-pad { padding: 0; }
.cab-pagina { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cab-pagina .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.abas button { background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; }
.abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.abas button:hover { color: var(--ink); }
.cont { font-size: 12px; font-variant-numeric: tabular-nums; background: var(--surface-3); color: var(--ink-2); padding: 1px 7px; border-radius: 10px; font-weight: 600; }
.sub-tit { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
.sub-tit .ic { color: var(--ink-3); }

/* ---------- Filtros ---------- */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filtros input[type=search], .filtros select {
  padding: 7px 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); min-width: 0;
}
.filtros input[type=search] { flex: 1 1 240px; max-width: 340px; }
.filtros select { flex: 0 1 auto; max-width: 220px; }
.filtros select.ativo, .filtros input.ativo { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.filtros .chk { font-size: 14px; }
.chips-filtro { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-filtro { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; border: 0; cursor: pointer; }
.chip-filtro .ic { width: 14px; height: 14px; }

/* ---------- Formulários ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld-rot { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.obrig { color: var(--accent); font-weight: 700; }
.fld input:not([type=checkbox]):not([type=radio]), .fld select, .fld textarea, .cl-linha input, .cl-linha select, .copia-area {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); min-width: 0;
}
.fld textarea { resize: vertical; }
.fld input:focus, .fld select:focus, .fld textarea:focus, .cl-linha input:focus, .cl-linha select:focus { outline: none; border-color: var(--info); box-shadow: 0 0 0 3px var(--info-soft); }
.fld input:disabled, .fld select:disabled, .fld textarea:disabled { background: var(--surface-2); color: var(--ink-3); }
.fld input[readonly], .cl-linha input[readonly] { background: var(--surface-2); }
.fld-dica { color: var(--ink-3); font-size: 12.5px; }
.fld.realce .fld-rot::after { content: ' · recomendado'; color: var(--info); font-weight: 500; }
.fixo { padding: 8px 10px; border: 1px dashed var(--line-2); border-radius: var(--r); background: var(--surface-2); font-weight: 600; }
.grade { display: grid; gap: 12px; }
.grade.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grade.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grupo { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px 14px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grupo legend { padding: 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.bloco-cond { display: flex; flex-direction: column; gap: 12px; }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14.5px; }
.chk input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.linha-chk { display: flex; gap: 10px 22px; flex-wrap: wrap; }
.form-erro { background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); padding: 10px 12px; border-radius: var(--r); font-weight: 600; font-size: 14px; }
.mat-linha { display: flex; gap: 8px; align-items: center; }
.mat-linha input { flex: 1; }
.mat-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); min-height: 20px; }
.fld-mat.compacto .mat-info { min-height: 0; font-size: 12px; }
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.aviso .ic { margin-top: 1px; }
.aviso-info { background: var(--info-soft); border-color: transparent; color: var(--ink); }
.aviso-info .ic { color: var(--info); }
.aviso-warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.aviso-warn .ic { color: var(--warn); }
.aviso-off { background: var(--off-soft); border-color: transparent; color: var(--ink); }
.aviso-bad { background: var(--bad-soft); border-color: transparent; color: var(--ink); }
.aviso-bad .ic { color: var(--bad); }

/* Linhas dinâmicas (cautela / pedido) */
.cl-cab, .cl-linha { display: grid; grid-template-columns: minmax(180px, 2.2fr) 72px 70px minmax(110px, 1fr) minmax(170px, 1.6fr) 32px; gap: 8px; align-items: start; }
.cl-cab { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 0 2px; }
.cl-lista, .fi-lista { display: flex; flex-direction: column; gap: 8px; }
.cl-linha .fld-mat { gap: 2px; }
.fi-cab, .fi-linha { display: grid; grid-template-columns: minmax(200px, 2.2fr) 80px minmax(140px, 1.5fr) 90px 32px; gap: 8px; align-items: start; }
.fi-cab { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.fi-linha input { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); min-width: 0; }
.fi-linha .fi-rec { font-size: 12px; color: var(--ink-3); grid-column: 1 / -1; margin-top: -4px; }
.rc-item { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.rc-cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.rc-cab strong { font-size: 15px; }

/* ---------- Distintivos ---------- */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px 1px 5px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; vertical-align: middle; }
.tag .ic { width: 13px; height: 13px; }
.cat-aph { color: var(--cat-aph); background: var(--cat-aph-bg); }
.cat-inc { color: var(--cat-inc); background: var(--cat-inc-bg); }
.cat-sal { color: var(--cat-sal); background: var(--cat-sal-bg); }
.cat-aqu { color: var(--cat-aqu); background: var(--cat-aqu-bg); }
.cat-out { color: var(--cat-out); background: var(--cat-out-bg); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; white-space: nowrap; padding: 2px 8px 2px 6px; border-radius: 12px; }
.st .ic { width: 14px; height: 14px; }
.st-ok { color: var(--ok); background: var(--ok-soft); }
.st-warn { color: var(--warn); background: var(--warn-soft); }
.st-off { color: var(--off); background: var(--off-soft); }
.st-bad { color: var(--bad); background: var(--bad-soft); }
.st-info { color: var(--info); background: var(--info-soft); }
.pr { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; }
.pr-alta { background: var(--bad-soft); color: var(--bad); }
.pr-media { background: var(--warn-soft); color: var(--warn); }
.pr-baixa { background: var(--off-soft); color: var(--off); }
.plaq {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; letter-spacing: .03em;
  padding: 1px 7px 1px 5px; border: 1px solid var(--line-2); border-radius: 3px; white-space: nowrap;
  background: linear-gradient(180deg, var(--surface-2), var(--surface-3)); color: var(--ink);
}
.plaq::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); box-shadow: inset 0 0 0 1px var(--ink-3); flex: none; }
.sei { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.val { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.val .ic { width: 14px; height: 14px; }
.val-venc { color: var(--bad); font-weight: 600; }
.val-prox { color: var(--warn); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 1px 8px; border-radius: 10px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.chip .ic { width: 13px; height: 13px; }
.chip-sutil { background: transparent; border: 1px solid var(--line-2); font-size: 11.5px; }
.vtr-mini { display: inline-block; font-family: var(--f-display); font-size: 15px; letter-spacing: .05em; line-height: 1; padding: 3px 6px 2px; border-radius: 3px; background: var(--nav-bg); color: #fff; white-space: nowrap; }
.loc { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.loc small { flex-basis: 100%; color: var(--ink-3); font-size: 12.5px; }
.loc-caut { color: var(--info); font-weight: 600; font-size: 13.5px; }
.loc-caut .ic { width: 15px; height: 15px; }

/* ---------- Tabelas ---------- */
.tab-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.tab th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.tab td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tab tbody tr:last-child td { border-bottom: 0; }
.tab tbody tr[data-acao] { cursor: pointer; }
.tab tbody tr[data-acao]:hover td { background: var(--surface-2); }
.tab .num { text-align: right; }
.tab th.num .th-ord { justify-content: flex-end; width: 100%; }
.th-ord { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.th-ord:hover { color: var(--ink); }
.th-seta { font-size: 11px; opacity: .6; }
.tab td.col-acoes { width: 1%; white-space: nowrap; }
.acoes-linha { display: flex; gap: 2px; justify-content: flex-end; align-items: center; }
.acoes-linha .btn-ic { width: 30px; height: 30px; }
.acoes-linha .btn-ic .ic { width: 16px; height: 16px; }
.tab-vazio { padding: 28px 12px; text-align: center; color: var(--ink-3); }
.tab-mais { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; color: var(--ink-3); font-size: 13.5px; border-top: 1px solid var(--line); }
.cel-mat { display: flex; flex-direction: column; gap: 3px; min-width: 180px; }
.cel-mil { white-space: nowrap; }
.cel-mil .chip { margin-top: 3px; }
.cel-mat-c { min-width: 170px; }
.cel-mat .nome { font-weight: 600; }
.cel-mat .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--ink-3); font-size: 12.5px; }
.cel-sit { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; max-width: 260px; }
.cel-sit small { color: var(--ink-3); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.barra-prog { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.barra-prog .bp-trilho { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.barra-prog .bp-fill { height: 100%; border-radius: 3px; background: var(--ok-fill); }
.barra-prog .bp-fill.parcial { background: var(--warn-fill); }
.barra-prog span { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 34px; text-align: right; }
.alerta-min { color: var(--bad); font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
.alerta-min .ic { width: 14px; height: 14px; }

/* ---------- Painel (dashboard) ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px 13px; display: flex; flex-direction: column; gap: 4px; min-width: 0; box-shadow: var(--sombra); }
.kpi-rot { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.kpi-rot-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kpi-rot .ic { width: 16px; height: 16px; color: var(--ink-3); }
.kpi-val { font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.kpi-val small { font-size: 15px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
.kpi-sub { font-size: 12.5px; color: var(--ink-3); }
.kpi.k-ok .kpi-rot .ic { color: var(--ok); }
.kpi.k-warn .kpi-rot .ic { color: var(--warn); }
.kpi.k-off .kpi-rot .ic { color: var(--off); }
.kpi.k-info .kpi-rot .ic { color: var(--info); }
.kpi.k-bad .kpi-rot .ic { color: var(--bad); }
.kpi.k-bad .kpi-val { color: var(--bad); }
.kpi-medidor { height: 6px; border-radius: 3px; background: var(--ok-soft); overflow: hidden; margin-top: 4px; }
.kpi-medidor i { display: block; height: 100%; background: var(--ok-fill); border-radius: 3px; }
button.kpi { text-align: left; cursor: pointer; font: inherit; color: inherit; }
button.kpi:hover { border-color: var(--line-2); }
.dash-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.dash-grade .largo { grid-column: 1 / -1; }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.barras { display: flex; flex-direction: column; gap: 9px; }
.barra-l { display: grid; grid-template-columns: minmax(96px, 30%) minmax(0, 1fr) 52px; gap: 10px; align-items: center; }
.barra-rot { background: none; border: 0; padding: 0; text-align: left; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.barra-rot:hover { text-decoration: underline; text-underline-offset: 2px; }
.barra-rot.sel { font-weight: 700; color: var(--accent); }
.barra-trilho { display: flex; gap: 2px; height: 18px; align-items: stretch; min-width: 0; }
.seg { border: 0; padding: 0; cursor: pointer; min-width: 3px; height: 100%; }
.seg:last-child { border-radius: 0 4px 4px 0; }
.seg:hover, .seg:focus-visible { filter: brightness(1.12) saturate(1.1); outline-offset: 1px; }
.seg-ok { background: var(--ok-fill); }
.seg-warn { background: var(--warn-fill); }
.seg-off { background: var(--off-fill); }
.barra-val { font-size: 13.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.barras-vazio { color: var(--ink-3); font-size: 14px; padding: 8px 0; }
.mini-lista { display: flex; flex-direction: column; }
.mini-l { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
.mini-l:last-child { border-bottom: 0; }
.mini-l.clicavel { cursor: pointer; }
.mini-l.clicavel:hover .mini-tit { text-decoration: underline; text-underline-offset: 2px; }
.mini-tit { font-weight: 600; font-size: 14px; min-width: 0; }
.mini-sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.mini-dir { text-align: right; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.medidor { display: flex; align-items: center; gap: 10px; grid-column: 1 / -1; }
.medidor .md-trilho { flex: 1; height: 6px; border-radius: 3px; background: var(--bad-soft); overflow: hidden; }
.medidor .md-fill { height: 100%; background: var(--bad); border-radius: 3px; }
.medidor .md-fill.md-info { background: var(--info); }
.medidor span { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pend-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pend-num { font-size: 26px; font-weight: 700; line-height: 1.1; }
.pend-rot { font-size: 13px; color: var(--ink-3); }
.ver-mais { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; color: var(--info); background: none; border: 0; padding: 0; cursor: pointer; }
.ver-mais .ic { width: 15px; height: 15px; }

/* Linha do tempo */
.linha-tempo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lt-i { position: relative; padding: 8px 0 10px 18px; border-left: 2px solid var(--line); margin-left: 5px; }
.lt-i::before { content: ''; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-3); }
.lt-situacao::before { border-color: var(--warn-fill); }
.lt-cadastro::before, .lt-recebimento::before, .lt-importacao::before { border-color: var(--ok-fill); }
.lt-cautela::before, .lt-devolucao::before { border-color: var(--info); }
.lt-exclusao::before { border-color: var(--bad); }
.lt-cab { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.lt-tipo { font-weight: 700; font-size: 13.5px; }
.lt-qtd { font-size: 12px; padding: 0 6px; border-radius: 8px; background: var(--surface-3); font-variant-numeric: tabular-nums; }
.lt-cab time { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.lt-det { font-size: 13.5px; color: var(--ink-2); }
.lt-rota { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.lt-rota .ic { width: 13px; height: 13px; }
.lt-usr { font-size: 12px; color: var(--ink-3); }
.lt-mat { font-size: 13.5px; font-weight: 600; }

/* ---------- Viaturas ---------- */
.vtr-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 14px; }
.vtr-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--sombra); }
.vtr-topo { display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid var(--line); }
.vtr-pref { background: var(--accent); color: #fff; font-family: var(--f-display); font-size: 30px; letter-spacing: .05em; line-height: 1; padding: 12px 14px 9px; display: flex; align-items: center; min-width: 120px; justify-content: center; border-bottom: 3px solid var(--gold); }
.vtr-card.baixada .vtr-pref { background: var(--off); }
.vtr-id { padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
.vtr-id .mudo { font-size: 13px; }
.vtr-nums { display: grid; grid-template-columns: repeat(3, 1fr); padding: 12px 6px; }
.vtr-nums div { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
.vtr-nums b { font-size: 21px; font-variant-numeric: tabular-nums; }
.vtr-nums span { font-size: 12px; color: var(--ink-3); }
.vtr-nums .warn b { color: var(--warn); }
.vtr-nums .bad b { color: var(--bad); }
.vtr-acoes { display: flex; gap: 6px; padding: 0 12px 12px; margin-top: auto; }
.vtr-acoes .btn { flex: 1; }
.compart { margin-top: 14px; }
.compart h5 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }

/* ---------- Detalhes ---------- */
.det-cab { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.det-tit { font-size: 22px; font-weight: 700; line-height: 1.2; }
.det-sub { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.det-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.det-acoes { display: flex; gap: 6px; flex-wrap: wrap; }
.mil-posto { font-family: var(--f-display); font-size: 18px; letter-spacing: .06em; color: var(--accent); line-height: 1; }
.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; margin: 12px 0 0; }
.dl-l { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dl dt { color: var(--ink-3); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.resumo-item { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-lg); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.resumo-tit { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.resumo-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.resumo-loc { display: flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.resumo-loc .ic { width: 15px; height: 15px; }
.dobra { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-lg); }
.dobra > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.dobra[open] > summary { border-bottom: 1px solid var(--line); }
.dobra > .tab-wrap, .dobra > .dobra-corpo { padding: 0; }
.dobra-corpo { padding: 12px 14px !important; }

/* ---------- Estados ---------- */
.estado-vazio { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 36px 16px; color: var(--ink-2); }
.estado-vazio > .ic { width: 34px; height: 34px; color: var(--ink-3); }
.estado-vazio strong { font-size: 16px; color: var(--ink); }
.estado-vazio p { max-width: 46ch; font-size: 14px; }
.carregando { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 90; }
.carregando-box { display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--ink-2); }
.carregando-box .marca-selo { width: 56px; height: 56px; font-size: 25px; animation: pulsa 1.4s ease-in-out infinite; }
@keyframes pulsa { 50% { transform: scale(.94); opacity: .8; } }

/* ---------- Tela de acesso ---------- */
.acesso { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.acesso-card { width: min(900px, 100%); display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--sombra-alta); }
.acesso-marca { background: var(--nav-bg); color: var(--nav-ink); padding: 32px 28px; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden; }
.acesso-marca::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, var(--gold) 14px 28px); opacity: .9; }
.acesso-marca h1 { font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: .95; color: #fff; letter-spacing: .03em; }
.acesso-marca p { font-size: 15px; max-width: 34ch; }
.acesso-marca ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.acesso-marca li { display: flex; gap: 8px; align-items: center; }
.acesso-marca li .ic { color: var(--accent); width: 16px; height: 16px; }
.acesso-form { padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; }
.acesso-form h2 { font-size: 22px; }
.acesso-alt { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }

/* ---------- Janelas ---------- */
.modal-fundo { position: fixed; inset: 0; background: var(--veu); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; animation: surge .14s ease-out; }
@keyframes surge { from { opacity: 0; } }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--sombra-alta); width: 100%; display: flex; flex-direction: column; margin: auto 0; max-height: none; border: 1px solid var(--line); }
.modal:focus { outline: none; }
.modal-sm { max-width: 440px; }
.modal-md { max-width: 600px; }
.modal-lg { max-width: 820px; }
.modal-xl { max-width: 1080px; }
.modal-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.modal-tit { font-size: 18px; font-weight: 700; }
.modal-sub { color: var(--ink-3); font-size: 13.5px; margin-top: 2px; }
.modal-corpo { padding: 16px 18px; min-width: 0; }
.modal-rod { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 12px 12px; flex-wrap: wrap; }
.rod-nota { margin-right: auto; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-3); max-width: 62ch; }
.confirma-msg { font-size: 15px; color: var(--ink-2); }
.copia-area { font-family: var(--f-mono); font-size: 13px; margin-top: 8px; }

/* ---------- Avisos e dica ---------- */
.toasts { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 11px 10px 11px 14px; border-radius: var(--r-lg); background: var(--nav-bg); color: #f2f4f8; box-shadow: var(--sombra-alta); font-size: 14px; animation: entra .18s ease-out; }
.toast span { flex: 1; }
.toast .ic { margin-top: 1px; }
.toast-ok .ic:first-child { color: #4cd38a; }
.toast-erro { background: #5c1414; }
.toast-erro .ic:first-child { color: #ffb4ab; }
.toast-info .ic:first-child { color: #9cc2ff; }
.toast-x { background: none; border: 0; color: inherit; opacity: .7; cursor: pointer; padding: 0; display: grid; }
.toast-x .ic { width: 16px; height: 16px; margin: 0; }
.toast.saindo { opacity: 0; transform: translateY(6px); transition: .25s; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } }
.dica { position: fixed; z-index: 85; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--r); padding: 7px 10px; box-shadow: var(--sombra-alta); font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.dica-t { font-weight: 700; font-size: 12.5px; margin-bottom: 2px; }
.dica-l { display: flex; align-items: center; gap: 8px; }
.dica-l b { font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
.dica-l span { color: var(--ink-2); }
.dica-k { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

/* ---------- Configurações ---------- */
.conf-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.conf-grade .largo { grid-column: 1 / -1; }
.lista-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.imp-prev { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); }
.imp-prev .tab td, .imp-prev .tab th { padding: 6px 10px; font-size: 13px; }
.imp-resumo { display: flex; gap: 10px; flex-wrap: wrap; }
.imp-ok { color: var(--ok); font-weight: 600; }
.imp-erro { color: var(--bad); font-size: 12.5px; }
.grade-tam { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grade-tam h5 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.sug-l { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.sug-l:last-child { border-bottom: 0; }
.sug-l small { grid-column: 1; color: var(--ink-3); font-size: 13px; }
.resumo-faixa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

/* ---------- Folha (impressão) ---------- */
.folha-palco { background: var(--surface-3); padding: 18px; border-radius: var(--r); overflow-x: auto; }
.folha { background: var(--papel); color: var(--papel-ink); width: 100%; max-width: 794px; min-height: 400px; margin: 0 auto; padding: 36px 40px; font-family: var(--f-ui); font-size: 12.5px; line-height: 1.4; box-shadow: 0 2px 12px rgba(0, 0, 0, .18); }
.folha-cab { text-align: center; border-bottom: 2px solid var(--papel-ink); padding-bottom: 10px; margin-bottom: 14px; }
.folha-org { font-weight: 700; letter-spacing: .04em; font-size: 12.5px; }
.folha-uni { font-size: 11.5px; letter-spacing: .04em; }
.folha-tit { font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: .05em; margin-top: 8px; }
.folha-sub { font-size: 13px; margin-top: 4px; }
.folha-tab { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.folha-tab th, .folha-tab td { border: 1px solid var(--papel-linha); padding: 4px 6px; text-align: left; vertical-align: top; color: var(--papel-ink); }
.folha-tab th { background: #ececec; font-weight: 700; }
.folha-tab .num { text-align: right; white-space: nowrap; }
.folha-tab .ck { width: 34px; text-align: center; }
.folha-tab .ck span { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--papel-ink); }
.folha h3 { font-size: 13px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
.folha-nota { margin-top: 10px; font-size: 11.5px; }
.folha-ass { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 48px; text-align: center; font-size: 12px; }
.folha-ass span { display: block; border-top: 1px solid var(--papel-ink); margin-bottom: 4px; }
.folha-ass small { display: block; color: #444; }
.folha-rod { margin-top: 26px; font-size: 10px; color: #555; border-top: 1px solid #ccc; padding-top: 6px; }
.impressao { display: none; }
@media print {
  body.imprimindo > *:not(#impressao) { display: none !important; }
  body.imprimindo #impressao { display: block !important; }
  body.imprimindo { background: #fff !important; }
  body.imprimindo .folha { box-shadow: none; padding: 0; max-width: none; min-height: 0; }
  @page { size: A4; margin: 14mm 12mm; }
  .folha-tab tr { break-inside: avoid; }
}

/* ---------- Responsivo ---------- */
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); background: var(--bg); }
  .lateral { position: fixed; left: 0; top: 0; bottom: 0; width: min(290px, 86vw); z-index: 50; transform: translateX(-102%); transition: transform .2s ease; padding-top: env(safe-area-inset-top, 0px); }
  .app.menu-aberto .lateral { transform: none; box-shadow: var(--sombra-alta); }

  .btn-ic.topo-menu { display: inline-grid; }

  .topo-tit { flex: 1 1 0; }

  .busca-global { order: 5; width: 100%; margin-left: 0; }
  .conteudo { padding: 16px 16px 40px; }

  .acesso-card { grid-template-columns: 1fr; }
  .acesso-marca { padding: 24px 22px 30px; }
  .acesso-marca ul { display: none; }
}
@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-val { font-size: 25px; }
  .grade.g3, .grade.g2, .dl, .grade-tam, .resumo-faixa { grid-template-columns: minmax(0, 1fr); }
  .dl-l { grid-template-columns: 120px minmax(0, 1fr); }
  .filtros input[type=search] { max-width: none; flex-basis: 100%; }
  .filtros select { flex: 1 1 45%; max-width: none; }
  .cl-cab, .fi-cab { display: none; }
  .cl-linha { grid-template-columns: 1fr 1fr 36px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-lg); }
  .cl-linha .cl-mat, .cl-linha .cl-origem { grid-column: 1 / -1; }
  .cl-linha .cl-id { grid-column: 1 / 3; }
  .cl-linha .cl-rem { grid-row: 1; grid-column: 3; }
  .cl-linha .cl-mat { grid-column: 1 / 3; }
  .fi-linha { grid-template-columns: 1fr 1fr 36px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-lg); }
  .fi-linha > :first-child { grid-column: 1 / 3; }
  .fi-linha .fi-desc { grid-column: 1 / -1; }
  .topo-tit h1 { font-size: 26px; }
  .topo-tit span, .status-vivo { display: none; }
  .chip-perfil small { display: none; }
  .topo-acesso .btn { padding: 6px 9px; }
  .faixa { font-size: 12.5px; padding: 7px 16px; }
  .modal-fundo { padding: 0; }
  .modal { border-radius: 0; min-height: 100%; margin: 0; border: 0; }
  .modal-rod { border-radius: 0; position: sticky; bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  .modal-cab { position: sticky; top: 0; background: var(--surface); z-index: 2; padding-top: max(16px, env(safe-area-inset-top, 0px)); }
  .folha { padding: 20px; }
  .barra-l { grid-template-columns: minmax(80px, 34%) minmax(0, 1fr) 44px; }
  /* tabelas viram cartões */
  .tab.tab-cards thead { display: none; }
  .tab.tab-cards, .tab.tab-cards tbody, .tab.tab-cards tr, .tab.tab-cards td { display: block; width: 100%; }
  .tab.tab-cards tr { border-bottom: 1px solid var(--line); padding: 8px 4px; }
  .tab.tab-cards tr.tr-vazia { border: 0; }
  .tab.tab-cards td { border: 0; padding: 4px 10px; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; text-align: left; }
  .tab.tab-cards td::before { content: attr(data-rot); color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
  .tab.tab-cards td[data-rot=""]::before, .tab.tab-cards td.col-acoes::before { content: none; }
  .tab.tab-cards td[data-rot=""], .tab.tab-cards td.col-acoes { grid-template-columns: minmax(0, 1fr); }
  .tab.tab-cards td.col-acoes { width: 100%; }
  .tab.tab-cards td.col-acoes .acoes-linha { justify-content: flex-start; }
  .tab.tab-cards td.num { text-align: left; }
  .tab.tab-cards .tr-vazia td { display: block; }
  .tab.tab-cards .tr-vazia td::before { content: none; }
  .cel-mat { min-width: 0; }
}

.perfil-ic .ic { width: 20px; height: 20px; }

.epi-obs .ic { width: 14px; height: 14px; flex: none; margin-top: 1px; }
.epi-grupo:not(:has(.marcado)) .epi-mais { display: none; }
.epi-mais { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; margin-left: 28px; }
.epi-mais .ic { width: 14px; height: 14px; }

/* Avariados */
.kpis-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 12px; }
.kpi.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cel-avaria { flex-direction: column; align-items: flex-start; gap: 3px; }
.cel-avaria .avaria-txt { white-space: normal; color: var(--ink); font-size: 13.5px; }
.cel-avaria .av-sei { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.aviso-sei { margin-top: 4px; font-size: 13px; }
.lista-escolha { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; max-height: 52vh; overflow: auto; }
.escolha { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
.escolha:hover, .escolha:focus-visible { border-color: var(--accent); background: var(--accent-soft); }

@media (max-width: 980px) {
  .kpis-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .abas-sb { overflow-x: auto; flex-wrap: nowrap; }
  .abas-sb button { white-space: nowrap; }
  .vtr-faixa .vtr-pref { min-width: 100%; border-right: 0; border-bottom: 3px solid var(--gold); }
  .epi-cab { display: none; }
  .epi-linha { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .epi-linha .epi-tipo { grid-column: 1 / -1; }
  .epi-linha .epi-desc { grid-column: 1 / -1; }
  .epi-mais { margin-left: 0; }
  .escolha { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .tab-efetivo.tab-cards td.col-epi { display: inline-flex; width: auto; grid-template-columns: none; padding: 2px 6px; gap: 4px; }
  .tab-efetivo.tab-cards td.col-epi::before { content: attr(data-rot); font-size: 11px; }
  .seg-vista { width: 100%; }
  .seg-vista button { flex: 1; justify-content: center; }
}

function csvCampo(v) {

function gerarCSV(colunas, linhas) {
  const cab = colunas.map(c => csvCampo(c[0])).join(';');

  return '﻿' + [cab, ...corpo].join('\r\n');
}
/** Lê CSV (separador ; , ou tabulação — inclusive linhas coladas de planilha). */
function parseCSV(texto) {
  texto = String(texto ?? '').replace(/^﻿/, '');
  const prim = texto.split(/\r?\n/, 1)[0] || '';
  const cont = ch => prim.split(ch).length - 1;
  const sep = cont('\t') > 0 && cont('\t') >= cont(';') ? '\t' : (cont(';') >= cont(',') ? ';' : ',');
  const linhas = []; let campo = '', linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; }
      else campo += c;
    } else if (c === '"' && campo === '') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {

    } else campo += c;

  return linhas.filter(l => l.some(x => String(x).trim() !== ''));
}

function baixar(nome, conteudo, tipo = 'text/csv;charset=utf-8') {

}

function lerArquivoTexto(arquivo) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      let t = String(fr.result || '');
      // Arquivo salvo pelo Excel em ANSI: troca para Latin-1 se vierem caracteres inválidos
      if (t.includes('\uFFFD')) {
        const fr2 = new FileReader();
        fr2.onload = () => res(String(fr2.result || ''));
        fr2.onerror = () => res(t);
        fr2.readAsText(arquivo, 'windows-1252');
      } else res(t);
    };
    fr.onerror = () => rej(new Error('Não foi possível ler o arquivo.'));
    fr.readAsText(arquivo, 'utf-8');
  });
}

function ic(nome, cls = '') {
  return `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONES[nome] || ''}</svg>`;
}

/* ---------- Avisos rápidos (toast) ---------- */
function toast(msg, tipo = 'ok', ms = 4200) {
  const root = $('#toasts'); if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast toast-' + tipo;
  el.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
  el.innerHTML = ic(tipo === 'erro' ? 'alerta' : tipo === 'info' ? 'info' : 'check') + '<span></span><button class="toast-x" aria-label="Fechar aviso">' + ic('x') + '</button>';
  $('span', el).textContent = msg;
  $('.toast-x', el).addEventListener('click', () => el.remove());
  root.appendChild(el);
  setTimeout(() => { el.classList.add('saindo'); setTimeout(() => el.remove(), 260); }, ms);
}
function erroToast(e) {
  if (!(e instanceof ErroApp)) console.error(e);
  toast(e && e.message ? e.message : 'Não foi possível concluir a operação.', 'erro', 7000);
}

/* ---------- Janelas (modais) ---------- */
const MODAIS = [];
let contModal = 0;
function abrirModal({ titulo, subtitulo = '', corpo = '', rodape = '', largura = 'md', classe = '', fecharNoFundo = true, aoFechar = null }) {
  const n = ++contModal;
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.innerHTML = `
    <div class="modal modal-${largura} ${classe}" role="dialog" aria-modal="true" aria-labelledby="mt${n}" tabindex="-1">
      <header class="modal-cab">
        <div class="modal-cab-txt"><h2 class="modal-tit" id="mt${n}"></h2>${subtitulo ? `<div class="modal-sub">${subtitulo}</div>` : ''}</div>
        <button type="button" class="btn-ic" data-fechar aria-label="Fechar">${ic('x')}</button>
      </header>
      <div class="modal-corpo">${corpo}</div>
      ${rodape ? `<footer class="modal-rod">${rodape}</footer>` : ''}
    </div>`;
  $('.modal-tit', fundo).textContent = titulo;
  $('#modais').appendChild(fundo);
  const m = { el: fundo, card: $('.modal', fundo), aoFechar, anterior: document.activeElement };
  m.fechar = () => fecharModal(m);
  let desceuNoFundo = false;
  fundo.addEventListener('mousedown', e => { desceuNoFundo = e.target === fundo; });
  fundo.addEventListener('click', e => {
    if (e.target.closest('[data-fechar]')) { fecharModal(m); return; }
    if (fecharNoFundo && e.target === fundo && desceuNoFundo) fecharModal(m);
  });
  MODAIS.push(m);
  document.body.classList.add('com-modal');
  requestAnimationFrame(() => {
    const alvo = $('[autofocus]', fundo) || $('.modal-corpo input:not([type=hidden]):not([disabled]):not([readonly]), .modal-corpo select, .modal-corpo textarea', fundo);
    (alvo || m.card).focus({ preventScroll: true });
  });
  return m;
}
function fecharModal(m) {
  const i = MODAIS.indexOf(m); if (i < 0) return;
  MODAIS.splice(i, 1);
  m.el.remove();
  if (!MODAIS.length) document.body.classList.remove('com-modal');
  try { m.aoFechar && m.aoFechar(); } catch (e) { console.error(e); }
  if (m.anterior && document.contains(m.anterior)) m.anterior.focus({ preventScroll: true });
}
function fecharTodosModais() { while (MODAIS.length) fecharModal(MODAIS[MODAIS.length - 1]); }
document.addEventListener('keydown', e => {
  if (!MODAIS.length) return;
  const topo = MODAIS[MODAIS.length - 1];
  if (e.key === 'Escape') { e.preventDefault(); fecharModal(topo); return; }
  if (e.key === 'Tab') {
    const foc = $$('button:not([disabled]), [href], input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', topo.card).filter(x => x.offsetParent !== null);
    if (!foc.length) return;
    const pri = foc[0], ult = foc[foc.length - 1];
    if (e.shiftKey && document.activeElement === pri) { e.preventDefault(); ult.focus(); }
    else if (!e.shiftKey && document.activeElement === ult) { e.preventDefault(); pri.focus(); }
  }
});

function confirmar({ titulo = 'Confirmar', mensagem = '', botao = 'Confirmar', perigo = false }) {
  return new Promise(resolve => {
    let decidiu = false;
    const m = abrirModal({
      titulo, largura: 'sm',
      corpo: `<p class="confirma-msg"></p>`,
      rodape: `<button type="button" class="btn" data-fechar>Cancelar</button><button type="button" class="btn ${perigo ? 'btn-perigo' : 'btn-pri'}" data-ok>${esc(botao)}</button>`,
      aoFechar: () => { if (!decidiu) resolve(false); }
    });
    $('.confirma-msg', m.el).textContent = mensagem;
    const ok = $('[data-ok]', m.el);
    ok.addEventListener('click', () => { decidiu = true; resolve(true); fecharModal(m); });
    requestAnimationFrame(() => ok.focus());
  });
}

/** Abre um formulário em janela. aoSalvar(dados, form, modal) pode lançar erro (mostrado no próprio formulário). */
function abrirForm({ titulo, subtitulo = '', corpo, botao = 'Salvar', largura = 'md', aoSalvar, aoAbrir, perigo = false }) {
  const m = abrirModal({
    titulo, subtitulo, largura, fecharNoFundo: false,
    corpo: `<form class="form" novalidate><div class="form-erro" role="alert" hidden></div>${corpo}<button type="submit" hidden></button></form>`,
    rodape: `<button type="button" class="btn" data-fechar>Cancelar</button><button type="button" class="btn ${perigo ? 'btn-perigo' : 'btn-pri'}" data-salvar>${esc(botao)}</button>`
  });
  const form = $('form', m.el);
  const btn = $('[data-salvar]', m.el);
  const erroEl = $('.form-erro', m.el);
  const enviar = async (e) => {
    if (e) e.preventDefault();
    if (btn.disabled) return;
    erroEl.hidden = true;
    btn.disabled = true; btn.classList.add('carregando');
    try {
      const r = await aoSalvar(lerForm(form), form, m);
      if (r !== false) fecharModal(m);
    } catch (err) {
      if (!(err instanceof ErroApp)) console.error(err);
      erroEl.textContent = err && err.message ? err.message : 'Não foi possível salvar.';
      erroEl.hidden = false;
      erroEl.scrollIntoView({ block: 'nearest' });
    } finally { btn.disabled = false; btn.classList.remove('carregando'); }
  };
  form.addEventListener('submit', enviar);
  btn.addEventListener('click', enviar);
  if (aoAbrir) aoAbrir(form, m);
  return m;
}

/* ---------- Campos de formulário ---------- */
function attrs(o = {}) {
  return Object.entries(o).filter(([, v]) => v !== false && v !== null && v !== undefined)
    .map(([k, v]) => v === true ? k : `${k}="${esc(v)}"`).join(' ');
}
function fld(rotulo, controle, { dica = '', obrig = false, classe = '', escondido = false } = {}) {
  return `<label class="fld ${classe}"${escondido ? ' hidden' : ''}><span class="fld-rot">${esc(rotulo)}${obrig ? '<b class="obrig" aria-hidden="true"> *</b>' : ''}</span>${controle}${dica ? `<small class="fld-dica">${dica}</small>` : ''}</label>`;
}
function inp(nome, valor, a = {}) { return `<input name="${nome}" value="${esc(valor ?? '')}" ${attrs(Object.assign({ type: 'text', autocomplete: 'off' }, a))}>`; }
function txa(nome, valor, a = {}) { return `<textarea name="${nome}" ${attrs(Object.assign({ rows: 3 }, a))}>${esc(valor ?? '')}</textarea>`; }
/** opcoes: [[valor, rótulo], ...] ou [{grupo, itens:[[v,r]...]}] */
function slc(nome, opcoes, valor, a = {}, vazioRot = null) {
  const v = valor === null || valor === undefined ? '' : String(valor);
  const op = ([ov, or]) => `<option value="${esc(ov)}"${String(ov) === v ? ' selected' : ''}>${esc(or)}</option>`;
  let html = vazioRot !== null ? `<option value="">${esc(vazioRot)}</option>` : '';
  for (const o of opcoes) {
    if (o && o.grupo) html += `<optgroup label="${esc(o.grupo)}">${o.itens.map(op).join('')}</optgroup>`;
    else html += op(o);
  }
  return `<select name="${nome}" ${attrs(a)}>${html}</select>`;
}
function chk(nome, marcado, rotulo, a = {}) {
  return `<label class="chk"><input type="checkbox" name="${nome}"${marcado ? ' checked' : ''} ${attrs(a)}><span>${esc(rotulo)}</span></label>`;
}
function lerForm(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name || el.disabled) continue;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value;
  }
  return o;
}
function datalist(id, valores) { return `<datalist id="${id}">${valores.map(v => `<option value="${esc(v)}"></option>`).join('')}</datalist>`; }

/* ---------- Tabelas ---------- */
const ORDEM_TAB = {};
const LIMITE_TAB = {};
function tabela({ chave, colunas, linhas, vazio = 'Nenhum registro encontrado.', limite = 120, attrsLinha = null, classe = '' }) {
  const ord = ORDEM_TAB[chave];
  let ls = linhas;
  if (ord) {
    const col = colunas.find(c => c.id === ord.col);
    if (col && col.ordem) ls = [...linhas].sort((a, b) => cmp(col.ordem(a), col.ordem(b)) * (ord.dir === 'desc' ? -1 : 1));
  }
  const lim = LIMITE_TAB[chave] || limite;
  const vis = ls.slice(0, lim);
  const th = colunas.map(c => {
    const ativo = ord && ord.col === c.id;
    const sortAttr = c.ordem ? ` aria-sort="${ativo ? (ord.dir === 'desc' ? 'descending' : 'ascending') : 'none'}"` : '';
    const conteudo = c.ordem
      ? `<button type="button" class="th-ord" data-acao="ordenar" data-tab="${chave}" data-col="${c.id}">${esc(c.rotulo)}<span class="th-seta" aria-hidden="true">${ativo ? (ord.dir === 'desc' ? '↓' : '↑') : '↕'}</span></button>`
      : esc(c.rotulo);
    return `<th scope="col" class="${c.classe || ''}"${sortAttr}>${conteudo}</th>`;
  }).join('');
  const corpo = vis.length
    ? vis.map(l => `<tr ${attrsLinha ? attrsLinha(l) + ' tabindex="0"' : ''}>${colunas.map(c => `<td class="${c.classe || ''}" data-rot="${esc(c.rotulo)}"><div class="td-c">${c.html(l)}</div></td>`).join('')}</tr>`).join('')
    : `<tr class="tr-vazia"><td colspan="${colunas.length}"><div class="tab-vazio">${vazio}</div></td></tr>`;
  return `<div class="tab-wrap"><table class="tab ${classe}"><thead><tr>${th}</tr></thead><tbody>${corpo}</tbody></table></div>` +
    (ls.length > lim ? `<div class="tab-mais"><span>Mostrando ${fmtNum(lim)} de ${fmtNum(ls.length)}</span><button type="button" class="btn btn-sm" data-acao="mostrar-mais" data-tab="${chave}">Mostrar mais</button></div>` : '');
}

/* ---------- Distintivos ---------- */
function rotuloCategoria(c) {
  if (!c) return '';
  const def = CATEGORIAS[c.categoria] || CATEGORIAS.OUTROS;
  return c.categoria === 'OUTROS' && c.categoria_outros ? `Outros · ${c.categoria_outros}` : def.rotulo;

function b64utf8(txt) {
  const bytes = new TextEncoder().encode(String(txt || ''));

}

class ErroApp extends Error {}

function normalizarLinha(tabela, r) {
  if (!r) return r;
  for (const c of (CAMPOS_NUM[tabela] || [])) if (r[c] !== null && r[c] !== undefined && r[c] !== '') r[c] = Number(r[c]);
  for (const c of ['id', 'sb_id', 'viatura_id', 'catalogo_id', 'item_id', 'militar_id', 'tipo_id', 'fafd_id', 'sb_origem', 'sb_destino'])
    if (r[c] !== null && r[c] !== undefined && r[c] !== '') r[c] = Number(r[c]);
  return r;
}
const ORDEM_POSTO = new Map(POSTOS.map((p, i) => [p, i]));
function ordenarTabelas() {
  S.sbs.sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || (a.numero || 0) - (b.numero || 0));
  const ordSb = new Map(S.sbs.map((s, i) => [s.id, i]));
  S.viaturas.sort((a, b) => (ordSb.get(a.sb_id) ?? 99) - (ordSb.get(b.sb_id) ?? 99) || cmp(a.prefixo, b.prefixo));
  S.catalogo.sort((a, b) => cmp(a.nome, b.nome));
  S.militares.sort((a, b) => cmp(a.ordem ?? null, b.ordem ?? null) || (ORDEM_POSTO.get(a.posto_grad) ?? 99) - (ORDEM_POSTO.get(b.posto_grad) ?? 99) || cmp(a.nome, b.nome));
  S.epi_tipos.sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || cmp(a.nome, b.nome));

/* ---------- Permissões (o banco aplica as mesmas regras) ---------- */
const ehGeral = () => !!SESSAO && SESSAO.papel === 'GERAL';

function militarCompleto(m) { return m ? `${m.posto_grad}${m.quadro ? ' ' + m.quadro : ''} ${m.nome}${m.matricula ? ' — mat. ' + m.matricula : ''}` : ''; }

function descItem(i) {

const foraDeUso = i => i.situacao !== 'OPERACIONAL';
/** Totais por material: em condições, quebrado, manutenção, inservível. */
function resumoMateriais(itens = null) {
  if (!itens && IDX._resumo) return IDX._resumo;
  const r = new Map();
  const get = id => { if (!r.has(id)) r.set(id, { op: 0, av: 0, man: 0, ins: 0, total: 0, regs: 0 }); return r.get(id); };
  for (const i of itens || S.itens) {
    const x = get(i.catalogo_id); const q = Number(i.quantidade) || 0; x.regs++;
    if (i.situacao === 'OPERACIONAL') x.op += q; else if (i.situacao === 'AVARIADO') x.av += q; else if (i.situacao === 'MANUTENCAO') x.man += q; else x.ins += q;

/* ---------- EPI do efetivo ---------- */

/* ---------- Validação (antes de enviar ao banco) ---------- */
function validar(tabela, l, idAtual = null, lote = []) {
  const outros = arr => arr.filter(x => x.id !== idAtual);
  switch (tabela) {
    case 'sbs':
      if (vazio(l.nome)) return 'Informe o nome da SB.';
      if (!(Number(l.numero) > 0)) return 'Informe o número da SB (1, 2, 3…).';
      if (outros(S.sbs).some(s => norm(s.nome) === norm(l.nome))) return `Já existe a SB "${l.nome}".`;
      if (outros(S.sbs).some(s => Number(s.numero) === Number(l.numero))) return `Já existe uma SB com o número ${l.numero}.`;
      break;
    case 'viaturas':
      if (vazio(l.prefixo)) return 'Informe o prefixo da viatura.';
      if (!l.sb_id) return 'Informe a SB da viatura.';
      if (outros(S.viaturas).some(v => norm(v.prefixo) === norm(l.prefixo))) return `A viatura ${l.prefixo} já está cadastrada.`;
      break;
    case 'catalogo':
      if (vazio(l.nome)) return 'Informe o nome do material.';
      if (!CATEGORIAS[l.categoria]) return 'Escolha a área do material.';
      if (l.categoria === 'OUTROS' && vazio(l.categoria_outros)) return 'Para a área Outros, especifique qual (ex.: Comunicação, Iluminação).';
      if (outros(S.catalogo).some(c => norm(c.nome) === norm(l.nome))) return `O material "${l.nome}" já existe no catálogo.`;
      if (l.estoque_minimo !== null && l.estoque_minimo !== undefined && l.estoque_minimo < 0) return 'O mínimo não pode ser negativo.';
      break;
    case 'itens': {
      if (!l.catalogo_id) return 'Informe o material.';
      if (!l.sb_id) return 'Informe a SB onde o material se encontra.';
      if (!(Number(l.quantidade) > 0)) return 'A quantidade deve ser maior que zero.';
      if (l.patrimonio) {
        if (Number(l.quantidade) !== 1) return 'Item com patrimônio tem quantidade 1. Para vários, informe um patrimônio por linha.';
        const p = norm(l.patrimonio);
        const dup = outros(S.itens).find(i => i.patrimonio && norm(i.patrimonio) === p);
        if (dup) return `O patrimônio ${l.patrimonio} já está cadastrado (${catNome(dup.catalogo_id)}, ${localTexto(dup)}).`;
        if (lote.filter(x => x.patrimonio && norm(x.patrimonio) === p).length > 1) return `O patrimônio ${l.patrimonio} aparece repetido.`;
      }
      if (l.situacao && l.situacao !== 'OPERACIONAL' && vazio(l.avaria)) return 'Descreva a avaria ou o motivo para material fora de condições de uso.';
      break;
    }
    case 'militares':

      if (l.matricula && outros(S.militares).some(m => m.matricula && norm(m.matricula) === norm(l.matricula))) return `A matrícula ${l.matricula} já está cadastrada.`;
      break;
    case 'epi_tipos':
      if (vazio(l.nome)) return 'Informe o nome do tipo de EPI.';
      if (outros(S.epi_tipos).some(t => norm(t.nome) === norm(l.nome))) return `O tipo "${l.nome}" já existe.`;
      break;
    case 'epis':
      if (!l.militar_id) return 'Informe o militar.';
      if (!l.tipo_id) return 'Informe o tipo de EPI.';
      if (!(Number(l.quantidade) > 0)) return 'A quantidade deve ser maior que zero.';
      break;
    case 'perfis':
      if (vazio(l.rotulo)) return 'Informe o nome do perfil (ex.: 5ª SB).';
      if (!/^[^@\s]+@[^@\s]+$/.test(String(l.email || '').trim())) return 'Informe o e-mail da conta criada no Supabase.';
      if (l.papel === 'SB' && !l.sb_id) return 'Escolha a SB do perfil.';
      if (outros(S.perfis).some(p => norm(p.email) === norm(l.email))) return 'Já existe um perfil com esse e-mail.';
      break;
    case 'fafd':
      if (vazio(l.numero)) return 'Informe o número da FAFD.';
      break;
    case 'fafd_itens':
      if (!l.catalogo_id) return 'Informe o material solicitado.';

/* ---------- Adaptador: Supabase ---------- */
/** Sessão guardada só nesta aba (fechar o navegador encerra o acesso). */
function armazenamentoDaAba() {
  const mem = {};
  let ss = null;
  try { sessionStorage.setItem('__smat', '1'); sessionStorage.removeItem('__smat'); ss = sessionStorage; } catch (e) { ss = null; }
  return {
    getItem: k => { try { return ss ? ss.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return k in mem ? mem[k] : null; } },
    setItem: (k, v) => { try { if (ss) ss.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } },
    removeItem: k => { try { if (ss) ss.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; } }
  };
}
class AdapterSupabase {
  constructor(url, chave) {
    this.sb = window.supabase.createClient(url, chave, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: armazenamentoDaAba(), storageKey: 'smat-7gb-sessao' },
      realtime: { params: { eventsPerSecond: 5 } }
    });
    this.canal = null;
    this.cabecalho = true;   // envia o nome informado ao entrar (cabeçalho x-editor) para o histórico e a auditoria
  }
  async perfisAcesso() {
    const { data, error } = await this.sb.rpc('fn_perfis_acesso');
    if (error) throw traduzirErro(error);
    return data || [];
  }
  async entrar(email, senha) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: senha });
    if (error) throw traduzirErro(error);
    return data.session;
  }
  async sessao() { const { data, error } = await this.sb.auth.getSession(); if (error) throw traduzirErro(error); return data.session; }
  /** Sai só neste navegador: quem usa o mesmo perfil em outro computador continua conectado. */
  async sair() { this.desassinar(); await this.sb.auth.signOut({ scope: 'local' }); }
  async alterarSenha(senha) { const { error } = await this.sb.auth.updateUser({ password: senha }); if (error) throw traduzirErro(error); }
  /** O banco já recebeu o script desta versão? (sem a tabela ou sem permissão, não bloqueia nada) */
  async versaoBancoOk(versao) {
    const { data, error } = await this.sb.from('versao_banco').select('versao');
    return error || !Array.isArray(data) ? true : data.some(r => r.versao === versao);
  }
  async meuPerfil(uid) {
    const { data, error } = await this.sb.from('perfis').select('*').eq('usuario_id', uid).maybeSingle();
    if (error) throw traduzirErro(error);
    return data;
  }
  _ed(q) { return this.cabecalho && SESSAO && SESSAO.nome ? q.setHeader('x-editor', b64utf8(SESSAO.nome)) : q; }
  /** Confere se o servidor aceita o cabeçalho com o nome; se não aceitar, grava sem ele. */
  async testarCabecalho() {
    this.cabecalho = true;
    try {
      const { error } = await this._ed(this.sb.from('sbs').select('id').limit(1));
      if (error && /fetch|network|load failed/i.test(String(error.message || ''))) this.cabecalho = false;
    } catch (e) { this.cabecalho = false; }
  }
  async _todos(tabela, ordem = 'id') {
    const tam = 1000; let de = 0; const out = [];
    for (;;) {
      const { data, error } = await this.sb.from(tabela).select('*').order(ordem, { ascending: true }).range(de, de + tam - 1);
      if (error) throw traduzirErro(error);
      out.push(...data);
      if (data.length < tam) break;
      de += tam;
    }
    return out;
  }
  async carregarTudo() {
    const nomes = [...TABELAS, 'perfis'];
    const res = await Promise.all(nomes.map(t => this._todos(t)));
    const t = {}; nomes.forEach((n, i) => t[n] = res[i]);
    t.movimentacoes = await this.movimentacoes({ limite: 500 });
    return t;
  }
  async inserir(tabela, linhas) {
    const out = [];
    for (let i = 0; i < linhas.length; i += 400) {
      const { data, error } = await this._ed(this.sb.from(tabela).insert(linhas.slice(i, i + 400)).select());
      if (error) throw traduzirErro(error);
      out.push(...data);
    }
    return out;
  }
  async atualizar(tabela, id, patch) {
    const { data, error } = await this._ed(this.sb.from(tabela).update(patch).eq('id', id).select().single());
    if (error) throw traduzirErro(error);
    return data;
  }
  async excluir(tabela, id) {
    const { data, error } = await this._ed(this.sb.from(tabela).delete().eq('id', id).select('id'));
    if (error) throw traduzirErro(error);
    if (!data || !data.length) throw new ErroApp('Registro não encontrado ou sem permissão para excluí-lo.');
  }
  async rpc(nome, args) {
    const { data, error } = await this._ed(this.sb.rpc(nome, args));
    if (error) throw traduzirErro(error);
    return data;
  }
  async movimentacoes({ item_id = null, limite = 300 } = {}) {
    let q = this.sb.from('movimentacoes').select('*').order('id', { ascending: false }).limit(limite);
    if (item_id) q = q.eq('item_id', item_id);
    const { data, error } = await q;
    if (error) throw traduzirErro(error);
    return data;
  }
  async todasMovimentacoes() { return this._todos('movimentacoes'); }
  async listarPerfis() { return this._todos('perfis'); }
  async auditoria(limite = 150) {
    const { data, error } = await this.sb.from('auditoria').select('*').order('id', { ascending: false }).limit(limite);
    if (error) throw traduzirErro(error);
    return data;
  }
  assinar(aoMudar, aoStatus) {
    this.desassinar();
    this.canal = this.sb.channel('smat-mudancas')
      .on('postgres_changes', { event: '*', schema: 'public' }, p => aoMudar(p))
      .subscribe(st => aoStatus && aoStatus(st));
  }
  desassinar() { if (this.canal) { try { this.sb.removeChannel(this.canal); } catch (e) { /* */ } this.canal = null; } }
}

/* ---------- Operações básicas (validam, gravam e atualizam a memória) ---------- */
function upsertMem(tabela, r) {
  const i = S[tabela].findIndex(x => x.id === r.id);
  if (i >= 0) S[tabela][i] = r; else S[tabela].push(r);
}
function aplicarResultadoRpc(r) {
  if (!r) return;
  const up = row => { if (row) upsertMem('itens', normalizarLinha('itens', Object.assign({}, row))); };
  (r.itens || []).forEach(up); up(r.item); up(r.origem); up(r.destino);
  if (r.removido) {
    const rem = Number(r.removido);
    S.itens = S.itens.filter(x => x.id !== rem);
    const novo = r.destino ? Number(r.destino.id) : null;
    S.movimentacoes.forEach(m => { if (m.item_id === rem) m.item_id = novo; });
  }
  for (const m of [...(r.movs || []), ...(r.mov ? [r.mov] : [])]) {
    const mv = normalizarLinha('movimentacoes', Object.assign({}, m));
    if (!S.movimentacoes.some(x => x.id === mv.id)) S.movimentacoes.unshift(mv);
  }
  S.movimentacoes.sort((a, b) => b.id - a.id);
}
const DB = {
  async inserir(tabela, linhaOuLinhas) {
    exigeEdicao();
    const linhas = (Array.isArray(linhaOuLinhas) ? linhaOuLinhas : [linhaOuLinhas]).map(l => Object.assign({}, l));
    for (const l of linhas) {
      const erro = validar(tabela, Object.assign(PADROES[tabela] ? PADROES[tabela]() : {}, l), null, linhas);
      if (erro) throw new ErroApp(erro);
      checarEscopo(tabela, 'insert', l);
    }
    let out;
    try { out = await ADAPTER.inserir(tabela, linhas); } catch (e) { throw traduzirErro(e); }
    out = out.map(r => normalizarLinha(tabela, r));
    for (const r of out) upsertMem(tabela, r);
    reindexar();
    return Array.isArray(linhaOuLinhas) ? out : out[0];
  },
  async atualizar(tabela, id, patch) {
    exigeEdicao();
    const atual = S[tabela].find(x => x.id === id);
    if (!atual) throw new ErroApp('Registro não encontrado. Atualize a página.');
    const novo = Object.assign({}, atual, patch);
    const erro = validar(tabela, novo, id);
    if (erro) throw new ErroApp(erro);
    checarEscopo(tabela, 'update', novo, atual);
    let r;
    try { r = await ADAPTER.atualizar(tabela, id, patch); } catch (e) { throw traduzirErro(e); }
    r = normalizarLinha(tabela, r);
    upsertMem(tabela, r);
    reindexar();
    return r;
  },
  async excluir(tabela, id) {
    exigeEdicao();
    const atual = S[tabela].find(x => x.id === id);
    if (!atual) throw new ErroApp('Registro não encontrado. Atualize a página.');
    checarEscopo(tabela, 'delete', atual, atual);
    const b = bloqueioExclusao(tabela, id);
    if (b) throw new ErroApp(b);
    try { await ADAPTER.excluir(tabela, id); } catch (e) { throw traduzirErro(e); }
    S[tabela] = S[tabela].filter(x => x.id !== id);
    const nulo = (t, c) => S[t].forEach(r => { if (r[c] === id) r[c] = null; });
    if (tabela === 'fafd') { S.fafd_itens = S.fafd_itens.filter(x => x.fafd_id !== id); nulo('aquisicoes', 'fafd_id'); }
    if (tabela === 'sbs') { nulo('militares', 'sb_id'); nulo('fafd', 'sb_id'); nulo('aquisicoes', 'sb_id'); }
    reindexar();
  },
  /** Operações com material: executadas pelo banco numa única transação, com histórico. */
  async rpc(nome, args) {
    exigeEdicao();
    let r;
    try { r = await ADAPTER.rpc(nome, args); } catch (e) { throw traduzirErro(e); }
    aplicarResultadoRpc(r);
    reindexar();
    return r;
  }
};

/** Mesmo que o servidor envie, cada SB só guarda o que é seu. */
function visivelLocal(t, r) {
  if (ehGeral()) return true;
  if (['itens', 'viaturas', 'militares', 'aquisicoes'].includes(t)) return r.sb_id === minhaSb();
  if (t === 'epis') return acessaMilitar(IDX.militar.get(r.militar_id));
  if (t === 'fafd' || t === 'fafd_itens') return false;
  return true;
}
/** Aplica uma mudança recebida em tempo real (de outro usuário ou desta sessão). */
function aplicarMudancaRemota(p) {
  const t = p.table;
  if (t === 'movimentacoes') {
    if (p.eventType === 'INSERT' && p.new && !S.movimentacoes.some(m => m.id === Number(p.new.id))) {
      const m = normalizarLinha(t, Object.assign({}, p.new));
      S.movimentacoes.unshift(m);
      S.movimentacoes.sort((a, b) => b.id - a.id);
      // material ou viatura saiu desta SB: recarrega para tirar da tela o que foi embora
      if (!ehGeral() && m.sb_origem !== m.sb_destino && m.sb_origem === minhaSb()) PEDIR_RECARGA = true;
    }
    return true;
  }
  if (t === 'perfis') {
    const r = p.new ? normalizarLinha(t, Object.assign({}, p.new)) : null;
    if (SESSAO && r && r.id === SESSAO.perfilId && (r.ativo === false || r.papel !== SESSAO.papel || (r.sb_id ?? null) !== (SESSAO.sbId ?? null))) PEDIR_SAIDA = true;
    if (ehGeral()) { if (p.eventType === 'DELETE') S.perfis = S.perfis.filter(x => x.id !== Number(p.old && p.old.id)); else if (r) upsertMem('perfis', r); }
    return true;
  }
  if (!S[t]) return false;
  if (p.eventType === 'DELETE') {
    const id = p.old && p.old.id !== undefined ? Number(p.old.id) : undefined;
    if (id !== undefined) S[t] = S[t].filter(x => x.id !== id);
  } else if (p.new) {
    const r = normalizarLinha(t, Object.assign({}, p.new));
    if (!visivelLocal(t, r)) S[t] = S[t].filter(x => x.id !== r.id);
    else upsertMem(t, r);
  }
  return true;
}
